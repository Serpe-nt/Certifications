  q: 'Three Alloy replicas run with --cluster.enabled and the same <code>prometheus.scrape "app"</code>, which has no clustering block. How often is each target scraped?'
  options:
    - text: "Three times per interval, once by each replica"
      why: "Without a clustering block in the component, every replica scrapes every target."
    - text: "Once per interval, by the replica that owns each target"
