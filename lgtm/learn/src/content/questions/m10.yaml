- id: q-m10-031
  tags: [alloy-clustering]
  exam: {cert: none}
  q: "A clustered scrape runs on four replicas. One replica is removed. What happens to the targets?"
  options:
    - text: "Every target is reassigned, and all replicas start over"
      why: "Consistent hashing moves only the targets of the node that left."
    - text: "The removed replica's targets stay unscraped until it returns"
      why: "The remaining replicas pick up those targets."
    - text: "The others take over its share; about 1/N of targets move"
      why: "Consistent hashing redistributes only about 1/N of the targets when the cluster size changes."
    - text: "A leader replica assigns them after a vote"
      why: "Each node works out ownership locally; nothing is voted on or sent."
