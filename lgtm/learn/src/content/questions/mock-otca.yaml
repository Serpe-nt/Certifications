  tags: [otel-otlp, otel-error-handling]
  exam: {cert: otca, domain: O4, competency: Error Handling}
  q: An OTLP/HTTP exporter sends a batch, and the server answers <code>400 Bad Request</code>. What must the client do with that batch?
  options:
    - text: Retry it with exponential backoff
      why: Backoff applies to retryable responses. A 400 must not be retried.
    - text: Drop it and do not send it again
      why: The client must not retry a request that got 400 Bad Request, and it drops the data.
    - text: Retry it after the time in Retry-After
      why: Retry-After goes with throttling answers such as 429 or 503, not with 400.
    - text: Split it in half and send both parts
      why: The OTLP specification does not ask clients to split a rejected request.
  answer: [1]
  source: https://opentelemetry.io/docs/specs/otlp/
- id: q-mock-otca-107
  tags: [otel-otlp, otel-error-handling]
  exam: {cert: otca, domain: O4, competency: Error Handling}
  q: An OTLP server accepts a request but reports <code>partial_success</code> with <code>rejected_spans</code> set to 12. What must the client do?
  options:
    - text: Send the whole request again
      why: The accepted spans would then arrive twice.
    - text: Send only the 12 rejected spans again
      why: The client is not allowed to retry after a partial success.
    - text: Treat it as a full failure and drop the request
      why: Most of the data was accepted. Only the rejected part is lost.
    - text: Not retry the request
      why: The client must not retry a request that got a partial success response.
  answer: [3]
  source: https://opentelemetry.io/docs/specs/otlp/
- id: q-mock-otca-108
  tags: [collector-reliability]
  exam: {cert: otca, domain: O4, competency: Error Handling}
  q: A Collector's memory limiter goes over its soft limit and starts refusing data. When is that data lost for good?
  options:
    - text: Always, because a refusal deletes the data
      why: The refusal is a non-permanent error, so the sender can try again.
    - text: When the component before the memory limiter does not retry
      why: Receivers are expected to retry refused data. If the preceding component does not, the data is lost.
    - text: Never, because the memory limiter writes refused data to disk
      why: The memory limiter has no disk buffer. It returns errors to the preceding component.
    - text: Only when the hard limit is reached
      why: Data is refused once the soft limit is crossed. The hard limit also forces garbage collection.
  answer: [1]
  source: https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/memorylimiterprocessor/README.md
