- id: q-mock-otca-112
  tags: [otel-schemas]
  exam: {cert: otca, domain: O4, competency: Schema Management}
  q: What problem are telemetry schemas meant to solve?
  options:
    - text: To list every valid value and type of every attribute
      why: The specification puts the full shape of telemetry out of scope for schemas.
    - text: To compress telemetry before it is exported to a backend
      why: Schemas describe changes to conventions, not compression.
    - text: To store dashboards next to the telemetry they query
      why: Dashboards may expect a schema version, but schemas do not store them.
    - text: To let conventions evolve without breaking consumers
      why: Schemas define transformations between versions, so conventions, sources and consumers can change independently.
