  q: A team runs one Collector beside each application, as a sidecar or on the same host, and nothing else. Which pair of trade-offs do the docs give for this agent pattern?
  options:
    - text: Easy to start, but hard to scale and inflexible as needs grow
      why: The docs list a simple start and a clear one-to-one mapping as pros, and limited scalability and flexibility as cons.
    - text: Hard to start, but the best choice for large organizations
      why: The docs say the opposite. The pattern is simple to start and limited at scale.
    - text: No extra parts to run, but every change needs code changes
      why: These describe sending without any Collector, not the agent pattern.
