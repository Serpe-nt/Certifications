      why: Without retries, data that fails once is dropped instead of being tried again.
    - text: Raise OTEL_BSP_MAX_QUEUE_SIZE in the applications
      why: That variable sizes the SDK's span queue, not the Collector exporter's queue.
    - text: Move the memory limiter after the exporter
