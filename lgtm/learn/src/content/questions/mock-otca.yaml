# O4 Error Handling
- id: q-mock-otca-105
  tags: [otel-error-handling]
  exam: {cert: otca, domain: O4, competency: Error Handling}
  q: The Collector that an application exports to is down for ten minutes. How should a conforming OpenTelemetry SDK in the application behave?
  options:
    - text: Throw an exception into the application code
      why: The SDK must not throw unhandled exceptions for errors in its own work, such as an unreachable endpoint.
    - text: Stop the application to avoid losing telemetry
      why: The spec assumes users prefer to lose telemetry rather than have it change how the application behaves.
    - text: Keep the app running and handle the error itself
      why: The exporter must not throw when it cannot reach its endpoint; the SDK should log the suppressed error.
    - text: Block every request until the Collector is back
      why: Blocking the application would change its behavior, which the error handling principles avoid.
  answer: [2]
  source: https://opentelemetry.io/docs/specs/otel/error-handling/
