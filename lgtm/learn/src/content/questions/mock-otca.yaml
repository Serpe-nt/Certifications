  tags: [otel-zero-code]
  exam: {cert: otca, domain: O2, competency: Agents}
  q: A Java service already runs with the agent. A developer wants a span for one of the service's own methods, with as little code as possible. What should they use?
  options:
    - text: A new TracerProvider built in the method
      why: The agent already provides the SDK. A second provider is not needed.
    - text: The <code>@WithSpan</code> annotation on the method
      why: With the opentelemetry-instrumentation-annotations dependency, @WithSpan creates a span for the method.
    - text: <code>OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED=true</code>
      why: This is about the agent's library instrumentation. It does not reach the service's own methods.
