# O3 Scaling
- id: q-mock-otca-081
  tags: [collector-scaling]
  exam: {cert: otca, domain: O3, competency: Scaling}
  q: A team scales its gateway Collectors from two to six replicas behind a layer 4 load balancer. Clients send OTLP over gRPC. Most traffic still goes to the first two replicas. Why?
  options:
    - text: OTLP over gRPC always uses a single Collector
      why: gRPC traffic can be spread across replicas with the right load balancer.
    - text: An L4 balancer keeps long-lived gRPC connections on one replica
      why: A layer 4 balancer may keep a client on one Collector. Use a gRPC-aware layer 7 balancer.
    - text: New replicas accept data only after the old ones fill their queues
      why: Collectors do not wait for each other. The balancer decides where data goes.
    - text: The memory_limiter sends traffic back to old replicas
      why: The memory limiter refuses data when memory is high. It does not route traffic.
  answer: [1]
  source: https://opentelemetry.io/docs/collector/scaling/
- id: q-mock-otca-082
  tags: [collector-scaling]
  exam: {cert: otca, domain: O3, competency: Scaling}
  q: A Collector scrapes thousands of Prometheus targets and cannot keep up. The team adds two replicas with the same configuration. What happens, and what should they do instead?
  options:
    - text: Load is split evenly between replicas, so no other change is needed
      why: Each replica with the same configuration scrapes the same targets. Nothing splits them.
    - text: The replicas elect a leader, so only one scrapes and the others wait
      why: The Prometheus receiver has no leader election of its own.
    - text: All replicas scrape all targets; shard them with the Target Allocator
      why: Identical replicas scrape the same endpoints and cause problems such as out-of-order samples. Shard the targets instead.
    - text: The replicas share one queue, so duplicate samples are removed before export
      why: Collectors do not share queues, and the copies cause problems rather than cancel out.
  answer: [2]
  source: https://opentelemetry.io/docs/collector/scaling/
- id: q-mock-otca-083
  tags: [collector-scaling, collector-reliability]
  exam: {cert: otca, domain: O3, competency: Scaling}
  q: "Gateway Collectors show <code>otelcol_exporter_queue_size</code> close to <code>otelcol_exporter_queue_capacity</code>, and <code>otelcol_exporter_send_failed_spans</code> keeps rising. The backend database is overloaded. What do the docs suggest?"
  options:
    - text: Add more Collector replicas
      why: More Collectors put more pressure on a backend that is already overloaded.
    - text: Add more consumers to each exporter's queue
      why: More workers would also push harder on the struggling backend.
    - text: Remove the sending queue so data is sent at once
      why: A queue gives the backend room to recover. Removing it does not make the backend any faster.
    - text: Look outside the Collector and scale the backend
      why: When the backend cannot keep up, adding Collectors does not help and can make things worse.
  answer: [3]
  source: https://opentelemetry.io/docs/collector/scaling/
- id: q-mock-otca-084
  tags: [collector-tail-sampling, collector-scaling]
  exam: {cert: otca, domain: O3, competency: Scaling}
  q: A gateway with the tail sampling processor is scaled from one replica to four behind a round-robin balancer. Kept traces now often miss spans. What is the documented fix?
  options:
    - text: Raise decision_wait so each replica waits longer for missing spans
      why: Waiting longer does not help when the other spans of the trace went to another replica.
    - text: Add a front layer with the load-balancing exporter, routed by trace ID
      why: The load-balancing exporter sends all spans of a trace to the same Collector, where the tail sampler decides.
    - text: Add the batch processor before tail sampling to group the spans
      why: Batching groups data inside one Collector. It does not bring spans from other replicas.
    - text: Switch the round-robin balancer to least-connections mode
      why: Any balancer that ignores the trace ID still splits a trace's spans across replicas.
  answer: [1]
  source: https://opentelemetry.io/docs/collector/scaling/
- id: q-mock-otca-085
  tags: [collector-scaling, collector-debugging]
  exam: {cert: otca, domain: O3, competency: Scaling}
  q: A team wants a rule for when to add gateway Collector replicas. What is the general guidance in the scaling docs?
  options:
    - text: Scale up when CPU passes 30%, and allow scaling down to one replica
      why: The docs base the rule on the exporter queue, and they suggest keeping a minimum such as three replicas.
    - text: Scale up when the queue is 60 to 70% full; keep three or more replicas
      why: Watch queue size against capacity, scale up at 60 to 70%, and keep a minimum number of replicas for resilience.
    - text: Scale up whenever <code>otelcol_exporter_send_failed_spans</code> rises
      why: Rising send failures often point to the backend. Then more Collectors can make it worse.
    - text: Never scale; raise the queue size instead
      why: A bigger queue gives room for short problems, but sustained load needs more replicas.
  answer: [1]
  source: https://opentelemetry.io/docs/collector/scaling/

