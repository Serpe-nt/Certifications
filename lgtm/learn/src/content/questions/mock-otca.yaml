  q: A gateway Collector must not lose queued data when its pod restarts. What should be configured on its exporters?
  options:
    - text: A bigger <code>queue_size</code> for the in-memory sending queue
      why: A bigger in-memory queue still loses its content when the process stops.
    - text: A longer <code>max_elapsed_time</code> for retry_on_failure
      why: Longer retries help with backend outages, not with a Collector restart.
    - text: A file_storage extension behind the <code>sending_queue</code>
