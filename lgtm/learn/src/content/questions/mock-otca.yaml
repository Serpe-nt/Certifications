  q: Before a rollout, a team wants to check that a new Collector configuration file is valid, without starting any pipelines. Which command does that?
  options:
    - text: <code>otelcol components --config=new.yaml</code>
      why: The components command lists the components in the distribution. It does not check a file.
    - text: <code>otelcol --config=new.yaml --dry-run</code>
      why: The docs do not describe a dry-run flag. They name a separate command.
    - text: <code>otelcol validate --config=new.yaml</code>
      why: The validate command checks a configuration file.
    - text: <code>otelcol --config=yaml:validate</code>
      why: The yaml scheme passes configuration values. It does not run a check.
  answer: [2]
  source: https://opentelemetry.io/docs/collector/configuration/
- id: q-mock-otca-073
  tags: [collector-config, collector-deployment]
  exam: {cert: otca, domain: O3, competency: Configuration}
  q: A Collector runs in its own pod. Its OTLP receiver lists the grpc and http protocols with no endpoints. Applications in other pods cannot connect to it. Why?
  options:
    - text: The OTLP receiver needs an extension before it accepts data
      why: Extensions such as authenticators are optional. The receiver works without them.
    - text: Without endpoints, the receiver uses random ports
      why: The default ports are fixed at 4317 for gRPC and 4318 for HTTP.
    - text: Without endpoints, the protocols are switched off
      why: Listing a protocol enables it. Only its address is the default.
    - text: The default endpoints listen on localhost only
      why: The defaults are localhost:4317 and localhost:4318. Set an address that other pods can reach, such as the pod IP.
