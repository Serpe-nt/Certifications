  q: A team defines an <code>oidc</code> extension and references it under the OTLP receiver's <code>auth</code> setting. Authentication does not work. The service section lists only the pipelines. What is missing?
  options:
    - text: The <code>oidc</code> extension in <code>service.extensions</code>
      why: An authenticator must be configured, listed in the service extensions so it is loaded, and referenced by the receiver.
    - text: A processor named <code>oidc</code> in each pipeline
      why: Authentication is an extension. It is not a processor in a pipeline.
    - text: An <code>oidc</code> exporter in the traces pipeline
      why: The receiver checks incoming requests. Exporters handle outgoing data.
    - text: A connector between the receiver and the extension
      why: Connectors join pipelines. They do not load extensions.
  answer: [0]
  source: https://opentelemetry.io/docs/collector/configuration/

