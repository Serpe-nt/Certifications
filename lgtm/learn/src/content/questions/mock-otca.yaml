    - text: Build a custom distribution with the Collector Builder (ocb)
      why: ocb builds a distribution with exactly the components you list, custom ones included.
    - text: Use the core distribution and add the processor as a plugin file
      why: Components are compiled into the binary. The docs describe ocb for adding custom ones.
    - text: Use the Kubernetes distribution, which removes unused components at startup
