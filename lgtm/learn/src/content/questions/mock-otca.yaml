  q: A team uses the alpha schema processor to move its telemetry to a newer semantic convention version. Some attributes are renamed. Dashboards still query the old names, and the team needs a few weeks to update them. What should they configure?
  options:
    - text: A migration entry, so old and new names are both written
      why: With a migration entry the processor writes both names, which gives time to update queries, dashboards and alerts.
    - text: Two targets for the same schema family
      why: The processor takes one target per schema family.
    - text: A prefetch list with the old schema only
      why: Prefetch only downloads and caches schema files at startup.
    - text: Nothing, because the processor keeps old names by default
      why: By default the processor does hard renames and removes the old names.
  answer: [0]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/processor/schemaprocessor/README.md
