  q: A team sends telemetry from its SDKs straight to a vendor backend, with no Collector. Now it must add redaction and may change vendors next year. Which drawbacks of this pattern do the docs name?
  options:
    - text: Code changes for new processing, and code tied to the backend
      why: Without a Collector, changes to processing need code changes, and the code is tied to the backend.
    - text: More moving parts to deploy, and a harder start for new teams
      why: The docs list the opposite. Having no Collector means fewer parts and an easy start.
    - text: Data is always sampled at 10%, and logs are not supported
      why: Skipping the Collector does not force sampling or remove signals.
    - text: The SDK can only export to a Collector
      why: SDKs can export to backends directly; this pattern does exactly that.
  answer: [0]
  source: https://opentelemetry.io/docs/collector/deploy/other/no-collector/
- id: q-mock-otca-076
  tags: [collector-kubernetes]
  exam: {cert: otca, domain: O3, competency: Deployment}
  q: A team wants a Collector to read the container logs of every pod in a cluster with the Filelog receiver. How should the Collector run?
  options:
    - text: As one Deployment replica, which can read every node's files
      why: A Deployment pod only reads the logs of the node it runs on.
    - text: As a sidecar in the Collector's own pod only
      why: A single sidecar sees only its own pod and node, not the rest of the cluster.
    - text: As a DaemonSet, so each node has a Collector
      why: The DaemonSet is the preferred pattern for the Filelog receiver, because logs are files on each node.
    - text: As a StatefulSet, which mounts every node's disk
      why: A StatefulSet pod still runs on one node and sees only that node's files.
