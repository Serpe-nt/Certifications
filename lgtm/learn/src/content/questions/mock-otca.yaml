  q: A Collector DaemonSet on a 10-node cluster runs the Kubernetes Cluster receiver. Every cluster metric, such as pod phase counts, appears 10 times. What is the fix?
  options:
    - text: Raise the receiver's collection interval
      why: A longer interval sends fewer points, but each of the 10 copies still sends them.
    - text: Run it in a Deployment with exactly one replica
      why: The receiver gathers data for the whole cluster, so one instance is enough; more replicas duplicate the data.
    - text: Add the k8sattributes processor to the pipeline
      why: That processor adds pod metadata. It does not remove copies.
    - text: Run it as a sidecar in every application pod
      why: The sidecar pattern is not usable for this receiver.
