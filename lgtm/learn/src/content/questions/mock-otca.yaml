# O3 Configuration
- id: q-mock-otca-069
  tags: [collector-config, collector-pipelines]
  exam: {cert: otca, domain: O3, competency: Configuration}
  q: A Collector configuration defines a <code>filter</code> processor under <code>processors</code>, but spans that match its conditions still reach the backend. The Collector starts without errors. What is the most likely cause?
  options:
    - text: The filter processor only works on metrics
      why: The filter processor handles traces, metrics and logs.
    - text: The processor is not listed in the traces pipeline
      why: Configuring a processor does not enable it. It must be added to a pipeline in the service section.
    - text: Processors run only after the exporters
      why: Processors run between the receivers and the exporters.
    - text: Filter conditions need a restart of every client
      why: Clients do not see the Collector's processors, so nothing on their side needs to change.
  answer: [1]
  source: https://opentelemetry.io/docs/collector/configuration/
- id: q-mock-otca-070
  tags: [collector-config]
  exam: {cert: otca, domain: O3, competency: Configuration}
  q: A Collector must send traces over OTLP/gRPC to two different backends, each with its own endpoint and TLS settings. How do you define the two exporters?
  options:
    - text: Write the <code>otlp_grpc</code> key twice in the exporters section
      why: Each component identifier must be unique, so the same key cannot appear twice.
    - text: List both endpoints under one <code>otlp_grpc</code> exporter
      why: One OTLP exporter has one endpoint. Two backends need two exporter instances.
    - text: Use <code>otlp_grpc/a</code> and <code>otlp_grpc/b</code>
      why: Identifiers follow the type[/name] format, so one type can be defined more than once with unique names.
    - text: Run a second Collector, since a type can be used only once
      why: A type can be used many times in one Collector, as long as each identifier is unique.
  answer: [2]
  source: https://opentelemetry.io/docs/collector/configuration/
- id: q-mock-otca-071
  tags: [collector-config]
  exam: {cert: otca, domain: O3, competency: Configuration}
  q: 'An exporter in a Collector configuration has the setting <code>namespace: $$DataVisualization</code>. What value does the Collector use?'
  options:
    - text: The value of an environment variable named DataVisualization
      why: Variables are read with the <code>${env:NAME}</code> syntax. The double dollar sign does something else.
    - text: The literal text <code>$DataVisualization</code>
      why: In Collector configuration, <code>$$</code> stands for one literal dollar sign.
    - text: An empty string, because the variable is not set
      why: No variable is read here, so an unset variable does not matter.
    - text: None; the configuration is rejected at startup
      why: <code>$$</code> is the documented way to write a literal dollar sign.
  answer: [1]
  source: https://opentelemetry.io/docs/collector/configuration/
