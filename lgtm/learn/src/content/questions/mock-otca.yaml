- id: q-mock-otca-064
  tags: [otel-zero-code]
  exam: {cert: otca, domain: O2, competency: Agents}
  q: A Java service runs with the agent. The command line has <code>-Dotel.service.name=billing</code>, and the environment has <code>OTEL_SERVICE_NAME=payments</code>. Which name does the agent use?
  options:
    - text: payments, because environment variables come first
      why: For the Java agent, system properties have a higher priority than environment variables.
    - text: billing, because system properties come first
      why: The agent reads system properties first, then environment variables, then the configuration file.
    - text: unknown_service, because the two values conflict
      why: There is no conflict to resolve. The source with the higher priority wins.
    - text: The value in the agent's configuration file
      why: The configuration file has a lower priority than both other sources.
  answer: [1]
  source: https://opentelemetry.io/docs/zero-code/java/agent/configuration/
- id: q-mock-otca-065
  tags: [otel-zero-code]
  exam: {cert: otca, domain: O2, competency: Agents}
  q: A Java service runs with the agent. The team wants JDBC instrumentation only, and nothing else from the agent. Which settings do this?
  options:
    - text: <code>OTEL_JAVAAGENT_ENABLED=false</code> and <code>OTEL_INSTRUMENTATION_JDBC_ENABLED=true</code>
      why: Disabling the agent turns it off entirely, so no instrumentation runs at all.
    - text: <code>OTEL_INSTRUMENTATION_JDBC_ENABLED=true</code>, with every other setting left at its default
      why: Default instrumentation stays on unless it is turned off, so all the others would keep running too.
    - text: <code>OTEL_INSTRUMENTATION_COMMON_DEFAULT_ENABLED=false</code> and <code>OTEL_INSTRUMENTATION_JDBC_ENABLED=true</code>
      why: The first turns off all default instrumentation; the second turns JDBC back on.
    - text: <code>OTEL_TRACES_SAMPLER=always_off</code> and <code>OTEL_INSTRUMENTATION_JDBC_ENABLED=true</code>
      why: always_off drops every span, the JDBC ones included.
  answer: [2]
  source: https://opentelemetry.io/docs/zero-code/java/agent/disable/
- id: q-mock-otca-066
  tags: [otel-operator]
  exam: {cert: otca, domain: O2, competency: Agents}
  q: A team annotates a Deployment with <code>instrumentation.opentelemetry.io/inject-python</code> set to true. They create the Instrumentation resource a few minutes after the pods started. The pods send no telemetry. What explains it?
  options:
    - text: Python injection supports only gRPC, so the endpoint is wrong
      why: Python injection uses http/protobuf, and gRPC is not supported for it.
    - text: The annotation must be on the Collector, not the Deployment
      why: The annotation goes on the workload's pod template or on its namespace.
    - text: Injection needs the Collector to run as a sidecar
      why: Injection works with any reachable Collector, in any deployment mode.
    - text: The pods started before the Instrumentation resource existed
      why: The init container is added when a pod starts. Pods created before the resource are not instrumented.
  answer: [3]
  source: https://opentelemetry.io/docs/platforms/kubernetes/operator/automatic/
- id: q-mock-otca-067
  tags: [otel-operator]
  exam: {cert: otca, domain: O2, competency: Agents}
  q: Which values of the annotation <code>instrumentation.opentelemetry.io/inject-java</code> make the Operator inject the agent? (Choose two.)
  options:
    - text: <code>"true"</code>
      why: It uses the Instrumentation resource with the default name in the pod's namespace.
    - text: <code>"otel/java-instr"</code>
      why: It uses the Instrumentation resource java-instr from the namespace otel.
    - text: <code>"false"</code>
      why: false tells the Operator not to inject.
    - text: <code>"java"</code> to name the language
      why: The language is already in the annotation's name. A value names an Instrumentation resource, and none is called java here.
    - text: <code>"latest"</code> to pick the newest agent image
      why: The value does not choose an image version. It names the Instrumentation resource to use.
  answer: [0, 1]
