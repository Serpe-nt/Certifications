- id: q-m11-037
  tags: [mimir-replication]
  exam: { cert: none }
  q: "An ingester restarts after ten minutes away. Kafka kept every record. How does it get the samples it missed?"
  options:
    - text: "The other ingesters send it copies of what it missed"
      why: "Ingesters do not copy data to each other with ingest storage."
    - text: "It downloads them from the blocks in object storage"
      why: "The missed samples were never cut into blocks."
    - text: "It replays its WAL, then reads Kafka from its stored offset"
      why: "The offset in its consumer group says where it stopped, so it catches up without a gap."
    - text: "The distributors write them again"
      why: "Distributors wrote them once, to Kafka. They keep no copy."
  answer: [2]
  source: https://grafana.com/docs/mimir/v3.2.x/get-started/about-grafana-mimir-architecture/about-ingest-storage-architecture/

