- id: q-m11-034
  tags: [mimir-exemplars-histograms]
  exam: { cert: none }
  q: "Exemplars show on a latency graph for the last hour, but not for the same graph last week, although the metric is still there. Why?"
  options:
    - text: "The compactor removes all exemplars when it merges blocks"
      why: "Exemplars are not kept with the blocks to begin with."
    - text: "The store-gateway hides exemplars from old blocks"
      why: "The store-gateway serves samples. Exemplars live in the ingesters."
    - text: "The tenant's exemplar limit makes them expire after a day"
      why: "The limit is a count, not a time."
    - text: "Exemplars sit in a fixed buffer that newer ones overwrite"
      why: "The circular buffer of <code>max_global_exemplars_per_user</code> holds the newest exemplars only."
