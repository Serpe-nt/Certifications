- id: q-m11-028
  tags: [mimir-cardinality, cardinality]
  exam: { cert: none }
  q: "A tenant is close to its series limit, and the cardinality API is off. Which PromQL query shows the metric names with the most series?"
  options:
    - text: "<code>topk(10, count_over_time({__name__=~\".+\"}[30m]))</code>"
      why: "This counts samples per series over an hour, not series per metric name."
    - text: "<code>topk(10, count by (__name__) ({__name__=~\".+\"}))</code>"
      why: "Counting series grouped by metric name and keeping the top ten shows where the series are."
    - text: "<code>topk(10, sum by (__name__, job) ({__name__=~\".+\"}))</code>"
      why: "This adds up the values of the series, which says nothing about how many there are."
    - text: "<code>count(count by (job) ({__name__=~\".+\"}))</code>"
      why: "This counts the jobs, which is one number, not a list of metrics."
  answer: [1]
  source: https://prometheus.io/docs/prometheus/latest/querying/operators/

- id: q-m11-029
