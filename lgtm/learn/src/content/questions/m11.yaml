- id: q-m11-033
  tags: [mimir-alertmanager]
  exam: { cert: none }
  q: "A tenant's alerting rules fire in Mimir's ruler, the Alertmanager shows the alerts, but nobody is notified. The tenant never uploaded an Alertmanager configuration. What is the likely cause?"
  options:
    - text: "The ruler sends alerts only for recording rules"
      why: "The ruler sends alerts from alerting rules; recording rules make no alerts."
    - text: "The fallback configuration's receiver has no integration"
      why: "A tenant without a configuration gets the fallback, and its receivers decide whether anyone is notified."
    - text: "The Alertmanager needs a restart first"
      why: "Configurations are loaded at runtime; no restart is involved."
    - text: "The alerts went to every other tenant instead"
      why: "Tenants never receive each other's alerts."
