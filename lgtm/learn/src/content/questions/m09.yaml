- id: q-m09-001
  tags: [collector-config]
  exam: {cert: otca, domain: O3, competency: Configuration}
  q: "A Collector starts with <code>--config=config.yaml --set=exporters::debug::verbosity=detailed</code>. The file sets the debug exporter's verbosity to <code>basic</code>. Which verbosity does the exporter use?"
  options:
    - text: "detailed, because --set is merged after all --config sources"
      why: "The configuration page says values from --set are merged into the final configuration after the --config sources."
    - text: "basic, because a value in a file always beats a command-line flag"
      why: "It is the other way round: --set is applied last."
    - text: "Neither; the Collector refuses two values for the same key"
      why: "Merging several sources is normal; the later one wins."
    - text: "basic, because --set only adds keys that the file does not have"
      why: "--set overrides existing keys as well as adding new ones."
  answer: [0]
  source: https://opentelemetry.io/docs/collector/configuration/

- id: q-m09-002
  tags: [collector-config, collector-pipelines]
  exam: {cert: otca, domain: O3, competency: Configuration}
  q: "A traces pipeline lists <code>processors: [batch, transform, batch]</code>, meaning to batch twice. What does <code>otelcol-contrib validate</code> report?"
  options:
    - text: "Nothing; the second batch gets its own instance with its own state"
      why: "Separate instances exist only for one processor used in different pipelines, not twice in one."
    - text: "A warning, and the Collector removes the second batch at startup"
      why: "The Collector does not edit a pipeline; it rejects the configuration."
    - text: "An error: the pipeline references processor \"batch\" multiple times"
      why: "One processor ID may appear only once in a pipeline; validate says so and stops."
    - text: "Nothing, because the batch processor is allowed anywhere in a pipeline"
      why: "Position is free, but a repeated ID in the same list is not allowed."
  answer: [2]
  source: https://opentelemetry.io/docs/collector/architecture/

- id: q-m09-003
  tags: [collector-config]
  exam: {cert: otca, domain: O3, competency: Configuration}
  q: "A Collector pod's liveness and readiness probes call port 13133. The configuration defines <code>health_check: {endpoint: 0.0.0.0:13133}</code> under <code>extensions</code>, and <code>service</code> lists only pipelines. What happens?"
  options:
    - text: "The probes pass, because a defined extension starts by itself"
      why: "An extension starts only when service.extensions lists it."
    - text: "The probes fail: nothing starts the extension"
      why: "Nothing listens on 13133, so Kubernetes never marks the pod ready and restarts it."
    - text: "The Collector refuses to start because an extension is unused"
      why: "An unused component is allowed and logged as nothing at all."
    - text: "The probes pass, because pipelines answer health checks on 13133"
      why: "Pipelines serve no health endpoint; that is the extension's job."
  answer: [1]
  source: https://opentelemetry.io/docs/collector/configuration/

- id: q-m09-004
  tags: [collector-opamp]
  exam: {cert: otca, domain: O3, competency: Configuration}
  q: "Which of these is part of what OpAMP lets a management server do with a fleet of agents?"
  options:
    - text: "Receive the agents' application spans and forward them to a backend"
      why: "OpAMP manages agents; application telemetry still flows through their pipelines."
    - text: "Replace OTLP between applications and Collectors"
      why: "OpAMP is a management protocol and carries no application telemetry."
    - text: "Send configuration and packages, and receive status and health"
      why: "Remote configuration, packages, status reporting and heartbeats are all in the specification."
    - text: "Schedule Collector pods onto Kubernetes nodes"
      why: "Scheduling is the Kubernetes scheduler's work; OpAMP talks to agents, not to the cluster."
  answer: [2]
  source: https://opentelemetry.io/docs/specs/opamp/

- id: q-m09-005
  tags: [collector-opamp]
  exam: {cert: otca, domain: O3, competency: Configuration}
  q: "An <code>opamp</code> extension runs with its default capabilities. What does it report to the OpAMP server without further settings?"
  options:
    - text: "The effective configuration, health and the available components"
      why: "These three capabilities default to true in the extension's README."
    - text: "Every span the Collector exports, so the server can count them"
      why: "The extension reports about the agent, not the data that passes through it."
    - text: "Nothing until the server sends a restart command"
      why: "Restarts are an opt-in capability; reporting is on by default."
    - text: "Only a heartbeat, because reporting the configuration needs a feature gate"
      why: "Reporting the effective configuration is on by default; the restart command needs the gate."
  answer: [0]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.165.0/extension/opampextension/README.md

