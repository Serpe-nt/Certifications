  q: "An <code>OpenTelemetryCollector</code> resource for the Operator has a configuration but no <code>spec.mode</code>. What does the Operator create?"
  options:
    - text: "A DaemonSet, one Collector on each node"
      why: "DaemonSet is a mode you choose; it is not the default."
    - text: "Nothing, because mode is a required field"
      why: "The field has a default value."
    - text: "A sidecar in every pod of the namespace"
      why: "Sidecars are injected only into pods that ask for them with an annotation."
    - text: "A Deployment, the default mode"
      why: "The Operator's deployment modes page names Deployment as the default."
