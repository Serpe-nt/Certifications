    - text: "A larger metrics_flush_interval on every replica"
      why: "Flushing less often does not stop three replicas from writing the same service."
    - text: "Removing collector.instance.id from the dimensions"
      why: "That makes the three replicas' series collide outright."
    - text: "A tail_sampling processor in front of the connector"
      why: "Sampling reduces spans; it does not decide which replica sees which service."
