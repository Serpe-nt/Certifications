  tags: [collector-deployment]
  exam: {cert: otca, domain: O3, competency: Deployment}
  q: "A configuration uses <code>k8s_attributes</code>, <code>redaction</code> and <code>tail_sampling</code>, and nothing else outside the core set. Which project distribution has all three and is much smaller than contrib?"
  options:
