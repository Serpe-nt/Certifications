- id: q-m09-027
  tags: [collector-ottl]
  exam: {cert: otca, domain: O4, competency: Context Propagation}
  q: "To shorten IDs, someone adds a transform statement that rewrites <code>span.trace_id</code> on spans from one service. What will traces in the backend show?"
  options:
    - text: "Nothing different; the backend links spans by service name"
      why: "Backends join spans by trace and span IDs, not service names."
    - text: "Smaller traces, but every link between services kept"
      why: "Spans with the new ID no longer share a trace with their parents and children."
    - text: "An error at startup, because trace_id is read-only in OTTL"
      why: "The transform processor allows changing trace_id; its README warns about it."
    - text: "Broken traces, with that service's spans orphaned from the rest"
      why: "The README's Orphaned Telemetry warning covers exactly this change."
  answer: [3]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.165.0/processor/transformprocessor/README.md

- id: q-m09-028
  tags: [collector-debugging]
  exam: {cert: otca, domain: O4, competency: Debugging Pipelines}
  q: "A Collector defines <code>zpages: {endpoint: 0.0.0.0:55679}</code> under <code>extensions</code>, and <code>curl localhost:55679/debug/pipelinez</code> inside the pod gets connection refused. What should you check first?"
  options:
    - text: "Whether pipelinez needs the detailed metrics level"
      why: "The page does not depend on the metrics level."
    - text: "Whether a pipeline lists zpages among its exporters"
      why: "zPages is an extension; pipelines never name it."
    - text: "Whether the port must be 8888, where all debug pages live"
      why: "8888 serves the internal metrics; zPages has its own endpoint."
    - text: "Whether service.extensions lists zpages"
      why: "Extensions are enabled only in the service section."
  answer: [3]
  source: https://opentelemetry.io/docs/collector/configuration/

- id: q-m09-029
  tags: [collector-debugging]
  exam: {cert: otca, domain: O4, competency: Debugging Pipelines}
  q: "In Grafana, <code>rate(otelcol_exporter_sent_spans[5m])</code> on the lab's Mimir returns no data, although the gateway exports spans. Which query works?"
  options:
    - text: "The same query with the data source prometheus instead of mimir"
      why: "The lab's Prometheus does not scrape the gateway; its metrics are in Mimir."
    - text: "rate(otelcol_exporter_sent_spans_total[5m])"
      why: "Stored in Mimir, the counter carries the _total suffix."
    - text: "rate(otelcol_exporter_sent_spans{level=\"detailed\"}[5m])"
      why: "The metrics level is not a label, and the name is still wrong."
    - text: "rate(otelcol_processor_outgoing_items[5m])"
      why: "The name lacks _total in the same way, and it counts processors."
  answer: [1]
  source: https://opentelemetry.io/docs/collector/internal-telemetry/

- id: q-m09-030
  tags: [collector-debugging, collector-config]
  exam: {cert: otca, domain: O4, competency: Debugging Pipelines}
  q: "A new pod logs <code>Error: invalid configuration: service::pipelines::logs: references processor \"transform/logs\" which is not configured</code>. What is wrong?"
  options:
    - text: "The pipeline names an ID that processors does not define"
      why: "A typo or a missing definition; the path names the pipeline to look at."
    - text: "The transform processor is not compiled into this distribution"
      why: "A missing component gives an unknown type error."
    - text: "The transform processor cannot run in a logs pipeline"
      why: "transform supports logs; a signal mismatch gives another error."
    - text: "The processor needs an error_mode before it can start"
      why: "error_mode has a default, ignore."
  answer: [0]
  source: https://opentelemetry.io/docs/collector/troubleshooting/

- id: q-m09-031
  tags: [collector-reliability]
  exam: {cert: otca, domain: O4, competency: Error Handling}
  q: "An exporter sets <code>sending_queue: {block_on_overflow: true}</code>. The backend is down and the queue is full. What happens to new data?"
  options:
    - text: "The caller waits for room instead of being rejected"
      why: "block_on_overflow makes the request wait; the default rejects immediately."
    - text: "It is written to the disk until the queue has room again"
      why: "Disk needs a storage extension; blocking keeps data with the caller."
    - text: "It replaces the oldest data in the queue"
      why: "The queue never drops old data to make room."
    - text: "It is retried by the exporter for up to 300 s"
      why: "Retries apply to queued data; this data is not in the queue yet."
  answer: [0]
  source: https://github.com/open-telemetry/opentelemetry-collector/blob/v0.165.0/exporter/exporterhelper/README.md

- id: q-m09-032
  tags: [collector-ottl, collector-debugging]
  exam: {cert: otca, domain: O4, competency: Error Handling}
  q: "A transform processor's statements fail on a few logs a minute, and the team wants the failures neither to drop data nor to fill the Collector's log. Which error_mode fits?"
  options:
    - text: "ignore, because it skips the error without any log line"
      why: "ignore does log the error; that is its difference from silent."
    - text: "propagate, because the sender can then retry"
      why: "propagate drops the payload from the Collector."
    - text: "silent: skip the statement, log nothing"
      why: "silent goes on with the next statement without a log line."
    - text: "none, because it turns error handling off"
      why: "There is no none mode; the modes are ignore, silent and propagate."
  answer: [2]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.165.0/processor/transformprocessor/README.md

- id: q-m09-033
  tags: [otel-schemas]
  exam: {cert: otca, domain: O4, competency: Schema Management}
  q: "A Collector receives data with schema URLs from <code>https://opentelemetry.io/schemas/</code> and from a vendor's <code>https://example.com/schemas/</code>. How many <code>targets</code> does the schema processor need to translate both?"
  options:
    - text: "One, the newest OpenTelemetry version, which covers every family"
      why: "A schema file only describes its own family."
    - text: "Two, one target URL per schema family"
      why: "The processor takes one target per family, matched to the incoming URLs."
    - text: "None, because the processor reads the target from the data"
      why: "The data says where it comes from; the target is what you configure."
    - text: "One per service that sends data"
      why: "Targets are per schema family, not per service."
  answer: [1]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.165.0/processor/schemaprocessor/README.md

- id: q-m09-034
  tags: [otel-schemas]
  exam: {cert: otca, domain: O4, competency: Schema Management}
  q: "Why may a schema processor cache the file at <code>https://opentelemetry.io/schemas/1.43.0</code> forever once it has fetched it?"
  options:
    - text: "A published schema file never changes; new versions get new URLs"
      why: "The specification makes schema files immutable and asks for permanent caching."
    - text: "Because the processor downloads every schema file at startup anyway"
      why: "It fetches on demand or by prefetch; caching is allowed because files never change."
    - text: "Because schema files only grow, so an old copy is a subset"
      why: "A version's file is never edited after release."
    - text: "Because the Collector embeds all schemas in its binary"
      why: "Schemas are fetched from their URLs."
  answer: [0]
  source: https://opentelemetry.io/docs/specs/otel/schemas/
