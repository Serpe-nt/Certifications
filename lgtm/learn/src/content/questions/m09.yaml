  exam: {cert: otca, domain: O3, competency: Transforming Data}
  q: "In a Collector configuration file, a <code>replace_pattern</code> statement must put the first regex group into the new value. How is the group written?"
  options:
    - text: "$1, the group syntax of Go's regexp package"
      why: "In a Collector file a single $ starts an environment-variable expansion."
    - text: "\\1, the backreference syntax that sed uses"
      why: "OTTL uses Go's regexp.Expand syntax, which does not use backslash groups."
    - text: "$$1, because a single $ starts variable expansion"
      why: "The OTTL functions README asks for $$ in Collector files to skip variable expansion."
    - text: "${1}, with braces to mark the group number"
      why: "${...} is the Collector's expansion syntax, which would be read as a variable."
