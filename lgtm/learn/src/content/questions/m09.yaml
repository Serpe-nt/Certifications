      why: "A missing component gives an unknown type error instead."
    - text: "tail_sampling is listed in a metrics pipeline, and it handles traces only"
      why: "Every component in a pipeline must support the pipeline's signal."
    - text: "tail_sampling needs a name suffix in a metrics pipeline"
      why: "The suffix only tells instances apart; it does not change the signal."
    - text: "The metrics pipeline has no batch processor before tail_sampling"
      why: "No processor requires batch in front of it."
  answer: [1]
  source: https://opentelemetry.io/docs/collector/architecture/

- id: q-m09-013
  tags: [collector-connectors, collector-scaling]
  exam: {cert: otca, domain: O3, competency: Pipelines}
  q: "Three gateway replicas behind a round-robin Service run the service_graph connector. The graph has missing edges and <code>traces_service_graph_unpaired_spans_total</code> keeps rising. What fixes it?"
  options:
    - text: "A load_balancing tier in front that routes by trace ID"
      why: "The connector must see both spans of a pair, so a whole trace must reach one replica."
    - text: "A bigger batch size, so client and server spans meet in one batch"
      why: "Batching inside one replica cannot bring in spans another replica received."
    - text: "Moving the connector into the metrics pipeline"
      why: "service_graph consumes traces; it is the exporter of a traces pipeline."
    - text: "Adding more replicas, so each one holds fewer traces"
      why: "More replicas split traces across even more Collectors."
  answer: [0]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.165.0/connector/servicegraphconnector/README.md

- id: q-m09-014
  tags: [collector-connectors]
  exam: {cert: otca, domain: O3, competency: Pipelines}
  q: "A team adds <code>dimensions: [{name: user.id}]</code> to the span_metrics connector to see latency per user. The shop has 200,000 users. What happens to the metrics?"
  options:
    - text: "Nothing changes, because span metrics ignore span attributes"
      why: "Dimensions are read from span or resource attributes."
    - text: "The connector refuses user.id, because only resource attributes are allowed"
      why: "Span attributes are allowed as dimensions."
    - text: "The calls and duration series multiply by the number of users"
      why: "Each dimension value makes its own series, which drives cardinality up."
    - text: "The connector stores user.id only on exemplars, not on series"
      why: "A configured dimension becomes a label on the metric series."
  answer: [2]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.165.0/connector/spanmetricsconnector/README.md

- id: q-m09-015
  tags: [collector-processors]
  exam: {cert: otca, domain: O3, competency: Transforming Data}
  q: "<code>resource/scraper</code> sets <code>service.name: otel-gateway</code> with <code>action: insert</code>. The Prometheus receiver already put <code>service.name=ad</code> on the ad service's metrics. What do those metrics end up with?"
  options:
    - text: "service.name=otel-gateway, because the processor runs later"
      why: "That would be upsert or update; insert does not overwrite."
    - text: "service.name=ad, because insert never overwrites a key"
      why: "insert leaves existing keys alone; the value is set only where none exists."
    - text: "Both values, stored together as a list on the attribute"
      why: "An attribute key holds one value; insert does not append."
    - text: "No service.name, because two values cancel out"
      why: "Nothing removes the attribute here."
  answer: [1]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.165.0/processor/attributesprocessor/README.md

- id: q-m09-016
  tags: [collector-processors]
  exam: {cert: otca, domain: O3, competency: Transforming Data}
  q: "A rendered memory_limiter has <code>limit_mib: 400</code>, <code>spike_limit_mib: 100</code>, <code>limit_percentage: 80</code> and <code>spike_limit_percentage: 25</code>, in a container limited to 512 MiB. Where does it start refusing data?"
  options:
    - text: "At about 307 MiB, from 80% minus 25% of 512 MiB"
      why: "The percentages are ignored when limit_mib is set."
    - text: "At 400 MiB, the value of limit_mib"
      why: "400 MiB is the hard limit; refusing starts at the soft limit below it."
    - text: "At 409 MiB, from 80% of 512 MiB"
      why: "The fixed setting takes precedence over the percentage."
    - text: "At 300 MiB, from limit_mib minus spike_limit_mib"
      why: "limit_mib wins over limit_percentage, and the soft limit is 400 - 100."
  answer: [3]
  source: https://github.com/open-telemetry/opentelemetry-collector/blob/v0.165.0/processor/memorylimiterprocessor/README.md

- id: q-m09-017
  tags: [collector-processors]
  exam: {cert: otca, domain: O3, competency: Transforming Data}
  q: "An agent runs <code>resource_detection</code> with <code>detectors: [eks, ec2]</code> on an EKS node. Both detectors can set <code>cloud.platform</code>. Which value wins?"
  options:
    - text: "The ec2 value, because the last detector overwrites the others"
      why: "The order works the other way: the first detector to set a key wins."
    - text: "The eks value: the first detector to set a key wins"
      why: "The README's ordering rule; with eks first the platform reads aws_eks."
    - text: "Neither, because conflicting detectors make the processor fail"
      why: "A conflict is resolved by order, not by an error."
    - text: "Both, stored as two attributes with a numeric suffix"
      why: "One key holds one value; there is no automatic suffix."
  answer: [1]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.165.0/processor/resourcedetectionprocessor/README.md

- id: q-m09-018
  tags: [collector-ottl]
  exam: {cert: otca, domain: O3, competency: Transforming Data}
  q: "<code>trace_statements</code> run <code>delete_key(span.attributes, \"user.email\")</code> and then <code>set(span.attributes[\"user.hash\"], SHA256(span.attributes[\"user.email\"]))</code>. The spans in the backend have neither attribute. Why?"
  options:
    - text: "SHA256 is not available in the transform processor"
      why: "SHA256 is a standard OTTL converter."
    - text: "Statements run in order, so the address is deleted first"
      why: "Swap the two statements: hash first, then delete."
    - text: "set cannot create a new attribute, it can only change one"
      why: "set creates the key when it does not exist."
    - text: "Attributes with a dot in the name cannot be read in OTTL"
      why: "Dotted keys inside brackets are normal OTTL paths."
  answer: [1]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.165.0/processor/transformprocessor/README.md

- id: q-m09-019
