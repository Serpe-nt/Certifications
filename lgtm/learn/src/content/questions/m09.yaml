- id: q-m09-007
  tags: [collector-deployment]
  exam: {cert: otca, domain: O3, competency: Deployment}
  q: "A platform team builds its own Collector with ocb and needs the redaction processor in it. What do they add to <code>builder-config.yaml</code>?"
  options:
    - text: "A redaction block under processors in the Collector's runtime configuration"
      why: "Runtime configuration cannot add code; the component must be compiled in."
    - text: "The processor's Go module, as a gomod entry in the processors list"
      why: "ocb compiles the modules listed per component class in its manifest."
    - text: "A feature gate that turns the redaction processor on"
      why: "Feature gates change components that are already in the binary."
    - text: "The URL of the contrib container image to copy it from"
      why: "ocb builds from Go modules, not from other images."
