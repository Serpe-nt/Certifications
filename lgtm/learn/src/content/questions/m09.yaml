- id: q-m09-010
  tags: [collector-pipelines]
  exam: {cert: otca, domain: O3, competency: Pipelines}
  q: "The pipelines <code>metrics</code> and <code>metrics/scraper</code> both list the exporter <code>otlp_http/mimir</code>. How many instances of that exporter does the Collector run?"
  options:
    - text: "Two, one per pipeline, as with processors"
      why: "Only processors get one instance per pipeline."
    - text: "One, which receives data from both pipelines"
      why: "Several pipelines can send to the same exporter; it is built once."
    - text: "None, because an exporter may appear in only one pipeline"
      why: "Sharing an exporter between pipelines is allowed and common."
    - text: "Two, and the backend gets every data point twice"
      why: "Each pipeline sends its own data to the one exporter; nothing is doubled."
  answer: [1]
  source: https://opentelemetry.io/docs/collector/architecture/

- id: q-m09-011
  tags: [collector-pipelines, collector-processors]
  exam: {cert: otca, domain: O3, competency: Pipelines}
  q: "A traces pipeline runs <code>[memory_limiter, transform, filter, batch]</code>. The filter drops the 90% of spans that are health checks. What should change, and why?"
  options:
    - text: "Move filter to the end, so batch sends smaller batches"
      why: "batch should stay last; filtering after it would batch data that is then dropped."
    - text: "Move filter before memory_limiter, so it protects memory"
      why: "memory_limiter must stay first to refuse data before anything holds it."
    - text: "Nothing; the order of processors does not change the result"
      why: "The result is the same here, but transform does nine times the work it needs."
    - text: "Put filter second, so transform skips the dropped spans"
      why: "The guide drops unwanted data early, before processors that change it."
  answer: [3]
  source: https://github.com/open-telemetry/opentelemetry-collector/blob/v0.165.0/processor/README.md

