- id: q-m09-023
  tags: [collector-tail-sampling]
  exam: {cert: otca, domain: O3, competency: Scaling}
  q: "A tail sampler uses the defaults and a latency policy above 10 s. Some batch-job traces run for 45 s, and the kept ones miss their last spans. What is the likely cause?"
  options:
    - text: "num_traces is too high, so old traces are evicted early"
      why: "A higher num_traces keeps more traces, not fewer."
    - text: "The latency policy measures only the root span"
      why: "It uses the earliest start and latest end of the trace."
    - text: "decision_wait (30 s by default) ends before the trace does"
      why: "Spans that arrive after the decision miss the trace; raise decision_wait, at a memory cost."
    - text: "The load_balancing exporter splits long traces across replicas"
      why: "It routes by trace ID, so a long trace still goes to one replica."
  answer: [2]
  source: https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.165.0/processor/tailsamplingprocessor/README.md

