  tags: [collector-scaling, collector-connectors]
  exam: {cert: otca, domain: O3, competency: Scaling}
  q: "Three gateway replicas each run span_metrics behind a round-robin balancer. Request counts per service look plausible in sum but jump around per series. Which setup gives each service's metrics a single writer?"
  options:
    - text: "A first tier with load_balancing and routing_key: service"
