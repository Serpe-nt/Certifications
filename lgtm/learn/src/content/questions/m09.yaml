  exam: {cert: otca, domain: O3, competency: Scaling}
  q: "On every gateway replica the memory limiter keeps refusing spans for minutes at a time. The export queues are nearly empty and the backend answers fast. What does the scaling guide point to?"
  options:
    - text: "The backend is too slow; scale the database first"
