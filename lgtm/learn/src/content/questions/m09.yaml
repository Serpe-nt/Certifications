- id: q-m09-020
  tags: [collector-ottl]
  exam: {cert: otca, domain: O3, competency: Transforming Data}
  q: "A redaction processor is set to <code>allow_all_keys: false</code> and <code>allowed_keys: [description, email]</code>. A span arrives with <code>description</code>, <code>email</code>, <code>credit_card</code> and <code>internal_id</code>. What leaves the processor?"
  options:
    - text: "All four, with credit_card masked as ****"
