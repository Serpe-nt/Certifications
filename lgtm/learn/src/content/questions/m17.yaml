- id: q-m17-032
  tags: [scale-upgrades]
  exam: { cert: none }
  q: 'After an upgrade of one release and a check that passed, how do you prove the cluster matches the repository again?'
  options:
    - text: 'Run make lab-check once more and see it pass'
      why: 'The check tests the signals, not whether the release equals the repository''s values.'
    - text: 'Compare helm list before and after the change'
      why: 'helm list shows versions and revisions, not the values each release holds.'
    - text: 'Restart every pod of the release once'
      why: 'A restart proves nothing about the values; it only takes the pods away for a while.'
    - text: 'Run make lab for it again: changed=0'
      why: 'The playbook compares chart and values with the installed release; no change means they match.'
