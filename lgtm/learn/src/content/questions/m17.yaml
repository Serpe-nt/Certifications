  q: 'You will raise the querier''s memory request in the Mimir release. What should you look at before you apply it?'
  options:
    - text: 'The rendered diff of the release'
      why: 'A diff of the rendered manifests shows every object that will change, so a surprise is caught before the rollout.'
    - text: 'The chart''s README, to see the default for the querier'
      why: 'The default is not the question; what changes in the cluster is.'
    - text: 'The ingesters'' logs, to see that they are idle'
      why: 'The ingesters are not touched by a querier change.'
    - text: 'Kafka''s lag, to make sure the queue is empty'
      why: 'Queriers do not read Kafka; their rollout does not depend on the queue.'
