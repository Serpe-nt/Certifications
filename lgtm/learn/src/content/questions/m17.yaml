# scale-failure-drills
- id: q-m17-033
  tags: [scale-failure-drills]
  exam: { cert: none }
  q: 'The object store is down for three minutes. What happens to Mimir''s writes with ingest storage?'
  options:
    - text: 'They fail at once, because blocks cannot be uploaded'
      why: 'Writes end at Kafka. Ingesters keep samples in memory and upload blocks later.'
    - text: 'They go on, and ingesters upload their blocks once the store is back'
      why: 'Writes need Kafka, not the object store; block uploads wait and retry.'
    - text: 'They go on, but the samples of those minutes are lost'
      why: 'The samples are in Kafka and in the ingesters; nothing forces their loss.'
    - text: 'They fail until the store-gateway reloads the bucket index'
      why: 'The store-gateway serves reads of old blocks; it is not on the write path.'
  answer: [1]
  source: https://grafana.com/docs/mimir/v3.2.x/get-started/about-grafana-mimir-architecture/about-ingest-storage-architecture/

- id: q-m17-034
  tags: [scale-failure-drills]
  exam: { cert: none }
  q: 'A worker VM stops without warning. How long does Kubernetes wait, by default, before it starts evicting the pods that were on it?'
  options:
    - text: 'About 5 seconds, as soon as the kubelet misses one heartbeat'
      why: 'The node is marked Unknown after it misses heartbeats for a while; eviction comes later still.'
    - text: 'About 5 minutes after the node is marked unreachable'
      why: 'Pods tolerate the not-ready and unreachable taints for 300 seconds by default.'
    - text: 'Never, until an admin deletes the node'
      why: 'Taint-based eviction removes the pods after the toleration ends.'
    - text: 'About an hour, to wait for the node to return'
      why: 'The default toleration is 300 seconds, not an hour.'
  answer: [1]
  source: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/

