# scale-deployment-modes
- id: q-m17-001
  tags: [scale-deployment-modes]
  exam: { cert: none }
  q: 'A team plans a new Loki for about 15 GB of logs a day and has one person to run it. Which setup does Loki''s documentation point them to?'
  options:
    - text: 'Monolithic mode, one process for everything'
      why: 'Monolithic mode runs every component in one process and suits small volumes, with the least to operate.'
    - text: 'Simple scalable mode, the chart''s old middle ground'
      why: 'Simple scalable mode is being deprecated and is removed in Loki 4.0, so a new setup should not start with it.'
    - text: 'Microservices mode, because it is the production default'
      why: 'Loki recommends microservices mode for very large clusters or precise control; at 15 GB a day it is mostly work.'
    - text: 'Two monolithic processes with their own object stores'
      why: 'Scaled-out monolithic processes share one object store and one ring; separate stores would split the data.'
  answer: [0]
  source: https://grafana.com/docs/loki/v3.7.x/get-started/deployment-modes/

- id: q-m17-002
  tags: [scale-deployment-modes]
  exam: { cert: none }
  q: 'You want Tempo to stay available while one process restarts. Why does running three copies of Tempo with <code>-target=all</code> not give you that?'
  options:
    - text: 'Monolithic mode cannot write blocks to object storage'
      why: 'Monolithic mode writes to object storage too; Tempo recommends object storage for production.'
    - text: 'The backend scheduler is a single instance and cannot run three times'
      why: 'Tempo''s page says more than one -target=all instance is not supported for this reason, and points to microservices mode.'
    - text: 'Three processes would each need their own Kafka cluster'
      why: 'Monolithic mode needs no Kafka at all; the distributor hands data to the other components in-process.'
    - text: 'Monolithic mode limits each process to 25 MB/s of spans'
      why: 'The 25 to 35 MB/s is the page''s guide for when one process is enough, not a hard cap per process.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/set-up-for-tracing/setup-tempo/plan/deployment-modes/

- id: q-m17-003
  tags: [scale-deployment-modes]
  exam: { cert: none }
  q: 'Which change comes with moving Tempo from monolithic to microservices mode, apart from more pods?'
  options:
    - text: 'The query language changes from TraceQL to a sharded form'
      why: 'TraceQL is the same in both modes; only how components are grouped into processes changes.'
    - text: 'Traces must be sent through a gateway instead of to the distributor'
      why: 'Senders still write to the distributor; Tempo does not require a gateway in either mode.'
    - text: 'A Kafka-compatible queue must run between the distributor and the rest'
      why: 'Microservices mode needs Kafka, Redpanda or WarpStream as the durable queue; monolithic mode needs none.'
    - text: 'Retention moves from the backend scheduler to the querier'
      why: 'The backend scheduler and workers apply retention in both modes.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/set-up-for-tracing/setup-tempo/plan/deployment-modes/

# scale-chart-values
- id: q-m17-004
  tags: [scale-chart-values]
  exam: { cert: none }
  q: 'During an incident you must know which values a Mimir release changed from its chart. Which command shows only those?'
  options:
    - text: '<code>helm get values mimir -n mimir --all</code>'
      why: 'With --all, Helm prints the chart''s defaults merged in, thousands of lines for this chart.'
    - text: '<code>helm show values mimir-distributed</code>'
      why: 'This prints the chart''s defaults, not what the release set.'
    - text: '<code>helm get manifest mimir -n mimir</code>'
      why: 'This prints the rendered Kubernetes objects, not the values that produced them.'
    - text: '<code>helm get values mimir -n mimir</code>'
      why: 'Without --all, Helm prints only the user-supplied values of the release.'
  answer: [3]
  source: https://helm.sh/docs/helm/helm_get_values/

- id: q-m17-005
  tags: [scale-chart-values]
  exam: { cert: none }
  q: '<code>helm list</code> shows the Mimir release with APP VERSION 3.2.3, but a bug fixed in 3.2.4 does not happen. What is the likely explanation?'
  options:
    - text: 'The release overrides the image tag, so the pods run 3.2.4'
      why: 'APP VERSION is the chart''s appVersion; an image tag in the values decides what runs. The lab does exactly this.'
    - text: 'Helm upgrades the image by itself when a patch is published'
      why: 'Helm installs what the chart and values name; it does not follow new releases on its own.'
    - text: 'The bug only shows in monolithic mode'
      why: 'Nothing points to the mode. The version column is the thing to check.'
    - text: 'APP VERSION is updated only after a restart of the pods'
      why: 'APP VERSION comes from the chart, whatever the pods run or when they started.'
  answer: [0]
  source: https://helm.sh/docs/helm/helm_get_values/

- id: q-m17-006
  tags: [scale-chart-values]
  exam: { cert: none }
  q: 'In the mimir-distributed chart, where do you set Mimir''s own configuration, such as the Kafka address of ingest storage?'
  options:
    - text: 'Under <code>ingester</code>, next to its replicas'
      why: 'The component blocks set what Kubernetes needs: replicas, resources, volumes.'
    - text: 'Under <code>mimir.structuredConfig</code>'
      why: 'This block is merged into Mimir''s configuration file; the lab sets ingest_storage there.'
    - text: 'Under <code>runtimeConfig</code>'
      why: 'The runtime configuration holds per-tenant overrides that Mimir reloads, not the Kafka wiring.'
    - text: 'Under <code>kafka</code>, which installs and configures the broker'
      why: 'The chart''s kafka block installs a Kafka of its own; the lab switches it off and points Mimir at the platform''s.'
  answer: [1]
  source: https://grafana.com/docs/helm-charts/mimir-distributed/latest/

# scale-object-storage
- id: q-m17-007
  tags: [scale-object-storage]
  exam: { cert: none }
  q: 'A colleague adds a bucket rule "delete objects older than 30 days, whole bucket" to Loki''s bucket, where retention is also 30 days. What breaks first?'
  options:
    - text: 'Nothing, because both periods are 30 days'
      why: 'The rule also deletes the index, the cluster seed and delete requests, which Loki must keep.'
    - text: 'Writes, because Loki cannot create new chunks'
      why: 'New chunks are written as before. The damage is to objects Loki already relies on.'
    - text: 'Queries, once index files are deleted'
      why: 'Loki''s page warns that a rule with an empty prefix will remove the index and cause query failures.'
    - text: 'The compactor, which refuses to run with a lifecycle rule'
      why: 'The compactor does not read lifecycle rules; it simply finds objects missing.'
  answer: [2]
  source: https://grafana.com/docs/loki/v3.7.x/operations/storage/retention/

- id: q-m17-008
  tags: [scale-object-storage]
  exam: { cert: none }
  q: 'Why does Mimir refuse to start when its blocks storage and its ruler storage use the same bucket with the same prefix?'
  options:
    - text: 'Rule files would mix with tenants'' blocks'
      why: 'Mimir''s page says it fails to start in this case, which keeps rule files out of the blocks layout.'
    - text: 'S3 does not let two clients write one bucket'
      why: 'Many clients can write one bucket; the check is Mimir''s own.'
    - text: 'The ruler needs a bucket in another region'
      why: 'Nothing requires another region; a different bucket or prefix is enough.'
    - text: 'Mimir needs a separate bucket for every tenant'
      why: 'Mimir keeps all tenants of one kind in one bucket, one prefix per tenant.'
  answer: [0]
  source: https://grafana.com/docs/mimir/v3.2.x/configure/configure-object-storage-backend/

- id: q-m17-009
  tags: [scale-object-storage]
  exam: { cert: none }
  q: 'The lab''s object store was killed for memory after two Loki queries read 90 minutes of a busy namespace. Which change protects it from the next such query?'
  options:
    - text: 'A larger volume for the object store'
      why: 'The store ran out of memory, not disk. A larger volume does not change how much one read burst takes.'
    - text: 'More ingesters for Loki'
      why: 'Ingesters write and serve recent data; the heavy reads came from queriers reading chunks.'
    - text: 'A lifecycle rule that keeps only one hour of logs'
      why: 'It would delete most of the logs the lab must keep, and a lifecycle rule must stay longer than retention.'
    - text: 'Loki query limits on the bytes a query may read'
      why: 'The lab added max_query_bytes_read of 500MB after this outage, so such a query is refused before it reads.'
  answer: [3]
  source: https://grafana.com/docs/loki/v3.7.x/configure/

# scale-kafka
- id: q-m17-010
  tags: [scale-kafka]
  exam: { cert: none }
  q: 'Kafka keeps 24 hours or 640 MiB per partition. Mimir''s write rate doubles after a new team joins. What happens to the time Kafka keeps?'
  options:
    - text: 'It stays 24 hours, because the time limit is fixed'
      why: 'Whichever limit is reached first wins; with more data per hour, the size limit is reached sooner.'
    - text: 'It about halves, because the size limit is reached twice as fast'
      why: 'The same 640 MiB now holds half as many hours of records per partition.'
    - text: 'It doubles, because Kafka adds partitions'
      why: 'Kafka never adds partitions by itself; an operator does.'
    - text: 'It stays the same, because Mimir compresses more'
      why: 'Nothing in the change makes records smaller; more samples mean more bytes.'
  answer: [1]
  source: https://kafka.apache.org/43/configuration/topic-configs/

- id: q-m17-011
  tags: [scale-kafka]
  exam: { cert: none }
  q: 'A Tempo block-builder shows a lag of 240 seconds, rising and falling every few minutes. Is that a problem?'
  options:
    - text: 'Yes, any lag over a few seconds means lost spans'
      why: 'Lag is lost data only when it passes what Kafka keeps; seconds or minutes are far inside it.'
    - text: 'Yes, the block-builder should read every record at once'
      why: 'Block-builders consume in cycles by design; they do not stream like a live-store.'
    - text: 'No, a block-builder consumes in 5-minute cycles'
      why: 'Its lag rises during a cycle and drops when it consumes; it matters only against Kafka''s retention.'
    - text: 'No, block-builders are not consumers of Kafka'
      why: 'They are: block-builders form one consumer group of the Tempo topic.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/reference-tempo-architecture/components/kafka/

- id: q-m17-012
  tags: [scale-kafka]
  exam: { cert: none }
  q: 'Mimir''s topic has 6 partitions and you want to run 8 ingesters per zone. What must happen first?'
  options:
    - text: 'Nothing, two ingesters will share each extra partition'
      why: 'Each ingester reads exactly one partition, chosen by its number; ingesters 6 and 7 would have none.'
    - text: 'Remove the topic and create it again with 8 partitions'
      why: 'Deleting the topic drops the records the ingesters have not read. Partitions can be added in place.'
    - text: 'Lower the topic''s replication factor to free brokers'
      why: 'Replicas are about durability, not about how many consumers can read.'
    - text: 'Add partitions to the topic until it has at least 8'
      why: 'Kafka can add partitions to a topic; Mimir needs at least as many partitions as ingesters per zone.'
  answer: [3]
  source: https://grafana.com/docs/mimir/v3.2.x/get-started/about-grafana-mimir-architecture/about-ingest-storage-architecture/

- id: q-m17-013
  tags: [scale-kafka]
  exam: { cert: none }
  q: 'Kafka has replication factor 3 and <code>min.insync.replicas: 2</code>. Two of the three brokers are down. What happens to writes that use acks=all?'
  options:
    - text: 'They are refused with NotEnoughReplicas'
      why: 'With one in-sync replica, fewer than min.insync.replicas, the producer gets NotEnoughReplicas.'
    - text: 'They succeed on the one broker that is left'
      why: 'That would hold with min.insync.replicas of 1, not 2.'
    - text: 'They are queued on the broker until the others return'
      why: 'Kafka refuses such a write; the producer must retry.'
    - text: 'They succeed, and Kafka copies them to the others later'
      why: 'A write with acks=all is accepted only when enough replicas have it.'
  answer: [0]
  source: https://kafka.apache.org/43/configuration/topic-configs/

# scale-replication
- id: q-m17-014
  tags: [scale-replication]
  exam: { cert: none }
  q: 'The lab''s Loki runs three ingesters with replication factor 3. One ingester is killed. What do users see?'
  options:
    - text: 'Recent log queries fail until the ingester is back'
      why: 'The two other ingesters hold every stream, so reads can still be answered.'
    - text: 'Pushes fail, because every write needs all three'
      why: 'A write needs a quorum of two of three, which the remaining ingesters give.'
    - text: 'Nothing, because two of three ingesters still hold each stream'
      why: 'With replication factor 3, writes and reads need two healthy ingesters, and two are left.'
    - text: 'The lines of the last hour are lost'
      why: 'The other two ingesters hold the same lines.'
  answer: [2]
  source: https://grafana.com/docs/loki/v3.7.x/get-started/architecture/

- id: q-m17-015
  tags: [scale-replication]
  exam: { cert: none }
  q: 'An admin runs <code>kubectl drain</code> on a worker that runs two Mimir ingesters, while the PodDisruptionBudget allows one ingester down. What happens?'
  options:
    - text: 'Both ingesters are evicted at once, because drains ignore budgets'
      why: 'A drain uses the Eviction API, which respects PodDisruptionBudgets.'
    - text: 'One is evicted; the drain waits for it to be back before the second'
      why: 'The budget lets one ingester be disrupted at a time, so the drain evicts them one after the other.'
    - text: 'The drain fails at once and changes nothing'
      why: 'The drain retries a refused eviction and goes on once the budget allows it.'
    - text: 'The ingesters move with their memory to another node'
      why: 'Evicted pods are recreated elsewhere and start again; they replay their WAL and Kafka.'
  answer: [1]
  source: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/

- id: q-m17-016
  tags: [scale-replication]
  exam: { cert: none }
  q: 'You plan zone-aware Mimir with ingest storage on three racks. What must the rollout of a new version respect?'
  options:
    - text: 'One ingester at a time, across all racks'
      why: 'Safe but slow. With zones, a whole zone can roll at once.'
    - text: 'All ingesters at once, since Kafka holds the data'
      why: 'With every zone down at once, no partition has a reader and recent queries fail.'
    - text: 'One zone at a time, all its ingesters together'
      why: 'Mimir''s documentation allows rolling all instances of one zone together and asks for one zone at a time.'
    - text: 'Distributors first, because they hold the ring'
      why: 'Distributors are stateless and can roll any time; the order of zones is what matters for ingesters.'
  answer: [2]
  source: https://grafana.com/docs/mimir/v3.2.x/manage/run-production-environment/perform-a-rolling-update/

# scale-multi-tenancy
- id: q-m17-017
  tags: [scale-multi-tenancy]
  exam: { cert: none }
  q: 'A query to Mimir with the header <code>X-Scope-OrgID: lab|prom</code> returns "too many tenant IDs present in the request". Why?'
  options:
    - text: 'The pipe is not allowed in a tenant ID'
      why: 'The pipe is the separator for federation; Mimir read two tenants, which is why it refused.'
    - text: 'The tenant prom does not exist yet in Mimir'
      why: 'The error names the count of tenants, not a missing one.'
    - text: 'Tenant federation is off in this Mimir'
      why: 'With tenant_federation.enabled false, Mimir allows one tenant per request.'
    - text: 'The gateway strips the header and adds its own'
      why: 'The lab''s gateway passes the header on as it is.'
  answer: [2]
  source: https://grafana.com/docs/mimir/v3.2.x/manage/secure/authentication-and-authorization/

- id: q-m17-018
  tags: [scale-multi-tenancy]
  exam: { cert: none }
  q: 'A batch job of tenant team-b sends 300,000 samples in a burst every hour, and other tenants'' writes stay fast. What did the distributors most likely do with the burst?'
  options:
    - text: 'Accepted it and slowed down every other tenant'
      why: 'The other tenants stay fast, so the distributors did not let the burst reach their share of the work.'
    - text: 'Refused what went over its limits with 429'
      why: 'Per-tenant ingestion limits stop one tenant''s burst at the distributors without touching the others.'
    - text: 'Wrote it to Kafka and let the ingesters refuse it'
      why: 'Rate limits are checked by the distributors before Kafka; ingesters check other limits.'
    - text: 'Moved team-b to an ingester of its own for an hour'
      why: 'Mimir does not move a tenant on its own; shuffle sharding is configured, not automatic.'
  answer: [1]
  source: https://grafana.com/docs/mimir/v3.2.x/references/architecture/components/distributor/

- id: q-m17-019
  tags: [scale-multi-tenancy]
  exam: { cert: none }
  q: 'You raise one tenant''s <code>ingestion_rate</code> in Mimir''s runtime configuration. When does the change take effect?'
  options:
    - text: 'After the next rolling restart of the distributors'
      why: 'No restart is needed; that is the point of the runtime configuration.'
    - text: 'At once, as soon as you save the values file'
      why: 'The release must be applied, and the file must reach the pods, before Mimir can read it.'
    - text: 'Only for series that are created after the change'
      why: 'A rate limit is per tenant, not per series.'
    - text: 'Soon after the new file reaches the pods'
      why: 'Mimir reloads the runtime file every 10 seconds by default; the kubelet first has to update the ConfigMap in the pods.'
  answer: [3]
  source: https://grafana.com/docs/mimir/v3.2.x/configure/about-runtime-configuration/

- id: q-m17-020
  tags: [scale-multi-tenancy]
  exam: { cert: none }
  q: 'A pod sends a write to the lab''s Mimir gateway without any <code>X-Scope-OrgID</code> header. What happens to the samples?'
  options:
    - text: 'They are refused with 401 no org id'
      why: 'That is what Loki answers when the header is missing; the lab''s Mimir gateway fills one in instead.'
    - text: 'They are stored in tenant lab, the lab''s default'
      why: 'lab is only the tenant the senders choose; nothing makes it a default.'
    - text: 'They are stored in tenant anonymous'
      why: 'The lab''s Mimir gateway turns a missing header into anonymous, so the data lands there.'
    - text: 'They are dropped by the distributor without an answer'
      why: 'The write goes through; it just lands in a tenant nobody reads.'
  answer: [2]
  source: https://grafana.com/docs/mimir/v3.2.x/manage/secure/authentication-and-authorization/

# scale-retention
- id: q-m17-021
  tags: [scale-retention]
  exam: { cert: none }
  q: 'A new Mimir runs for a year with <code>compactor_blocks_retention_period</code> never set. What does the bucket hold?'
  options:
    - text: 'Every block written during the year'
      why: 'Mimir''s page says stored metrics are never deleted by default.'
