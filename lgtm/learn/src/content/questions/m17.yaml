  exam: { cert: none }
  q: 'A Deployment of two queriers uses Kubernetes'' default rolling update. How does it replace the pods?'
  options:
    - text: 'It deletes both, then starts two new ones'
      why: 'That is the Recreate strategy, not the default.'
    - text: 'It starts one new pod above the count, then removes an old one, and so on'
      why: 'With 25% surge, rounded up to one, and 25% unavailable, rounded down to zero, it adds one before it removes one.'
    - text: 'It waits for a PodDisruptionBudget to allow each step'
      why: 'Rolling updates of a Deployment are not limited by PodDisruptionBudgets.'
    - text: 'It replaces the pods in alphabetical order, one per minute'
      why: 'There is no fixed order or interval; readiness decides the pace.'
