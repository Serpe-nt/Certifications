# scale-capacity
- id: q-m17-028
  tags: [scale-capacity]
  exam: { cert: none }
  q: 'By Mimir''s sizing page, how many distributor cores does a cluster need for 100,000 samples per second, before any headroom?'
  options:
    - text: 'About 1 core'
      why: 'The page gives one core per 25,000 samples per second, so 100,000 needs four.'
    - text: 'About 4 cores'
      why: 'One core per 25,000 samples per second gives four cores.'
    - text: 'About 10 cores'
      why: 'Ten would be the querier ratio applied to queries, not samples.'
    - text: 'About 40 cores'
      why: 'That is ten times the page''s ratio.'
  answer: [1]
  source: https://grafana.com/docs/mimir/v3.2.x/manage/run-production-environment/planning-capacity/

- id: q-m17-029
