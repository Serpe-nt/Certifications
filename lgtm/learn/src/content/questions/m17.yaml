      why: 'Samples per second grow too, but the sizing page gives an ingester 2.5 GB per 300,000 series against a distributor''s 1 GB per 25,000 samples per second; the ingesters grow far more.'
    - text: 'The query frontend, because there are more series to list'
      why: 'The query frontend scales with queries per second, not with series.'
    - text: 'The ingesters, because series in memory grow'
      why: 'Ingesters are sized by series in memory, and a 50-value label multiplies the series.'
