  source: https://grafana.com/docs/loki/v3.7.x/operations/meta-monitoring/

- id: q-m17-027
  tags: [scale-meta-monitoring]
  exam: { cert: none }
  q: 'Senders get 200 from Mimir, yet a series has gaps. With ingest storage, which metric shows samples dropped after the write was accepted?'
  options:
    - text: 'cortex_distributor_received_samples_total'
      why: 'It counts what the distributors accepted, including the samples dropped later.'
    - text: 'cortex_ingester_active_series'
      why: 'It counts series in memory, not samples that were refused.'
    - text: 'cortex_discarded_samples_total on the ingesters'
      why: 'The ingesters count samples they reject after Kafka, by tenant and reason.'
    - text: 'cortex_request_duration_seconds_count on the gateway'
      why: 'Request counts show the 200s, which is the problem here, not the answer.'
