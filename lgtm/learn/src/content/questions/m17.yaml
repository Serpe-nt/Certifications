      why: '13 hours is how long queriers ask ingesters, not how long blocks are kept.'
    - text: 'The last 7 days, the chart''s own default'
      why: '7 days is the lab''s own setting, not a default of Mimir.'
    - text: 'The last 30 days, the compactor''s default'
      why: 'The compactor deletes nothing until a retention period is set.'
  answer: [0]
  source: https://grafana.com/docs/mimir/v3.2.x/configure/configure-metrics-storage-retention/

- id: q-m17-022
  tags: [scale-retention]
  exam: { cert: none }
  q: 'Tempo''s <code>block_retention</code> is 48 hours. One tenant needs traces for 14 days. What do you set?'
  options:
    - text: 'block_retention: 336h, for every tenant'
      why: 'That keeps every tenant 14 days and multiplies the storage of all of them.'
    - text: 'A per-tenant compaction.block_retention'
      why: 'A per-tenant override replaces the default retention for that tenant only.'
    - text: 'A longer Kafka retention for the trace topic'
      why: 'Kafka keeps records only for its own retention, hours in the lab; it is not long-term trace storage.'
    - text: 'A lifecycle rule on the tenant''s prefix of 14 days'
      why: 'Tempo''s compaction would still delete the blocks after 48 hours.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/configuration/

- id: q-m17-023
  tags: [scale-retention]
  exam: { cert: none }
  q: 'A team asks Loki to keep the debug stream of one service only 6 hours, to save space. Why can''t a retention_stream rule do this?'
  options:
    - text: 'Stream rules only work in microservices mode'
      why: 'Retention runs in the compactor in every mode.'
    - text: 'Stream rules can only lengthen retention'
      why: 'A stream rule can shorten or lengthen; the limit is a minimum period.'
    - text: 'Loki needs a per-tenant rule for every stream'
      why: 'Global stream rules exist too; a tenant rule is not required.'
    - text: 'A stream rule must be at least 24 hours'
      why: 'Loki refuses a retention_stream period below 24h, globally and per tenant.'
  answer: [3]
  source: https://grafana.com/docs/loki/v3.7.x/operations/storage/retention/

# scale-cost-control and cardinality
- id: q-m17-024
  tags: [scale-cost-control, cardinality]
  exam: { cert: none }
  q: 'A service exports a histogram with 20 buckets and a label <code>customer_id</code> with 5,000 values. Which change cuts the most series while the team keeps its latency percentiles per endpoint?'
  options:
    - text: 'Drop the whole histogram at the collector'
      why: 'It cuts the most, but the percentiles per endpoint would be gone too.'
    - text: 'Scrape the service every 60 seconds instead of 15'
      why: 'Fewer samples per series, but the number of series stays the same.'
    - text: 'Sum customer_id away before the data leaves the collector'
      why: 'Each customer value multiplied every bucket; summed away, the series shrink by up to 5,000 times and the percentiles per endpoint stay.'
    - text: 'Keep only 5 of the 20 buckets'
      why: 'Fewer buckets save a factor of about three, far less than summing away a 5,000-value label.'
  answer: [2]
  source: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

- id: q-m17-025
  tags: [scale-cost-control]
  exam: { cert: none }
  q: 'Your bill is driven by active series. Which of these lowers it the least?'
  options:
    - text: 'Dropping metrics that no dashboard, rule or query reads'
      why: 'Each dropped series stops costing at once.'
    - text: 'Aggregating away a high-cardinality label before storage'
      why: 'Fewer label values mean fewer series.'
    - text: 'Grouping one label''s thousands of values into a few'
      why: 'Fewer distinct values fold many series into few.'
    - text: 'Halving the scrape interval of every target'
      why: 'Scraping twice as often doubles the samples and keeps every series, so the series bill does not drop.'
  answer: [3]
  source: https://grafana.com/docs/grafana-cloud/adaptive-telemetry/adaptive-metrics/

# scale-meta-monitoring
- id: q-m17-026
  tags: [scale-meta-monitoring]
  exam: { cert: none }
  q: 'Where should the alerts that watch your production Loki run, according to Loki''s meta-monitoring page?'
  options:
    - text: 'In Loki''s own ruler, on Loki''s own logs'
      why: 'A broken Loki would also break the rules that watch it.'
    - text: 'In a separate stack or a hosted account'
      why: 'Loki recommends watching it from a separate stack, so a broken cluster can be investigated from a working one.'
    - text: 'In the application''s collector, next to its exporters'
      why: 'The collector sends data; it does not evaluate alerts on the store.'
    - text: 'On the object store, as lifecycle notifications'
      why: 'Object store events say nothing about Loki''s health.'
