  q: Prometheus scrapes every 60 seconds, but the Grafana data source still has its scrape interval at the default 15s. Panels using <code>rate(x[$__rate_interval])</code> show gaps or no data. Why?
  options:
    - text: $__rate_interval uses the wrong 15s, so the window is too small
      why: <code>$__rate_interval</code> is at least four times the scrape interval set in the data source. At 15s instead of 60s, the window often holds too few samples for rate().
    - text: $__rate_interval works only with the <code>irate()</code> function
      why: Grafana designed it for rate() and increase().
    - text: rate() needs a fixed window such as <code>[1m]</code> in Grafana
      why: Grafana recommends $__rate_interval over a fixed window. The setting behind it is what is wrong here.
    - text: Grafana cannot run rate() on targets that are scraped every 60 seconds
      why: Any scrape interval works once the data source knows the real value.
  answer: [0]
  source: https://grafana.com/docs/grafana/latest/datasources/prometheus/template-variables/

- id: q-mock-pca-089
  tags: [dashboard-variables]
