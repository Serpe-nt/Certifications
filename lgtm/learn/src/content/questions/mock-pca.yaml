  source: https://prometheus.io/docs/alerting/latest/alertmanager/#high-availability

- id: q-mock-pca-105
  tags: [alert-alertmanager]
  exam: {cert: pca, domain: P5, competency: Understand and Use Alertmanager}
  q: A network split makes 300 service instances lose their database at once, and each fires an alert. Two identical Prometheus servers send the alerts. How does the Alertmanager help the on-call person here? (Choose two.)
  options:
    - text: It groups the alerts into one notification
      why: Grouping, for example by alertname and cluster, puts similar alerts into one notification that still lists the affected instances.
    - text: It sends duplicate alerts from the server pair once
      why: The Alertmanager deduplicates identical alerts, such as the same alert from both servers of the pair.
    - text: It finds the root cause and closes the other alerts
      why: The Alertmanager does not analyse causes. It groups, deduplicates, routes and mutes.
    - text: It slows the scrapes of the failing instances
      why: The Alertmanager does not control scraping. That is Prometheus's job.
    - text: It deletes the alerting rules that fire too often
      why: Rules live in Prometheus. The Alertmanager never changes them.
  answer: [0, 1]
  source: https://prometheus.io/docs/alerting/latest/alertmanager/

# P5 Alerting & Dashboarding: Alerting basics (when, what, and why)
- id: q-mock-pca-106
  tags: [alert-design]
  exam: {cert: pca, domain: P5, competency: "Alerting basics (when, what, and why)"}
  q: A web shop has a frontend, an API and a database. Where do the Prometheus alerting guidelines suggest paging on high latency?
  options:
    - text: At one point, as high up in the stack as possible
      why: Page on latency at one point in the stack, as close to users as possible. A slow lower part is no reason to page if users are fine.
    - text: At every layer, so the slow part is found at once
      why: The guidelines advise only one latency page per stack. Dashboards should help find the cause.
    - text: Only at the database, since it is usually the cause
      why: The guidelines say to alert on symptoms users feel, not on likely causes.
    - text: Nowhere; latency should only be on dashboards
      why: High latency is a symptom users feel, so it is worth a page at one point.
  answer: [0]
  source: https://prometheus.io/docs/practices/alerting/#online-serving-systems

- id: q-mock-pca-107
  tags: [alert-design]
  exam: {cert: pca, domain: P5, competency: "Alerting basics (when, what, and why)"}
  q: A batch job runs every 4 hours and takes 1 hour. After how long without a success do the guidelines suggest a page?
  options:
    - text: About 10 hours
      why: Allow at least enough time for 2 full runs. The guidelines give 10 hours as a reasonable threshold for this job.
    - text: About 4 hours
      why: That pages after a single missed run. One failure should not need a human.
    - text: About 1 hour
      why: That is the run time of one job, much too short for a threshold.
    - text: About 24 hours
      why: That waits much longer than two runs, so users may feel the problem first.
  answer: [0]
  source: https://prometheus.io/docs/practices/alerting/#batch-jobs

- id: q-mock-pca-108
  tags: [alert-design]
  exam: {cert: pca, domain: P5, competency: "Alerting basics (when, what, and why)"}
  q: Which alert follows the Prometheus guidance on metamonitoring best?
  options:
    - text: An end-to-end test that an alert reaches email
      why: The guidelines prefer one blackbox test of the whole path, from Prometheus through the Alertmanager to email, over separate alerts on each part.
    - text: One alert for each Prometheus, Alertmanager and Pushgateway process
      why: Such alerts are allowed, but the guidelines say a test of the whole path is better.
    - text: No alert, since Prometheus monitors itself
      why: You need confidence that monitoring works, so it needs its own alerts.
    - text: An alert on every scrape error in the Prometheus logs
      why: That is a cause-based alert with a lot of noise. The guidance favours symptoms.
  answer: [0]
  source: https://prometheus.io/docs/practices/alerting/#metamonitoring

- id: q-mock-pca-109
  tags: [alert-design]
  exam: {cert: pca, domain: P5, competency: "Alerting basics (when, what, and why)"}
  q: The on-call engineer is paged most nights for high CPU on one node. Users never notice, and the engineer has nothing to do. What do the alerting guidelines suggest?
  options:
    - text: Drop the page and alert on symptoms that users feel
      why: Keep alerting simple, alert on symptoms, and avoid pages where there is nothing to do.
    - text: Keep the page but lower the CPU threshold
      why: A lower threshold pages even more often for a cause users do not feel.
    - text: Send the page to two engineers so it is shared
      why: Sharing a useless page does not make it useful.
    - text: Add a CPU page for every other node as well
      why: More cause-based pages add noise without telling anyone that users are hurt.
  answer: [0]
  source: https://prometheus.io/docs/practices/alerting/
