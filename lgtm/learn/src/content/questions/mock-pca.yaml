  q: You run three Alertmanagers as a cluster. How should each Prometheus server send its alerts to them?
  options:
    - text: To all three, each one listed in the Prometheus configuration
      why: The docs say not to load balance this traffic, but to point Prometheus to the list of all Alertmanagers.
    - text: To one load balancer in front of the three Alertmanagers
      why: The docs say not to load balance traffic between Prometheus and its Alertmanagers.
    - text: To one Alertmanager only, which forwards to the others
      why: Each instance receives alerts on its own. Only silences and notification state are shared.
    - text: To a Pushgateway, which the Alertmanagers scrape
