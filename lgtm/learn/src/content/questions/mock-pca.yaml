- id: q-mock-pca-055
  tags: [promql-aggregation]
  exam: {cert: pca, domain: P3, competency: Aggregating over dimensions}
  q: Every instance exposes <code>build_version</code>, whose value is a build number. You want to know how many instances run each build. Which query does that?
  options:
    - text: <code>count_values("version", build_version)</code>
      why: <code>count_values()</code> returns one series per distinct value, with that value in the <code>version</code> label and the number of instances as the value.
    - text: <code>count by (version) (build_version)</code>
      why: There is no <code>version</code> label to group by. The build number is the sample value.
    - text: <code>count by (build_version) (build_version)</code>
      why: <code>by</code> takes label names. The build number is a sample value, not a label, so this returns one total count.
    - text: <code>group(build_version)</code>
      why: <code>group()</code> returns 1 for each group. It does not count instances per value.
