  source: https://prometheus.io/docs/instrumenting/writing_exporters/#drop-less-useful-statistics

# P4 Instrumentation and Exporters: Structuring and naming metrics
- id: q-mock-pca-084
  tags: [prom-metric-naming]
  exam: {cert: pca, domain: P4, competency: Structuring and naming metrics}
  q: Which metric name follows the Prometheus naming conventions?
  options:
    - text: <code>http_request_duration_seconds</code>
      why: It has a prefix for the domain, a base unit and the unit as a plural suffix.
    - text: <code>http_request_duration_ms</code>
      why: Names should use base units. Time is measured in seconds, not milliseconds.
    - text: <code>http_request_duration</code>
      why: Names should end with their unit as a plural suffix. This name does not say whether it measures seconds or milliseconds.
    - text: <code>http:request_duration:seconds</code>
      why: Colons are reserved for recording rules. Exporters and direct instrumentation should not use them.
  answer: [0]
  source: https://prometheus.io/docs/practices/naming/

- id: q-mock-pca-085
  tags: [prom-metric-naming]
  exam: {cert: pca, domain: P4, competency: Structuring and naming metrics}
  q: Which two metric names follow the conventions for an accumulating count? (Choose two.)
  options:
    - text: <code>process_cpu_seconds_total</code>
      why: An accumulating count with a unit has the unit and then <code>_total</code>.
    - text: <code>http_requests_total</code>
      why: A count without a unit ends in <code>_total</code>.
    - text: <code>http_requests_count</code>
      why: <code>_count</code> belongs to summaries and histograms. Counters use <code>_total</code>.
    - text: <code>process_cpu_total_seconds</code>
      why: The unit comes before <code>_total</code>, as in <code>process_cpu_seconds_total</code>.
    - text: <code>http_requests_per_second</code>
      why: The app should not compute a rate. Expose the count, and let rate() give per second.
  answer: [0, 1]
  source: https://prometheus.io/docs/practices/naming/

- id: q-mock-pca-086
  tags: [prom-metric-naming, prom-data-model]
  exam: {cert: pca, domain: P4, competency: Structuring and naming metrics}
  q: A service exposes <code>http_responses_500_total</code>, <code>http_responses_404_total</code> and <code>http_responses_200_total</code>. How should this be restructured?
  options:
    - text: One metric <code>http_responses_total</code> with a <code>code</code> label
      why: Metrics you want to add or average should be one metric with labels. No part of a name should be generated.
    - text: Keep the three names and add <code>http_responses_all_total</code>
      why: A hand-made total duplicates what sum() gives and keeps the generated names.
    - text: One gauge per code, reset to 0 every minute
      why: Gauges reset by hand lose counts between scrapes. The type was not the problem.
    - text: Put the code in the help string of each metric
      why: Help text is not queryable. A label lets PromQL filter and aggregate by code.
  answer: [0]
  source: https://prometheus.io/docs/practices/instrumentation/#use-labels

- id: q-mock-pca-087
  tags: [prom-metric-naming, promql-aggregation]
  exam: {cert: pca, domain: P4, competency: Structuring and naming metrics}
  q: 'An exporter exposes <code>queue_items{queue="a"} 1</code>, <code>queue_items{queue="b"} 6</code> and <code>queue_items{queue="total"} 7</code>. What is wrong?'
  options:
    - text: <code>sum()</code> now counts every item twice
      why: The guidelines say never to expose a total like this. Anyone who sums the metric counts every item twice.
    - text: Nothing; a total series saves PromQL work
      why: Prometheus aggregation already gives the total. The extra series makes sums wrong.
    - text: The label name <code>queue</code> is reserved
      why: <code>queue</code> is an ordinary label name. The problem is the total series.
    - text: Label values may not be the word <code>total</code>
      why: Any UTF-8 text is a valid label value. The meaning of this one is the problem.
  answer: [0]
  source: https://prometheus.io/docs/instrumenting/writing_exporters/#labels

# P5 Alerting & Dashboarding: Dashboarding basics
