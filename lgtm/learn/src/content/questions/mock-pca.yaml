  q: A Grafana-managed alert rule has a pending period of 5 minutes and a keep firing for period of 10 minutes. The threshold is no longer breached, but the alert has not resolved yet. Which state is it in?
  options:
    - text: Recovering
      why: Recovering is the state of a firing alert whose threshold is no longer breached while the keep firing for period has not ended.
    - text: Pending
      why: Pending is before firing, while the pending period runs. This alert has already fired.
    - text: No Data
      why: No Data means the query returned nothing. Here the query works, it just no longer breaches.
    - text: Normal
      why: The alert returns to Normal only after the keep firing for period ends.
