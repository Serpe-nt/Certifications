  q: A dashboard variable <code>$job</code> allows several values. The query uses <code>up{job="$job"}</code>. With two jobs selected, the panel is empty. What fixes it?
  options:
    - text: Use <code>=~</code>, because the values form a regex
      why: Grafana joins several values with a pipe, which only works with a regex matcher.
    - text: Use <code>job!="$job"</code>, because the values are excluded
      why: A not-equal matcher selects everything else. The goal is to match the chosen jobs.
    - text: Turn on "Include All" so both jobs are found
      why: All is also a regex of every value, so <code>=</code> still fails.
    - text: Write the variable as <code>[[job]]</code> instead
      why: That is only an older syntax for the same variable. It does not change the matcher.
