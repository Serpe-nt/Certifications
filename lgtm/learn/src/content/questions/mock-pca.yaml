  source: https://prometheus.io/docs/prometheus/latest/querying/operators/#count_values

- id: q-mock-pca-056
  tags: [promql-aggregation]
  exam: {cert: pca, domain: P3, competency: Aggregating over dimensions}
  q: A recording rule stores an error ratio per instance. A team averages it with <code>avg</code> to get the ratio for the whole job. Instances get very different traffic. What do the docs advise?
  options:
    - text: Sum errors and requests first, then divide
      why: When aggregating ratios, aggregate the numerator and the denominator separately, then divide. An average of ratios is not statistically valid.
    - text: Keep <code>avg</code>; it is right when each value is a ratio
      why: An average gives a quiet instance the same weight as a busy one, so the job ratio comes out wrong.
    - text: Use <code>max</code> to stay on the safe side
      why: The highest ratio of one instance is not the job's ratio. It overstates the errors.
    - text: Use <code>quantile(0.5, ...)</code> to remove outliers
      why: A median of ratios has the same weighting problem as an average.
  answer: [0]
  source: https://prometheus.io/docs/practices/rules/

# P3 PromQL: Binary operators
- id: q-mock-pca-057
  tags: [promql-binary-ops]
  exam: {cert: pca, domain: P3, competency: Binary operators}
  q: <code>errors:rate5m</code> has the labels <code>method</code> and <code>code</code>. <code>requests:rate5m</code> has only <code>method</code>. Why does <code>errors:rate5m{code="500"} / requests:rate5m</code> return nothing?
  options:
    - text: The label sets differ, so nothing matches; add <code>ignoring(code)</code>
      why: By default both sides must have exactly the same labels. ignoring(code) leaves code out of the matching.
    - text: Division between two vectors is not allowed in PromQL
      why: Arithmetic between instant vectors is allowed. The sides only need to match.
    - text: Names with colons cannot be used in binary operations
      why: Colons are normal in recording rule names. They do not affect matching.
    - text: The left side must be wrapped in <code>sum()</code> before dividing
      why: <code>sum()</code> without by would remove method as well. Leaving code out of the match is enough.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/querying/operators/#one-to-one-vector-matches

- id: q-mock-pca-058
  tags: [promql-binary-ops]
  exam: {cert: pca, domain: P3, competency: Binary operators}
  q: You divide <code>errors:rate5m</code> (labels <code>method</code>, <code>code</code>) by <code>requests:rate5m</code> (label <code>method</code>) with <code>ignoring(code)</code>, keeping every code. Several error series match each request series. What must you add?
  options:
    - text: <code>group_left</code>, since the left side has more series
      why: Many-to-one matching must be asked for, and group_left says the left side has the higher cardinality.
    - text: <code>group_right</code>, because the right side is the divisor
      why: <code>group_right</code> is for the case where the right side has more series per match. Here it is the left.
    - text: <code>bool</code>, so that the result is 0 or 1
      why: <code>bool</code> changes comparison operators. It has nothing to do with matching many to one.
    - text: <code>on(code)</code>, so that the code label is used to match
      why: The right side has no code label, so matching on it finds nothing.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/querying/operators/#many-to-one-and-one-to-many-vector-matches

- id: q-mock-pca-059
  tags: [promql-binary-ops]
  exam: {cert: pca, domain: P3, competency: Binary operators}
  q: What is the difference between <code>up > 0</code> and <code>up > bool 0</code>?
  options:
    - text: The first drops false series; the second returns 0 or 1
      why: Comparisons filter by default. With bool, every matched series is kept with the value 0 or 1.
    - text: The first returns 0 or 1 for each series; the second drops series
      why: This is the other way round. bool is the one that returns 0 or 1.
    - text: Both return the same result; bool only makes the query faster
      why: <code>bool</code> changes the result. Series where the test is false are kept as 0 instead of dropped.
    - text: The first is invalid; comparisons need bool against a number
      why: <code>bool</code> is required only between two scalars. A vector compared with a scalar filters without it.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/querying/operators/#comparison-binary-operators

- id: q-mock-pca-060
  tags: [promql-binary-ops]
  exam: {cert: pca, domain: P3, competency: Binary operators}
  q: What does <code>vector1 unless vector2</code> return?
  options:
    - text: The elements of vector1 that have no element with the same labels in vector2
      why: <code>unless</code> keeps the left-hand elements that find no exact label match on the right.
    - text: The elements of vector2 that have no element with the same labels in vector1
      why: The result always comes from the left-hand side. This describes the reverse.
    - text: The elements found in both vectors, with values from vector2
      why: Elements found on both sides are what <code>and</code> keeps, with values from the left.
    - text: All elements of both vectors, with each label set kept once
      why: That describes <code>or</code>, the union.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/querying/operators/#logicalset-binary-operators

- id: q-mock-pca-061
  tags: [promql-binary-ops]
  exam: {cert: pca, domain: P3, competency: Binary operators}
  q: You run <code>node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes</code>. What metric name do the result series have?
  options:
    - text: None, since arithmetic between vectors drops the name
      why: In any arithmetic binary operation involving vectors, the metric name is dropped.
    - text: <code>node_memory_MemTotal_bytes</code>, from the left side
      why: The left name is kept for comparisons without bool, not for arithmetic.
    - text: <code>node_memory_MemAvailable_bytes</code>, from the right side
      why: The right name is kept only for comparisons with group_right.
    - text: A new name made of both, joined by a minus sign
      why: PromQL never builds names that way. A recording rule can give the result a name.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/querying/operators/#arithmetic-binary-operators

# P3 PromQL: Histograms
- id: q-mock-pca-062
  tags: [promql-histograms]
  exam: {cert: pca, domain: P3, competency: Histograms}
  q: <code>histogram_quantile(0.9, sum by (job) (rate(http_request_duration_seconds_bucket[10m])))</code> returns no data, although the classic histogram has data. What is wrong?
  options:
    - text: The <code>by</code> clause must also keep the <code>le</code> label
      why: For classic histograms the le label is needed to find the buckets. Samples without it are silently ignored.
    - text: The quantile must be written as 90, not 0.9
      why: The quantile is a number from 0 to 1. 0.9 is the 90th percentile.
    - text: rate() must be applied after histogram_quantile()
      why: The docs put rate() inside, to set the time window for the calculation.
    - text: Classic histograms need histogram_avg() first
      why: <code>histogram_avg()</code> works on native histograms and returns an average, not buckets.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/querying/functions/#histogram_quantile

- id: q-mock-pca-063
  tags: [promql-histograms, prom-scrape-config]
  exam: {cert: pca, domain: P3, competency: Histograms}
  q: On Prometheus 3.9, a Go service exposes native histograms, but Prometheus stores only the classic buckets. What is the likely cause?
  options:
    - text: <code>scrape_native_histograms</code> is not set to true
      why: Native histograms are stable, but scraping them must be enabled with <code>scrape_native_histograms</code>, which defaults to false.
    - text: The <code>native-histograms</code> feature flag is missing
      why: From 3.9 that feature flag does nothing. The scrape setting decides.
    - text: Native histograms can only arrive by remote write
      why: Native histograms can be scraped, over the protobuf format, once the setting is on.
    - text: Go client libraries cannot expose native histograms
      why: The Go library is one of the libraries that support native histograms.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/migration/#flags

- id: q-mock-pca-064
  tags: [promql-histograms]
  exam: {cert: pca, domain: P3, competency: Histograms}
  q: Ten replicas each expose a summary with a 0.95 quantile. You need the 95th percentile latency for the whole service. What do the docs say?
  options:
    - text: Quantiles from summaries cannot be combined; use a histogram
      why: Precomputed summary quantiles cannot be aggregated in a meaningful way. Histograms can be summed and then passed to histogram_quantile().
    - text: <code>avg(http_request_duration_seconds{quantile="0.95"})</code> is fine
      why: The docs show this exact query as bad. An average of percentiles is not a percentile.
    - text: <code>max(http_request_duration_seconds{quantile="0.95"})</code> is exact
      why: The highest replica's percentile is not the service's percentile either.
    - text: <code>histogram_quantile(0.95, ...)</code> works on summaries too
      why: <code>histogram_quantile()</code> needs buckets or native histograms. A summary has neither.
  answer: [0]
  source: https://prometheus.io/docs/practices/histograms/

- id: q-mock-pca-065
  tags: [promql-histograms]
  exam: {cert: pca, domain: P3, competency: Histograms}
  q: A classic histogram has the buckets 0.1, 0.25, 0.5 and +Inf. The real 99th percentile is about 3 seconds. What does <code>histogram_quantile(0.99, ...)</code> return?
  options:
    - text: '0.5'
      why: When a quantile falls in the highest bucket, the upper bound of the second-highest bucket is returned.
    - text: '3'
      why: The histogram has no bucket boundary near 3 seconds, so it cannot estimate that value.
    - text: +Inf
      why: An infinite result is returned only for a quantile above 1. Here 0.5 comes back.
    - text: NaN
      why: NaN would come back with no observations or no +Inf bucket. Neither is the case here.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/querying/functions/#histogram_quantile

- id: q-mock-pca-066
  tags: [promql-histograms]
  exam: {cert: pca, domain: P3, competency: Histograms}
  q: <code>http_request_duration_seconds</code> is a classic histogram. Which query gives the average request duration over the last 5 minutes?
  options:
    - text: <code>rate(http_request_duration_seconds_sum[5m]) / rate(http_request_duration_seconds_count[5m])</code>
      why: Divide the rate of the sum by the rate of the count. That gives the average duration per request.
    - text: <code>sum(rate(http_request_duration_seconds_sum[5m])) / count(http_request_duration_seconds_count)</code>
      why: <code>count()</code> counts series, not requests. The divisor must be the rate of the <code>_count</code> series.
    - text: <code>http_request_duration_seconds_sum / http_request_duration_seconds_count</code>
      why: This is the average since the process started, not over the last 5 minutes.
    - text: <code>histogram_quantile(0.5, rate(http_request_duration_seconds_bucket[5m]))</code>
      why: This estimates the median. The median and the average are different numbers.
  answer: [0]
  source: https://prometheus.io/docs/practices/histograms/

# P3 PromQL: Timestamp Metrics
- id: q-mock-pca-067
  tags: [promql-time, instrumentation]
  exam: {cert: pca, domain: P3, competency: Timestamp Metrics}
  q: A nightly export exposes <code>export_last_success_timestamp_seconds</code>, a Unix time. Which expression gives the number of seconds since the last success?
  options:
    - text: <code>time() - export_last_success_timestamp_seconds</code>
      why: The guidelines say to export the time of the event and compute the time since it with time().
    - text: <code>timestamp(export_last_success_timestamp_seconds)</code>
      why: This returns when the sample was scraped, not how long ago the export succeeded.
    - text: <code>rate(export_last_success_timestamp_seconds[1d])</code>
      why: This is a gauge holding a time. A rate of it does not give an age.
    - text: <code>export_last_success_timestamp_seconds offset 1d</code>
      why: This returns the value from a day ago. It still is a time, not a duration.
  answer: [0]
  source: https://prometheus.io/docs/practices/instrumentation/#timestamps-not-time-since

- id: q-mock-pca-068
  tags: [promql-time]
  exam: {cert: pca, domain: P3, competency: Timestamp Metrics}
  q: You suspect that some targets are scraped late. Which expression shows, per series, how many seconds old its newest sample of <code>up</code> is?
  options:
    - text: <code>time() - timestamp(up)</code>
      why: <code>timestamp()</code> returns the time of each sample, and time() the evaluation time. The difference is the sample's age.
    - text: <code>time() - up</code>
      why: <code>up</code> is 0 or 1. Subtracting it from the time gives nothing useful.
    - text: <code>scrape_duration_seconds</code>
      why: This is how long the scrape took, not how long ago it happened.
    - text: <code>changes(up[5m])</code>
      why: This counts value changes. It says nothing about the age of the samples.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/querying/functions/#timestamp

- id: q-mock-pca-069
  tags: [promql-time]
  exam: {cert: pca, domain: P3, competency: Timestamp Metrics}
  q: Which query returns the total of GET requests as it was 5 minutes ago?
  options:
    - text: <code>sum(http_requests_total{method="GET"} offset 5m)</code>
      why: <code>offset</code> must follow the selector directly. The sum is then taken over the old values.
    - text: <code>sum(http_requests_total{method="GET"}) offset 5m</code>
      why: The docs show this form as invalid. offset cannot follow an aggregation.
    - text: <code>sum(http_requests_total{method="GET"}[5m])</code>
      why: <code>sum()</code> does not take a range vector, so this fails.
    - text: <code>sum(http_requests_total{method="GET"} @ 5m)</code>
      why: The @ modifier takes a Unix timestamp. Here 5m would be read as 300 seconds after 1970, not as 5 minutes ago.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/querying/basics/#offset-modifier

- id: q-mock-pca-070
  tags: [promql-time]
  exam: {cert: pca, domain: P3, competency: Timestamp Metrics}
  q: In a range query over the last 6 hours, what does <code>time()</code> return at each step?
  options:
    - text: The time of that step, in seconds since 1970
      why: <code>time()</code> returns the time at which the expression is evaluated, which is each step's own time in a range query.
    - text: The current wall-clock time, the same for every step
      why: The docs say that time() does not return the current time but the evaluation time.
    - text: The time of the newest sample, in milliseconds
      why: That would be timestamp() of a sample. time() needs no series and returns seconds.
    - text: The start time of the whole range query
      why: Each step gets its own time. A fixed start is what <code>@ start()</code> gives a selector.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/querying/functions/#time

# P4 Instrumentation and Exporters: Client Libraries
- id: q-mock-pca-071
  tags: [exporter-client-libraries, instrumentation]
  exam: {cert: pca, domain: P4, competency: Client Libraries}
  q: A counter <code>payment_errors_total</code> has a label <code>reason</code>. No series appears until the first error, so a dashboard shows "No data" instead of 0. What do the guidelines suggest?
  options:
    - text: Create a 0 series for each known reason at start-up
      why: Series that appear only when something happens are hard to work with. Export a default of 0 for series you know may exist.
    - text: Change the counter into a gauge that is set to 0 every scrape
      why: Resetting a gauge loses the running count and breaks rate(). The problem is the missing series, not the type.
    - text: Remove the label so that the client library exports a 0
      why: Most libraries export 0 on their own for metrics without labels, but losing the reason is a high price when you can create the labelled series yourself.
    - text: Set a shorter scrape interval so the first error is seen sooner
      why: The series still does not exist before the first error, however often you scrape.
  answer: [0]
  source: https://prometheus.io/docs/practices/instrumentation/#avoid-missing-metrics

- id: q-mock-pca-072
  tags: [exporter-client-libraries, exporter-writing]
  exam: {cert: pca, domain: P4, competency: Client Libraries}
  q: You write a custom collector with a client library. It reads a table from another system on every scrape. How should it produce its metrics?
  options:
    - text: Create new metrics on each scrape, in the collect step
      why: Creating fresh metrics in the collect step, as the Go library does with <code>MustNewConstMetric</code>, avoids races between two scrapes and stops label values that disappeared from being exported.
    - text: Update normal global counters and gauges on each scrape
      why: Direct instrumentation uses shared variables. Two scrapes at once race, and old label values stay exported.
    - text: Push the values to a Pushgateway after each read
      why: The collector is already being scraped. Pushing adds a second path and the Pushgateway's problems.
    - text: Cache the first read and serve it on every later scrape
      why: The metrics would never change after start-up, so they would describe the past.
  answer: [0]
  source: https://prometheus.io/docs/instrumenting/writing_exporters/#collectors

- id: q-mock-pca-073
  tags: [exporter-client-libraries, instrumentation]
  exam: {cert: pca, domain: P4, competency: Client Libraries}
  q: A hot code path runs 500,000 times a second, and each call increments a counter with labels. Profiling shows the label lookup costs time. What do the guidelines suggest?
  options:
    - text: Do the label lookup once and reuse its result
      why: For very hot loops, limit the metrics you update and cache the result of the label lookup, for example the return value of With() in Go.
    - text: Replace the counter with a log line on each call
      why: A log line on every call adds work and gives no count you can graph.
    - text: Remove all metrics from the code path
      why: The cost of instrumentation is usually far smaller than its benefit. Caching the lookup keeps the metric.
    - text: Switch from a counter to a summary to save time
      why: A summary is more expensive per observation, because it calculates quantiles.
  answer: [0]
  source: https://prometheus.io/docs/practices/instrumentation/#inner-loops

- id: q-mock-pca-074
  tags: [exporter-client-libraries, promql-histograms]
  exam: {cert: pca, domain: P4, competency: Client Libraries}
  q: A team's client library offers a summary that exposes only <code>_sum</code> and <code>_count</code>, with no quantiles. Is that a problem?
  options:
    - text: No; a summary without quantiles is valid and gives an average
      why: Some libraries omit the quantile calculation, which is a legitimate use. The rate of _sum divided by the rate of _count gives the average.
    - text: Yes; Prometheus rejects a summary that has no quantiles
      why: Prometheus accepts it. Quantile lines are optional for a summary.
    - text: Yes; without quantiles the summary cannot be used in PromQL at all
      why: Both series are normal counters that rate() can use.
    - text: No; Prometheus computes the missing quantiles from the sum
      why: Quantiles cannot be computed from a sum and a count alone.
  answer: [0]
  source: https://prometheus.io/docs/practices/histograms/

# P4 Instrumentation and Exporters: Instrumentation
- id: q-mock-pca-075
  tags: [instrumentation, golden-signals]
  exam: {cert: pca, domain: P4, competency: Instrumentation}
  q: You instrument an online-serving HTTP API. According to the guidelines, which metrics matter most for it?
  options:
    - text: Requests performed, errors and latency
      why: For online-serving systems the key metrics are the number of queries, errors and latency. Requests in progress can help too.
    - text: Last success time and run duration
      why: These are the key metrics of a batch job, not of a service that answers requests.
    - text: Items in, items out and items in progress
      why: This is the pattern for offline processing stages.
    - text: CPU, memory and disk usage only
      why: Machine metrics come from the node exporter. They do not show what users of the API see.
  answer: [0]
  source: https://prometheus.io/docs/practices/instrumentation/#online-serving-systems

- id: q-mock-pca-076
  tags: [instrumentation, push-pull]
  exam: {cert: pca, domain: P4, competency: Instrumentation}
  q: A batch job runs once a night for 10 minutes and deletes old user accounts for the whole service. What should it report, and how?
  options:
    - text: Its last success time as a gauge, pushed to a Pushgateway
      why: The key metric of a batch job is the last time it succeeded. Such gauges should be pushed to a Pushgateway.
    - text: Its request latency as a histogram, scraped every 15 seconds
      why: The job is not online most of the day, so scraping it misses most runs. Latency is not its key metric.
    - text: Its last success time as a counter, scraped by Prometheus
      why: A time is not a growing count, so a gauge fits. A short job is also hard to scrape.
    - text: Its run as a log line only, since batch jobs have no metrics
      why: Batch jobs have metrics, above all when they last succeeded.
  answer: [0]
  source: https://prometheus.io/docs/practices/instrumentation/#batch-jobs

- id: q-mock-pca-077
  tags: [instrumentation]
  exam: {cert: pca, domain: P4, competency: Instrumentation}
  q: You count requests in an online service. When do the guidelines suggest you count each request?
  options:
    - text: When it ends, so it lines up with errors and latency
      why: Be consistent, and count at the end. It lines up with errors and latency and is often easier to code.
    - text: When it starts, so slow requests are counted sooner
      why: Counting at the start is allowed if you are consistent, but the guidelines suggest the end.
    - text: Both when it starts and when it ends, in one counter
      why: Counting each request twice in one counter doubles it.
    - text: Only when it fails, since successes are not interesting
      why: Without a count of all requests you cannot compute a failure ratio.
  answer: [0]
  source: https://prometheus.io/docs/practices/instrumentation/#online-serving-systems

- id: q-mock-pca-078
  tags: [instrumentation, prom-metric-naming]
  exam: {cert: pca, domain: P4, competency: Instrumentation}
  q: A service makes calls to a payment provider, and some calls fail. Which instrumentation makes the failure ratio easiest to compute?
  options:
    - text: A counter of all calls and a second counter of failed calls
      why: With a counter for failures, also keep the total attempts. Then the failure ratio is one division.
    - text: One counter of calls with a label <code>result</code> set to success or failed
      why: The exporter guidelines say not to use one metric with a failed or success label. Two metrics make the ratio easy.
    - text: A gauge that holds the failure ratio of the last minute
      why: A ratio computed in the app cannot be aggregated or re-windowed later. Expose the counts.
    - text: A counter of failed calls only
      why: Without the total number of attempts there is nothing to divide by.
  answer: [0]
  source: https://prometheus.io/docs/practices/instrumentation/#failures

# P4 Instrumentation and Exporters: Exporters
- id: q-mock-pca-079
  tags: [exporter-writing]
  exam: {cert: pca, domain: P4, competency: Exporters}
  q: You run 5 HAProxy servers and want their metrics. How do the guidelines say the exporters should be deployed?
  options:
    - text: One <code>haproxy_exporter</code> beside each HAProxy, 5 in all
      why: Each exporter should monitor exactly one instance, ideally on the same machine. Discovery then stays in Prometheus.
    - text: One <code>haproxy_exporter</code> that discovers all 5 servers itself
      why: The guidelines keep service discovery in Prometheus, not in exporters.
    - text: One <code>haproxy_exporter</code> behind a load balancer
      why: Each scrape would hit a random HAProxy, so the series would mix servers.
    - text: No exporter, but a Pushgateway fed by a cron job
      why: HAProxy runs all the time, so it should be scraped, not pushed.
  answer: [0]
  source: https://prometheus.io/docs/instrumenting/writing_exporters/#deployment

- id: q-mock-pca-080
  tags: [exporter-standard, prom-relabeling]
  exam: {cert: pca, domain: P4, competency: Exporters}
  q: A blackbox exporter probes many URLs. The relabeling copies each URL from <code>__address__</code> to <code>__param_target</code>, then sets <code>__address__</code> to the exporter's address. Why?
  options:
    - text: So that the exporter is scraped and gets each URL as a parameter
      why: <code>__param_target</code> becomes the URL parameter target, and <code>__address__</code> decides which host is scraped.
    - text: So that each URL is scraped directly, with the exporter as a backup
      why: The URLs are not scraped directly. The exporter probes them and reports the result.
    - text: So that the <code>instance</code> label shows the exporter instead of the URL
      why: The usual pattern also sets instance to the URL, so the probed address stays visible.
    - text: So that the exporter can find its targets through DNS on its own
      why: Prometheus still does the discovery and hands each target to the exporter.
  answer: [0]
  source: https://prometheus.io/docs/guides/multi-target-exporter/

- id: q-mock-pca-081
  tags: [exporter-writing]
  exam: {cert: pca, domain: P4, competency: Exporters}
  q: An exporter reads a value from another system that is called a counter there, but it can go down. Which Prometheus type should the exporter use?
  options:
    - text: Untyped
      why: A value that can decrease is not a Prometheus counter. The guidelines suggest UNTYPED, since GAUGE could mislead when it is used as a counter.
    - text: Counter
      why: Prometheus counters only go up or reset. rate() would read every drop as a reset.
    - text: Histogram
      why: A histogram counts observations in buckets. A single value is not a distribution.
    - text: Summary
      why: A summary describes observed events, not a single value read from another system.
  answer: [0]
  source: https://prometheus.io/docs/instrumenting/writing_exporters/#types

- id: q-mock-pca-082
  tags: [exporter-writing]
  exam: {cert: pca, domain: P4, competency: Exporters}
  q: You write an exporter and want to report how long reading the other system took on each scrape. What do the guidelines suggest?
  options:
    - text: A gauge such as <code>jmx_scrape_duration_seconds</code>
      why: Metrics about the scrape itself are gauges, prefixed with the exporter name.
    - text: A histogram of scrape durations across all scrapes
      why: The guidelines name a histogram of scrape duration as a meta metric to avoid.
    - text: A counter of the number of scrapes so far
      why: A scrape counter duplicates what Prometheus already generates and adds storage cost.
    - text: Nothing, because <code>scrape_duration_seconds</code> already covers it
      why: That metric times the whole scrape from Prometheus. The exporter's own read time is still useful as a gauge.
  answer: [0]
  source: https://prometheus.io/docs/instrumenting/writing_exporters/#metrics-about-the-scrape-itself

