# P5 Alerting & Dashboarding: Configuring Alerting rules
- id: q-mock-pca-094
  tags: [alert-rules]
  exam: {cert: pca, domain: P5, competency: Configuring Alerting rules}
  q: 'An alerting rule has <code>for: 10m</code>. Its expression returns a result for 7 minutes, then returns nothing. What happened to the alert?'
  options:
    - text: It was pending for 7 minutes and never fired
      why: With a for clause, an alert stays pending until the condition has held for the whole duration.
    - text: It fired at once and resolved after 7 minutes
      why: Only a rule without a for clause becomes active on its first evaluation.
    - text: It fired after 7 minutes, rounded up to 10
      why: The condition must hold for the full 10 minutes. It is not rounded.
    - text: It stays firing for 10 minutes after the condition ends
      why: That describes <code>keep_firing_for</code>, a separate clause.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/

- id: q-mock-pca-095
  tags: [alert-rules]
  exam: {cert: pca, domain: P5, competency: Configuring Alerting rules}
  q: An alert keeps resolving and firing again because its metric has short gaps in the data. Which clause of a Prometheus alerting rule is meant for this?
  options:
    - text: <code>keep_firing_for</code>
      why: It keeps the alert firing for a set time after the condition was last met, which prevents flapping and false resolutions.
    - text: <code>for</code>
      why: <code>for</code> delays the start of firing. It does not keep an alert firing once the condition is gone.
    - text: <code>query_offset</code>
      why: <code>query_offset</code> is a rule group setting that moves evaluation into the past. It does not keep an alert firing.
    - text: <code>annotations</code>
      why: Annotations hold descriptions and links. They do not change when an alert fires or resolves.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/

- id: q-mock-pca-096
  tags: [alert-rules]
  exam: {cert: pca, domain: P5, competency: Configuring Alerting rules}
  q: 'Which annotation shows the affected instance and the current value in the alert text?'
  options:
    - text: '<code>summary: "{{ $labels.instance }} is at {{ $value }}"</code>'
      why: $labels holds the alert's labels and $value the evaluated value of the expression.
    - text: '<code>summary: "$instance is at $value"</code>'
      why: Annotations use Go templates. Without the braces the text is printed as it is.
    - text: '<code>summary: "{{ instance }} is at {{ value }}"</code>'
      why: The fields live in the $labels and $value variables. Bare names are not defined.
    - text: '<code>summary: "{{ $externalLabels.instance }} is at {{ $value }}"</code>'
      why: $externalLabels holds the server's external labels, not the labels of the alert.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/#templating

- id: q-mock-pca-097
  tags: [alert-rules]
  exam: {cert: pca, domain: P5, competency: Configuring Alerting rules}
  q: You want a Grafana panel that shows which Prometheus alerts are firing right now. Which series can it query?
  options:
    - text: <code>ALERTS{alertstate="firing"}</code>
      why: For pending and firing alerts, Prometheus stores synthetic series named ALERTS, with an alertstate label.
    - text: <code>ALERTS{alertstate="pending"}</code>
      why: Pending alerts are active but have not fired yet, because their for duration has not passed.
    - text: <code>up{alertname!=""}</code>
      why: <code>up</code> describes scrape health and has no alertname label.
    - text: <code>count(ALERTS)</code>
      why: This counts pending and firing alerts together, and it drops which alerts they are.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/#inspecting-alerts-during-runtime

- id: q-mock-pca-098
  tags: [alert-rules, prom-architecture]
  exam: {cert: pca, domain: P5, competency: Configuring Alerting rules}
  q: Before you load a new rule file into Prometheus, you want to be sure it is valid. What can you run?
  options:
    - text: <code>promtool check rules</code> on the file
      why: <code>promtool</code> checks a rule file without a running server. It exits with 0 when the file is valid and 1 on errors.
    - text: <code>amtool check-config</code> on the file
      why: <code>amtool</code> checks Alertmanager configuration, not Prometheus rule files.
    - text: A POST to <code>/-/reload</code> with the file in the body
      why: The reload endpoint rereads the files already configured. It does not check a file you send.
    - text: Nothing; Prometheus loads only the valid rules of a broken file
      why: A reload applies changes only if all rule files are well formatted. A broken file blocks the whole change.
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/configuration/recording_rules/#syntax-checking-rules

- id: q-mock-pca-099
  tags: [alert-grafana-managed]
