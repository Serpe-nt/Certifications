  source: https://grafana.com/docs/grafana/latest/alerting/fundamentals/alert-rule-evaluation/

# P5 Alerting & Dashboarding: Understand and Use Alertmanager
- id: q-mock-pca-100
  tags: [alert-alertmanager]
  exam: {cert: pca, domain: P5, competency: Understand and Use Alertmanager}
  q: A route uses the defaults for <code>group_wait</code>, <code>group_interval</code> and <code>repeat_interval</code>. A group has just sent its first notification. A new alert joins the group 1 minute later. When is it sent?
  options:
    - text: At the next group_interval, about 4 minutes later
      why: After the first notification, new alerts in a group wait for the next group_interval, which is 5 minutes by default.
    - text: At once, because each new alert is sent on its own
      why: Grouping exists so that new alerts join the group's next notification instead.
    - text: After the group_wait of 30 seconds
      why: <code>group_wait</code> applies only before the first notification of a new group.
    - text: After the repeat_interval of 4 hours
      why: <code>repeat_interval</code> is for repeating an unchanged notification. A new alert is a change.
  answer: [0]
  source: https://prometheus.io/docs/alerting/latest/configuration/#route

- id: q-mock-pca-101
  tags: [alert-alertmanager]
  exam: {cert: pca, domain: P5, competency: Understand and Use Alertmanager}
  q: When the alert <code>ClusterUnreachable</code> fires for a cluster, you want no notifications for other alerts from that same cluster. What do you configure?
  options:
    - text: An inhibit rule, with <code>equal</code> on the cluster label
      why: An inhibit rule with ClusterUnreachable as its source mutes target alerts while the source fires, and equal requires the same cluster value on both.
    - text: A silence that matches all alerts of every cluster
      why: A silence mutes for a fixed time whether or not ClusterUnreachable fires, and here it would hit all clusters.
    - text: A route with <code>group_by</code> set to the cluster label
      why: Grouping puts the alerts into one notification. It does not mute them.
    - text: A route with <code>continue</code> set to false
      why: <code>continue</code> only stops matching at the first route that fits. It mutes nothing.
  answer: [0]
  source: https://prometheus.io/docs/alerting/latest/configuration/#inhibit_rule

- id: q-mock-pca-102
  tags: [alert-alertmanager]
  exam: {cert: pca, domain: P5, competency: Understand and Use Alertmanager}
  q: An alert with <code>team="db"</code> and <code>severity="critical"</code> should reach both the database team and the on-call pager. Two sibling routes match it, but only the first receiver gets it. Why?
  options:
    - text: The first matching route does not set <code>continue</code>
      why: <code>continue</code> defaults to false, so the alert stops at the first matching child. Set it to true to try the siblings too.
    - text: An alert can only ever be sent to one receiver
      why: With continue set to true, one alert can match several routes and receivers.
    - text: The second route needs a longer <code>group_wait</code>
      why: Timing settings do not decide whether a route matches.
    - text: The root route has matchers that block the second route
      why: The root route must match all alerts, so it has no matchers.
  answer: [0]
  source: https://prometheus.io/docs/alerting/latest/configuration/#route

- id: q-mock-pca-103
  tags: [alert-alertmanager]
  exam: {cert: pca, domain: P5, competency: Understand and Use Alertmanager}
  q: You will upgrade a database tonight from 22:00 to 23:00 and expect alerts from it. What is the Alertmanager feature for muting them during that time?
  options:
    - text: A silence with matchers for that database
      why: A silence mutes alerts that match its matchers for a given time. It is set in the Alertmanager web interface.
    - text: An inhibit rule for that database
      why: Inhibition mutes alerts while another alert fires. It is not tied to a time window you choose.
    - text: A route with a long <code>repeat_interval</code>
      why: The first notification would still be sent.
    - text: Deleting the alerting rule until the work is done
      why: That changes the Prometheus rules and is easy to forget to undo. A silence expires on its own.
  answer: [0]
  source: https://prometheus.io/docs/alerting/latest/alertmanager/#silences

