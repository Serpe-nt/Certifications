  tags: [exporter-writing]
  exam: {cert: pca, domain: P4, competency: Exporters}
  q: A Java framework exposes 1-, 5- and 15-minute request rates and a mean since start. What should an exporter do with these values?
  options:
    - text: Expose the underlying counter and drop these values
      why: Prometheus calculates rates itself, usually more accurately than these decaying averages, so the guidelines say to drop them.
    - text: Expose each one as a separate gauge
      why: The guidelines call these statistics clutter. Prometheus can compute any window from a counter.
    - text: Expose them as a summary with three quantiles
      why: Moving averages are not quantiles. Labelling them as quantiles would mislead.
    - text: Expose only the 15-minute value as a counter
      why: A moving average goes up and down, so it is not a counter.
