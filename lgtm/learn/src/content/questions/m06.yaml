- id: q-m06-028
  tags: [k8s-use-red]
  exam: {cert: none}
  q: "In the USE method, which of these is a saturation measure of a node's CPU?"
  options:
    - text: "The share of time the CPUs were not idle"
      why: "That is utilization: how busy the resource is."
    - text: "The number of CPUs the node has"
      why: "That is capacity, not saturation."
    - text: "The number of failed requests on the node"
      why: "Requests and their failures belong to RED."
    - text: "The load average per CPU"
      why: "Saturation is work that waits, such as a queue length or the load."
  answer: [3]
  source: https://grafana.com/docs/grafana/latest/dashboards/build-dashboards/best-practices/

- id: q-m06-029
  tags: [k8s-use-red, k8s-kubelet-cadvisor]
  exam: {cert: none}
  q: "An application exposes no metrics of its own. What can cAdvisor give you for its RED view?"
  options:
    - text: "Nothing for RED; only resource usage"
      why: "cAdvisor sees CPU, memory, disk and network per container, not requests."
    - text: "Rate and duration, but no errors"
      why: "cAdvisor never sees requests, so it has neither."
    - text: "Errors only, from the restart count"
      why: "Restarts are not request errors, and cAdvisor does not count them."
    - text: "All three, from network bytes per container"
      why: "Bytes are not requests; they say nothing of failures or latency."
  answer: [0]
  source: https://github.com/google/cadvisor/blob/master/docs/storage/prometheus.md

- id: q-m06-030
  tags: [k8s-control-plane]
  exam: {cert: none}
  q: "On a kubeadm cluster with kube-prometheus-stack, <code>up{job=\"kube-scheduler\"}</code> returns no series at all, and no scheduler alert exists. What is the most likely cause?"
  options:
    - text: "The scheduler binds to 127.0.0.1, so its target is down"
      why: "A down target still has up at 0; here the job does not exist."
    - text: "kubeScheduler.enabled is false in the chart's values"
      why: "With the switch off, the chart creates neither the ServiceMonitor nor the scheduler's alert rules."
    - text: "The scheduler has crashed on all three masters"
      why: "Without a ServiceMonitor there is no job, healthy scheduler or not."
    - text: "Prometheus may not read the scheduler's metrics"
      why: "A permission error leaves a target that is down, not a missing job."
  answer: [1]
