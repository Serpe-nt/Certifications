- id: q-m06-001
  tags: [k8s-what-to-watch]
  exam: {cert: none}
  q: "A worker node is evicting pods for DiskPressure. You want to see which file system filled up, and since when. Which component reports that?"
  options:
    - text: "node exporter, from the host's mounts"
      why: "Its filesystem collector reports size and free space per mount point of the whole machine."
    - text: "kube-state-metrics, from the node object"
      why: "It reports the node's DiskPressure condition from the API, not how full each file system is."
    - text: "metrics-server, from the Metrics API"
      why: "The Metrics API holds current CPU and memory only, for autoscaling."
    - text: "cAdvisor, from the container cgroups"
      why: "cAdvisor reports what containers use, not the node's own mount points."
  answer: [0]
  source: https://github.com/prometheus/node_exporter/blob/v1.12.1/README.md

- id: q-m06-002
  tags: [k8s-what-to-watch]
  exam: {cert: none}
  q: "A team asks how many replicas their StatefulSet wants and how many are ready. Which component reports both numbers as metrics?"
  options:
    - text: "The kubelet on each node"
      why: "The kubelet reports the pods on its own node and knows nothing about a StatefulSet's spec."
    - text: "kube-state-metrics"
      why: "It turns the spec and status of objects such as StatefulSets into metrics."
    - text: "node exporter on each node"
      why: "Node exporter reports the machine, not Kubernetes objects."
    - text: "The scheduler's metrics"
      why: "The scheduler reports on scheduling, not on the replicas a StatefulSet wants."
  answer: [1]
  source: https://github.com/kubernetes/kube-state-metrics/blob/v2.20.0/README.md

- id: q-m06-003
  tags: [k8s-what-to-watch]
  exam: {cert: none}
  q: "At 09:00 you run <code>kubectl get events</code> to see why a rollout failed at 02:00. Nothing that old is listed. Why?"
  options:
    - text: "Events are only kept while their pod still exists"
      why: "Events expire by age, set on the API server, not with their pod."
    - text: "kubectl get events shows only Warning events"
      why: "It shows Normal and Warning events alike."
    - text: "The API server keeps events one hour by default"
      why: "The kube-apiserver flag --event-ttl defaults to one hour, so older events are gone."
    - text: "Events are written to the node's log files instead"
      why: "Events are API objects; they are not written to the pods' log files."
  answer: [2]
  source: https://v1-35.docs.kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/

- id: q-m06-004
  tags: [k8s-what-to-watch]
  exam: {cert: none}
  q: "A pod has written 40 MiB of logs, and the kubelet rotates its log after 10 MiB. What does <code>kubectl logs</code> return?"
  options:
    - text: "All 40 MiB, read from every rotated file"
      why: "kubectl logs reads only the newest file, not the rotated ones."
    - text: "Nothing until the next rotation finishes"
      why: "The newest file can be read at any time."
    - text: "The first 10 MiB the container ever wrote"
      why: "The oldest lines are in rotated files, which kubectl logs does not read."
    - text: "At most 10 MiB, from the newest log file"
      why: "Only the latest log file is available through kubectl logs."
  answer: [3]
  source: https://v1-35.docs.kubernetes.io/docs/concepts/cluster-administration/logging/

- id: q-m06-005
  tags: [k8s-kubelet-cadvisor]
  exam: {cert: pca, domain: P2, competency: "Configuration and Scraping"}
  q: "kube-prometheus-stack runs with its default values. From which kubelet path does Prometheus get per-container CPU and memory usage?"
  options:
    - text: "/metrics/cadvisor"
      why: "The chart scrapes this path for container usage by default."
    - text: "/metrics/resource"
      why: "The chart leaves this path off by default, because cAdvisor already has the container numbers."
    - text: "/metrics/probes"
      why: "This path holds probe results, not usage."
    - text: "/stats/summary"
      why: "This is the kubelet's Summary API in JSON, not a path the chart scrapes."
  answer: [0]
  source: https://github.com/prometheus-community/helm-charts/blob/kube-prometheus-stack-93.1.1/charts/kube-prometheus-stack/values.yaml

- id: q-m06-006
  tags: [k8s-kubelet-cadvisor]
  exam: {cert: pca, domain: P2, competency: "Configuration and Scraping"}
  q: "A team installs kube-prometheus on a cluster whose kubelets accept client certificates only. What does the kube-prometheus README say the kubelets need, so that Prometheus can scrape them with a token?"
  options:
    - text: "A Service in front of the kubelets, made by hand"
      why: "The operator creates that Service; it does not change how the kubelet checks callers."
    - text: "Webhook token authentication and authorization"
      why: "With both, the kubelet accepts service account tokens and asks the API server whether the caller may read /metrics."
    - text: "Plain HTTP on port 10255 instead of HTTPS"
      why: "The README asks for token checks on the secure port, not for an open port."
    - text: "A ClusterRole that allows list on all nodes"
      why: "Reading the kubelet's metrics is a get on the non-resource URL /metrics."
  answer: [1]
  source: https://github.com/prometheus-operator/kube-prometheus

- id: q-m06-007
  tags: [k8s-kubelet-cadvisor]
  exam: {cert: none}
  q: "<code>container_memory_working_set_bytes{pod=\"api-7c9\"}</code> returns three series: one with <code>container=\"api\"</code>, one with an empty container label, and one with the pause image. What are the last two?"
  options:
    - text: "Two older containers of the pod that have exited"
      why: "Exited containers' series go stale; these two belong to the running pod."
    - text: "Copies of one series from two kubelet endpoints"
      why: "All three come from the cAdvisor endpoint; the difference is the container label."
    - text: "The total of the whole pod, and its sandbox"
      why: "cAdvisor reports the pod's cgroup as a whole and the pause container beside each real container."
    - text: "Init containers that ran before the pod started"
      why: "Init containers have names of their own; they do not show an empty container label."
  answer: [2]
  source: https://github.com/google/cadvisor/blob/master/docs/storage/prometheus.md

- id: q-m06-008
  tags: [k8s-kubelet-cadvisor, k8s-kube-state-metrics]
  exam: {cert: none}
  q: "A team wants a graph of how close each container is to its CPU limit. cAdvisor gives the usage. Which metric gives the limit as written in the pod spec?"
  options:
    - text: "container_cpu_usage_seconds_total"
      why: "That counter is the usage itself, not the limit."
    - text: "node_cpu_seconds_total"
      why: "Node exporter reports the machine's CPUs, not a container's limit."
    - text: "kube_node_status_allocatable{resource=\"cpu\"}"
      why: "That is the CPU the node offers to pods, not one container's limit."
    - text: "kube_pod_container_resource_limits"
      why: "kube-state-metrics reports the limits from the pod spec, with resource and unit labels."
  answer: [3]
  source: https://github.com/kubernetes/kube-state-metrics/blob/v2.20.0/docs/metrics/workload/pod-metrics.md

- id: q-m06-009
  tags: [k8s-kube-state-metrics, exporter-standard]
  exam: {cert: pca, domain: P4, competency: "Exporters"}
  q: "A pod has been Pending for twenty minutes because no node has room. cAdvisor has no series for it. Which kube-state-metrics series shows the problem?"
  options:
    - text: "kube_pod_status_phase with phase=\"Pending\" at 1"
      why: "kube-state-metrics reports the phase from the API, whether or not a container ever started."
    - text: "kube_pod_container_status_restarts_total rising"
      why: "A pod that never started has nothing to restart."
    - text: "kube_pod_container_status_last_terminated_reason"
      why: "Nothing has terminated; the containers never ran."
    - text: "kube_node_status_condition, condition=\"Ready\""
      why: "The nodes are Ready; they only lack room for this pod."
  answer: [0]
  source: https://github.com/kubernetes/kube-state-metrics/blob/v2.20.0/docs/metrics/workload/pod-metrics.md

- id: q-m06-010
  tags: [k8s-kube-state-metrics, exporter-standard]
  exam: {cert: pca, domain: P4, competency: "Exporters"}
  q: "You want each pod's Kubernetes label <code>team</code> in PromQL, but <code>kube_pod_labels</code> returns nothing. What is missing?"
  options:
    - text: "A relabeling rule in the kube-state-metrics ServiceMonitor"
      why: "Relabeling cannot add labels that kube-state-metrics never exposed."
    - text: "The key team in --metric-labels-allowlist for pods"
      why: "Labels metrics are off by default; the allowlist names the keys to expose."
    - text: "A newer kube-state-metrics that supports pod labels"
      why: "The feature exists; it stays off until you list the keys."
    - text: "A PodMonitor that scrapes the pods' own labels"
      why: "Pod labels come from the API, which kube-state-metrics reads, not from the pods."
  answer: [1]
  source: https://github.com/kubernetes/kube-state-metrics/blob/v2.20.0/docs/developer/cli-arguments.md

- id: q-m06-011
  tags: [k8s-kube-state-metrics, exporter-standard]
  exam: {cert: pca, domain: P4, competency: "Exporters"}
  q: "On <code>kube_deployment_spec_replicas{deployment=\"cart\"}</code> the <code>pod</code> label names the kube-state-metrics pod, while on <code>kube_pod_info</code> it names the cart pod. Why?"
  options:
    - text: "kube-state-metrics puts its own pod name on every series"
      why: "On pod metrics it writes the object's pod name, and that value is kept."
    - text: "The Deployment series is left over from a deleted pod"
      why: "Series of deleted objects leave the page; this one is current."
    - text: "It has no pod label, so the target's pod label is added"
      why: "Prometheus attaches target labels where a scraped series has none; honor_labels only matters on a conflict."
    - text: "Prometheus renamed the object's pod label to exported_pod"
      why: "With honor_labels true nothing is renamed, and kube_pod_info keeps the cart pod."
  answer: [2]
  source: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

- id: q-m06-012
  tags: [k8s-node-exporter, exporter-standard]
  exam: {cert: pca, domain: P4, competency: "Exporters"}
  q: "Which node exporter metric tells you how long tasks on a node waited for a CPU, rather than how busy the CPUs were?"
  options:
    - text: "node_cpu_seconds_total with mode=\"idle\""
      why: "Idle time measures how busy the CPUs were, not waiting."
    - text: "node_load1 divided by the number of CPUs"
      why: "The load average counts tasks; it is not a time spent waiting."
    - text: "node_memory_MemAvailable_bytes"
      why: "That is free memory, not CPU."
    - text: "node_pressure_cpu_waiting_seconds_total"
      why: "The pressure collector reads stall time from /proc/pressure: time tasks waited for a CPU."
  answer: [3]
  source: https://github.com/prometheus/node_exporter/blob/v1.12.1/README.md

- id: q-m06-013
  tags: [k8s-node-exporter, exporter-standard]
  exam: {cert: pca, domain: P4, competency: "Exporters"}
  q: "On a node, <code>node_memory_MemTotal_bytes</code> is 5.79 GiB and <code>kube_node_status_allocatable{resource=\"memory\"}</code> is 5.69 GiB. Why do they differ?"
  options:
    - text: "Allocatable keeps back a reserve for the system"
      why: "kube-state-metrics reports allocatable as what is left for pods after some is kept for system daemons."
    - text: "Node exporter counts swap space into the total"
      why: "MemTotal is the kernel's memory figure, not swap."
    - text: "kube-state-metrics rounds memory down to whole MiB"
      why: "The difference is about 100 MiB, far more than rounding."
    - text: "Allocatable leaves out what pods use right now"
      why: "Allocatable is a fixed amount from the node's status, not current use."
  answer: [0]
  source: https://github.com/kubernetes/kube-state-metrics/blob/main/docs/metrics/cluster/node-metrics.md

