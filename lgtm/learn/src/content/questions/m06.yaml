- id: q-m06-033
  tags: [k8s-resources]
  exam: {cert: none}
  q: "A container's CPU usage is flat at 0.2 cores, its limit is 0.2, and the ratio of throttled to total CFS periods is 0.6. Requests are slow. Which change helps?"
  options:
    - text: "Raise or remove the CPU limit"
      why: "The kernel holds the container to its limit; a higher limit lets it run longer in each period."
    - text: "Raise only the CPU request"
      why: "The request decides placement and sharing under contention, not the ceiling."
    - text: "Raise the memory limit"
      why: "Memory does not cause CPU throttling."
    - text: "Add a liveness probe to restart it"
      why: "A restart keeps the same limit, so the throttling comes back."
  answer: [0]
  source: https://v1-35.docs.kubernetes.io/docs/concepts/configuration/manage-resources-containers/

- id: q-m06-034
  tags: [k8s-resources]
  exam: {cert: none}
  q: "A pod restarts every few minutes. <code>kube_pod_container_status_last_terminated_reason</code> says OOMKilled, but its working set graph never gets near the 64Mi limit. How do both fit?"
  options:
    - text: "The working set is in KiB and the limit in MiB"
      why: "Both are in bytes."
    - text: "It dies between scrapes, so no sample shows the peak"
      why: "Usage is sampled on a schedule; a container killed seconds after it starts leaves no sample of its peak."
    - text: "kube-state-metrics reports another container's reason"
      why: "The reason belongs to this container in this pod."
    - text: "A node-wide shortage killed it, not its limit"
      why: "A node-wide shortage would hit other pods too; the reason and the restarts point at this container."
  answer: [1]
  source: https://v1-35.docs.kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/

- id: q-m06-035
  tags: [k8s-resources]
  exam: {cert: none}
  q: "<code>kubectl describe pod</code> shows Last State Terminated, Reason OOMKilled, Exit Code 137. What happened?"
  options:
    - text: "A failed liveness probe made the kubelet kill it"
      why: "A probe kill has its own event; OOMKilled names the memory limit."
    - text: "The node ran out of disk and evicted the pod"
      why: "An eviction ends the pod, and its reason says Evicted."
    - text: "It went over its memory limit and was killed"
      why: "The kernel killed it for using more memory than its limit."
    - text: "It used more CPU than its CPU limit allowed"
      why: "A CPU limit throttles; it never kills."
  answer: [2]
  source: https://v1-35.docs.kubernetes.io/docs/tasks/configure-pod-container/assign-memory-resource/

- id: q-m06-036
  tags: [k8s-probes]
  exam: {cert: none}
  q: "A container's restart count rises every half minute, and its events say <code>Liveness probe failed</code>. What is the kubelet doing?"
  options:
    - text: "Taking the pod out of its Service, then back in"
      why: "That is what a readiness probe does, and it never restarts."
    - text: "Waiting for a startup probe before the others"
      why: "A startup probe holds the others back; it does not explain restarts after the start."
    - text: "Evicting the pod because the node is short of memory"
      why: "An eviction ends the pod; it does not restart one container."
    - text: "Killing the container, which restarts by its policy"
      why: "A failing liveness probe gets the container killed and restarted."
  answer: [3]
  source: https://v1-35.docs.kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/

- id: q-m06-037
  tags: [k8s-probes]
  exam: {cert: none}
  q: "A Deployment has three replicas. <code>prober_probe_total{probe_type=\"Readiness\", result=\"failed\"}</code> rises for one of its pods only. What happens to the Service's traffic?"
  options:
    - text: "It goes to the two pods that pass their probe"
      why: "The failing pod leaves the Service's endpoints; the other two keep serving."
    - text: "It stops for all three pods until the probe passes"
      why: "Readiness is per pod; the other two stay in the endpoints."
    - text: "It reaches all three, because the pod is Running"
      why: "Running is not Ready; the failing pod gets no traffic through the Service."
    - text: "It moves to a new pod the Deployment starts"
      why: "A failing readiness probe does not make the Deployment start a replacement."
  answer: [0]
  source: https://v1-35.docs.kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/

- id: q-m06-038
  tags: [k8s-probes]
  exam: {cert: none}
  q: "A Java service needs two minutes to start. Its liveness probe kills it after 30 seconds, again and again. What does the Kubernetes documentation suggest?"
  options:
    - text: "Remove the liveness probe and rely on readiness"
      why: "Readiness never restarts a container that hangs later."
    - text: "Add a startup probe for the slow start"
      why: "The other probes wait until the startup probe succeeds, so liveness no longer kills the start."
    - text: "Lower the memory limit so it starts faster"
      why: "Less memory does not make a slow start faster."
    - text: "Raise periodSeconds of the readiness probe"
      why: "The readiness probe does not kill the container."
  answer: [1]
  source: https://v1-35.docs.kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
