- id: q-m06-031
  tags: [k8s-control-plane]
  exam: {cert: none}
  q: "etcd's own metrics are not scraped. Which API server metric still tells you how long etcd takes to answer?"
  options:
    - text: "apiserver_request_total"
      why: "This counts the API server's own requests by code, not etcd's latency."
    - text: "apiserver_request_duration_seconds"
      why: "That is the API server's own request latency, which covers more than etcd."
    - text: "etcd_request_duration_seconds"
      why: "The API server records the latency of its etcd requests per operation and object type."
    - text: "etcd_server_has_leader"
      why: "That is etcd's own metric, available only when etcd is scraped."
  answer: [2]
  source: https://v1-35.docs.kubernetes.io/docs/reference/instrumentation/metrics/

- id: q-m06-032
  tags: [k8s-control-plane]
  exam: {cert: none}
  q: "One etcd member reports <code>etcd_server_has_leader 0</code>. What does that mean for the member?"
  options:
    - text: "It is the leader and has no followers"
      why: "The metric is 1 when a leader exists, including on the leader."
    - text: "Its disk is slow and its fsyncs are late"
      why: "Disk latency shows in the etcd_disk_* histograms."
    - text: "It holds the newest copy of the data"
      why: "The metric is about leadership, not data."
    - text: "It has no leader and is unavailable"
      why: "A member without a leader is totally unavailable."
  answer: [3]
