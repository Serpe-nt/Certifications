  q: "A release was installed with <code>-f values.yaml</code>. Someone runs <code>helm upgrade rel chart --set replicaCount=3</code> with no <code>-f</code>. What values does the new revision use?"
  options:
    - text: "The values from the file plus <code>replicaCount=3</code>"
      why: "Helm does not reuse the old values when new ones are given without <code>--reuse-values</code>."
    - text: "Only <code>replicaCount=3</code>; nothing else is set"
      why: "The chart's defaults still apply to everything else."
    - text: "The chart's defaults plus <code>replicaCount=3</code>, nothing else"
      why: "With a new <code>--set</code> and no <code>-f</code>, the upgrade starts from the chart's defaults, so the file's values are lost."
    - text: "The old revision's values, because <code>--set</code> is ignored"
      why: "<code>--set</code> is applied; that is the change the person wanted."
  answer: [2]
  source: https://helm.sh/docs/helm/helm_upgrade/

- id: q-m16-027
  tags: [ascode-helm-values]
  exam: { cert: none }
  q: "Before an upgrade a reviewer runs <code>diff -u live.yaml next.yaml</code>, with <code>live.yaml</code> from <code>helm get manifest</code> and <code>next.yaml</code> from <code>helm template</code>. The diff shows <code>-  replicas: 2</code> and <code>+  replicas: 1</code>, although the pull request only changed a message. What does it mean?"
  options:
    - text: "The chart has a bug that changes replicas on every upgrade"
      why: "A chart renders what the values say. The difference comes from the values."
    - text: "Someone changed the release outside Git"
      why: "Someone scaled it with a value Git does not hold. The diff reveals drift before it is undone."
    - text: "<code>helm template</code> ignores the replica count value"
      why: "helm template renders the replica count like any other value."
    - text: "The diff compares two different charts by mistake"
      why: "Both come from the same chart; the values differ."
  answer: [1]
  source: https://helm.sh/docs/helm/helm_get_manifest/

