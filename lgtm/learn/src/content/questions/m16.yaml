  q: "Which way of reading a Kubernetes Secret lets you check its keys without revealing its values?"
  options:
    - text: "<code>kubectl get secret NAME -o yaml</code>"
      why: "That prints every value, only base64-encoded, which anyone can decode."
    - text: "<code>kubectl describe secret NAME</code>"
      why: "describe lists each key with its size in bytes and no value."
    - text: "<code>kubectl get secret NAME -o jsonpath='{.data}'</code>"
      why: "That prints the base64-encoded values too."
    - text: "<code>kubectl edit secret NAME</code>"
      why: "edit opens the whole object, values included, in an editor."
