- id: q-m16-001
  tags: [ascode-why]
  exam: { cert: none }
  q: "A team keeps its alert rules in Git but builds dashboards by hand. After a database restore, which of the three benefits of as code do the dashboards still lack?"
  options:
    - text: "All three, since each needs the dashboards kept as files"
      why: "A restore brings back the dashboards as they were, but there is no reviewed change, no way to build them elsewhere from files, and no history to go back to."
    - text: "Only review, because a restore already gives repeat and roll back"
      why: "A restore can only go back to the time of the backup. It cannot create the same dashboards in a second Grafana or return to any chosen version."
    - text: "None, because a database backup gives the same three benefits"
      why: "A backup has no author, no reason and no diff of each change. It is a copy, not a reviewed source of truth."
    - text: "Only roll back, because review is not possible for dashboards"
      why: "Dashboards are JSON and can be reviewed in a pull request like any file."
  answer: [0]
  source: https://grafana.com/docs/grafana/v13.3/as-code/git-sync/

- id: q-m16-002
  tags: [ascode-why]
  exam: { cert: none }
  q: "A contact point is managed by Terraform. During an incident someone changes its URL on the Grafana screen with <code>disable_provenance</code> set. What happens at the next <code>terraform apply</code> from main?"
  options:
    - text: "The URL from the screen is kept, because Grafana stores the newer value"
      why: "Terraform compares Grafana with the files, not with the age of the values. The file wins."
    - text: "The apply sets the URL back to the value in the files"
      why: "The hand change is drift. The plan shows it as a change, and the apply makes Grafana match main again."
    - text: "The apply fails until the screen change is reverted by hand"
      why: "Terraform does not fail on drift; it plans a change that removes it."
    - text: "Terraform copies the new URL into the <code>.tf</code> file"
      why: "Terraform never writes to your configuration files."
  answer: [1]
  source: https://grafana.com/docs/grafana/v13.3/alerting/set-up/provision-alerting-resources/terraform-provisioning/

- id: q-m16-003
  tags: [ascode-grafana-provisioning]
  exam: { cert: none }
  q: "This dashboard provider is loaded. A colleague changes a dashboard file in <code>/var/lib/grafana/dashboards</code>. What happens? The provider: <code>{name: team, type: file, updateIntervalSeconds: 30, allowUiUpdates: false, options: {path: /var/lib/grafana/dashboards}}</code>"
  options:
    - text: "Nothing happens until the Grafana pod is restarted"
      why: "Grafana keeps checking the path after start-up; a restart is not needed for dashboards."
    - text: "Grafana loads it at its next scan, within about 30 seconds"
      why: "With an interval above 10 seconds Grafana polls the path at that interval and updates the dashboard."
    - text: "Grafana asks an admin to approve the change on the screen"
      why: "Provisioning has no approval step in Grafana. Review belongs in Git, before the file changes."
    - text: "The change is ignored because <code>allowUiUpdates</code> is false"
      why: "That setting only decides whether the screen may save the dashboard. Files are still read."
  answer: [1]
  source: https://grafana.com/docs/grafana/v13.3/administration/provisioning/

- id: q-m16-004
  tags: [ascode-grafana-provisioning]
  exam: { cert: none }
  q: "A data source file has <code>prune: true</code> at its root. A pull request removes one data source from the file and is deployed. What happens to that data source?"
  options:
    - text: "It stays in Grafana but becomes editable on the screen"
      why: "That would leave an orphan behind. With prune, Grafana removes what the file no longer lists."
    - text: "It stays until someone deletes it on the screen"
      why: "That is the behaviour without <code>prune</code>. With it, Grafana deletes the data source itself."
    - text: "Grafana deletes it"
      why: "With <code>prune: true</code> Grafana deletes provisioned data sources that are removed from the file."
    - text: "Grafana refuses to start until the data source is added back"
      why: "A missing entry is not an error. Grafana simply has one data source fewer."
  answer: [2]
  source: https://grafana.com/docs/grafana/v13.3/administration/provisioning/

- id: q-m16-005
  tags: [ascode-grafana-provisioning]
  exam: { cert: none }
  q: "In a Helm values file for Grafana, a data source link is written <code>url: \"$${__value.raw}\"</code>. Why the doubled dollar sign?"
  options:
    - text: "Helm would otherwise read it as a template action"
      why: "Helm's template actions use double braces, not a dollar sign. The dollar matters to Grafana."
    - text: "YAML needs every dollar sign doubled in quoted strings"
      why: "A dollar sign has no special meaning in YAML."
    - text: "The doubled sign makes Grafana open the link in a new tab"
      why: "It changes nothing about how the link opens. It only escapes the variable."
    - text: "Grafana expands environment variables in provisioning files"
      why: "Without the doubled sign Grafana would try to replace the variable from its environment while reading the file."
  answer: [3]
  source: https://grafana.com/docs/grafana/v13.3/administration/provisioning/

- id: q-m16-006
  tags: [ascode-grafana-provisioning, ascode-secrets]
  exam: { cert: none }
  q: "A data source needs a password. Which provisioning file keeps the password out of Git?"
  options:
    - text: "<code>secureJsonData: {password: $DB_PASSWORD}</code>, set from a Secret"
      why: "Grafana reads the environment variable while it provisions, so the file only names where the value comes from."
    - text: "<code>jsonData: {password: hunter2}</code>, because jsonData is encrypted"
      why: "jsonData is stored in plain text, and the value would be in Git either way."
    - text: "<code>secureJsonData: {password: hunter2}</code>, because secureJsonData is encrypted"
      why: "Grafana encrypts it in its database, but the file in Git still holds the plain password."
    - text: "<code>editable: false</code>, which hides the password from every user on the screen"
      why: "That setting stops edits on the screen. It has nothing to do with where the password is stored."
  answer: [0]
  source: https://grafana.com/docs/grafana/v13.3/administration/provisioning/

- id: q-m16-007
  tags: [ascode-git-sync]
  exam: { cert: none }
  q: "This Repository resource is accepted by a self-hosted Grafana 13. A colleague merges a new dashboard file under <code>grafana/</code> on main. When does it appear? The spec: <code>{type: github, github: {url: https://github.com/acme/dash, branch: main, path: grafana/}, sync: {enabled: true, target: folder, intervalSeconds: 60}}</code>"
  options:
    - text: "Only after someone clicks Pull on the repository's page in Grafana"
      why: "Git Sync polls by itself on the interval; no click is needed."
    - text: "Within about a minute, in the folder named after the connection"
      why: "Grafana polls the branch every 60 seconds and puts the dashboards of the path into the connection's folder."
    - text: "At once, because Git Sync always uses webhooks"
      why: "Webhooks are optional. Without them Grafana polls on the interval."
    - text: "Never, because a file in Git must first be imported by hand"
      why: "Creating dashboards from the files under the path is exactly what the sync does."
  answer: [1]
  source: https://grafana.com/docs/grafana/v13.3/as-code/git-sync/

- id: q-m16-008
  tags: [ascode-git-sync]
  exam: { cert: none }
  q: "A Repository resource has <code>workflows: [branch]</code>. A user edits a synced dashboard and saves it. What does Grafana do?"
  options:
    - text: "Commits straight to the synced branch"
      why: "Direct commits are the <code>write</code> workflow. With only <code>branch</code>, Grafana does not commit to the synced branch."
    - text: "Refuses to save, because the folder is read only"
      why: "A connection is read only when <code>workflows</code> is empty."
    - text: "Pushes the change to a new branch for a pull request to be reviewed"
      why: "The <code>branch</code> workflow saves changes on a new branch so they go through a pull request."
    - text: "Saves to its database and syncs Git at the next interval"
      why: "Git Sync writes saves to Git; the database follows the repository, not the other way."
  answer: [2]
  source: https://grafana.com/docs/grafana/v13.3/as-code/git-sync/git-sync-setup/set-up-code/

- id: q-m16-009
  tags: [ascode-git-sync]
  exam: { cert: none }
  q: "A team plans to move its alert rules and library panels into Git Sync. What should they know first?"
  options:
    - text: "Git Sync needs one repository per alert rule"
      why: "There is no such rule. The issue is that alert rules are not synced at all."
    - text: "Git Sync converts alert rules into dashboard panels"
      why: "Git Sync does not convert anything; it syncs dashboard and folder files."
    - text: "Alert rules sync only with the <code>folderless</code> target"
      why: "The target decides where synced resources land. It does not add resource types."
    - text: "Git Sync manages only dashboards and folders at this time"
      why: "Alerts, data sources and library panels are not supported yet; they need provisioning files or Terraform."
  answer: [3]
  source: https://grafana.com/docs/grafana/v13.3/as-code/git-sync/add-resources/dashboards-migrate/

- id: q-m16-010
  tags: [ascode-git-sync]
  exam: { cert: none }
  q: "A self-hosted Grafana 13 gets a Repository with <code>url: http://git.tools.svc:3000/dash.git</code> and a token. Which two settings in <code>[provisioning]</code> does it need before it can sync? (Choose two.)"
  options:
    - text: "<code>allowed_git_urls</code> with the host"
      why: "The host resolves to a private address, which Grafana refuses unless it is listed."
    - text: "<code>allow_insecure = true</code>"
      why: "Grafana refuses to send a token over plain <code>http://</code> unless this is set."
    - text: "<code>max_repositories = 0</code> for no limit"
      why: "The default allows 10 connections, so one more needs no change."
    - text: "<code>allowed_targets = instance</code>"
      why: "That lets one repository own the whole instance. A folder target is the default and is enough."
    - text: "<code>min_sync_interval = 1s</code> for faster polling"
      why: "The interval controls how often Grafana polls, not whether it may connect."
  answer: [0, 1]
  source: https://grafana.com/docs/grafana/v13.3/setup-grafana/configure-grafana/

- id: q-m16-011
  tags: [ascode-git-sync]
  exam: { cert: none }
  q: "Why does Grafana refuse Git URLs that resolve to private addresses by default?"
  options:
    - text: "Private Git servers do not speak the Git protocol over HTTP"
      why: "Most private Git servers speak it fine. The refusal is about what Grafana may reach."
    - text: "To stop Grafana from being used to reach internal hosts"
      why: "This is protection against server-side request forgery. An admin opens it host by host."
    - text: "Grafana Labs supports only cloud Git providers"
      why: "Self-hosted servers are supported once listed in <code>allowed_git_urls</code>."
    - text: "Git servers on private addresses cannot send webhooks to Grafana"
      why: "Webhooks are optional, and the refusal applies to polling too."
  answer: [1]
  source: https://grafana.com/docs/grafana/v13.3/as-code/git-sync/git-sync-setup/set-up-before/

- id: q-m16-012
  tags: [ascode-terraform]
  exam: { cert: none }
  q: "This file is applied to a Grafana that has no folder with UID <code>team-a</code>. What does the plan show? The file has <code>grafana_folder.a</code> with <code>uid = \"team-a\"</code>, and <code>grafana_dashboard.d</code> with <code>folder = grafana_folder.a.uid</code> and <code>config_json = jsonencode({uid = \"a-latency\", title = \"Latency\"})</code>."
  options:
    - text: "Plan: 1 to add, because the dashboard needs an existing folder"
      why: "The folder is part of the same configuration, so Terraform creates it first."
    - text: "Plan: 2 to add, with the folder created before the dashboard"
      why: "The reference to the folder's UID tells Terraform the order: folder first, then the dashboard in it."
    - text: "An error, because a folder's UID cannot be set by hand"
      why: "<code>uid</code> is an optional argument of <code>grafana_folder</code>."
    - text: "Plan: 2 to change, because Grafana already has a root folder"
      why: "Nothing exists yet for these resources, so both are created."
  answer: [1]
  source: https://registry.terraform.io/providers/grafana/grafana/4.55.0/docs/resources/folder

- id: q-m16-013
  tags: [ascode-terraform]
  exam: { cert: none }
  q: "A pull request changes only the <code>title</code> inside a dashboard's <code>config_json</code>. The plan prints <code>~ resource \"grafana_dashboard\" \"orders\"</code>. What will apply do?"
  options:
    - text: "Update it in place; the UID and URL stay"
      why: "<code>~</code> is an in-place update. The dashboard gets a new version with the new title."
    - text: "Delete the dashboard and create a new one"
      why: "That is a replacement, shown as <code>-/+</code>."
    - text: "Create a second dashboard with the new title beside the old one"
      why: "Terraform keeps one object per resource."
    - text: "Nothing until someone saves it on the screen"
      why: "Apply calls Grafana's API itself; no screen action is needed."
  answer: [0]
  source: https://grafana.com/docs/grafana/v13.3/as-code/terraform/

- id: q-m16-014
  tags: [ascode-terraform]
  exam: { cert: none }
  q: "A pull request changes a dashboard's <code>uid</code> from <code>orders</code> to <code>checkout-orders</code> in <code>config_json</code>. The plan shows <code>-/+</code>. What should the reviewer expect after apply?"
  options:
    - text: "The old URL keeps working and redirects to the new one"
      why: "A new UID is a new dashboard. Grafana keeps no redirect from a deleted one."
    - text: "Only the title in the browser tab changes"
      why: "The UID is part of the URL, not the title."
    - text: "A new dashboard; links to the old UID break"
      why: "<code>-/+</code> destroys the old dashboard and creates a new one, so links to the old UID no longer work."
    - text: "Both dashboards stay, one per UID"
      why: "Terraform removes the object it replaced."
  answer: [2]
  source: https://registry.terraform.io/providers/grafana/grafana/4.55.0/docs/resources/dashboard

- id: q-m16-015
  tags: [ascode-terraform]
  exam: { cert: none }
  q: "A contact point was created with the Grafana Terraform provider and default settings. A colleague opens it in Grafana to fix a typo. What happens?"
  options:
    - text: "The screen saves the fix, and Terraform copies it into the file"
      why: "Terraform never writes to the configuration files."
    - text: "The screen saves the fix, and the next plan is empty"
      why: "If the screen could save it, the next plan would show drift."
    - text: "Grafana deletes the contact point because it was edited outside Terraform"
      why: "Grafana does not delete resources because someone opened them."
    - text: "Grafana refuses the edit: the contact point is provisioned"
      why: "Alerting resources made through the API are provisioned and read only on the screen unless <code>disable_provenance</code> is set."
  answer: [3]
  source: https://grafana.com/docs/grafana/v13.3/alerting/set-up/provision-alerting-resources/terraform-provisioning/

- id: q-m16-016
  tags: [ascode-terraform, ascode-secrets]
  exam: { cert: none }
  q: "Where should the Terraform state of a Grafana configuration live?"
  options:
    - text: "In the same Git repository, so the team sees every change"
      why: "State can hold secrets in plain text, such as passwords Terraform read back. It must not be in Git."
    - text: "In a protected backend that only the pipeline can read"
      why: "The state ties files to real objects and can contain secrets, so it needs a store with access control."
    - text: "Nowhere; Terraform rebuilds it from Grafana on every run"
      why: "Without state Terraform cannot tell which objects it manages and would try to create them again."
    - text: "In Grafana itself, as a dashboard annotation"
      why: "Grafana has no such feature, and annotations are readable by every viewer."
  answer: [1]
  source: https://grafana.com/docs/grafana/v13.3/as-code/terraform/

- id: q-m16-017
  tags: [ascode-dashboards]
  exam: { cert: none }
  q: "This Python program is run. How many panels does the printed dashboard have? It starts with <code>d = Dashboard(\"Svc\")</code>, loops <code>for s in [\"cart\", \"payment\", \"checkout\", \"ad\"]: d = d.with_panel(Timeseries().title(s))</code>, then prints <code>JSONEncoder().encode(d.build())</code>."
  options:
    - text: "One, because <code>with_panel</code> replaces the last panel"
      why: "<code>with_panel</code> adds a panel to the builder each time it is called."
    - text: "None, because the program only prints, Grafana is not called"
      why: "Printing JSON is the point. The panels are in the JSON whether or not Grafana sees it."
    - text: "Four, one per item of the list"
      why: "The loop adds one time series panel for each service in the list."
    - text: "Eight, because each panel needs a query"
      why: "The panels have no queries here, and a query is not a panel."
  answer: [2]
  source: https://grafana.com/docs/grafana/v13.3/as-code/foundation-sdk/

- id: q-m16-018
  tags: [ascode-dashboards]
  exam: { cert: none }
  q: "A team on Kubernetes deploys everything with Argo CD and wants each dashboard to be a Kubernetes object. Which option fits, and what must they accept?"
  options:
    - text: "The Grafana Operator, a community project without vendor support"
      why: "The Operator creates dashboards from custom resources, and Grafana's page says it is not commercially supported."
    - text: "Git Sync; it needs every dashboard as a Kubernetes custom resource"
      why: "Git Sync reads dashboard JSON from a repository. It does not use custom resources in the cluster."
    - text: "Grizzly; it is the newest tool for dashboards as objects"
      why: "Grizzly has been removed and is no longer supported."
    - text: "Grafonnet; it compiles Jsonnet files into Kubernetes custom objects"
      why: "Grafonnet generates dashboard JSON, not Kubernetes objects, and it is not officially supported."
  answer: [0]
  source: https://grafana.com/docs/grafana/v13.3/as-code/grafana-operator/

- id: q-m16-019
  tags: [ascode-dashboards]
  exam: { cert: none }
  q: "A dashboard file starts with <code>\"apiVersion\": \"dashboard.grafana.app/v2\", \"kind\": \"Dashboard\"</code>. It must be managed with the classic <code>grafana_dashboard</code> resource on Grafana 13. What goes into <code>config_json</code>?"
  options:
    - text: "Only the <code>spec</code> part of the file, without metadata"
      why: "The provider's page says that was the rule for Grafana 12. Grafana 13 needs the whole document."
    - text: "The whole document, with apiVersion and kind included"
      why: "For Grafana 13 the provider's page asks for the full Kubernetes-style JSON in this legacy resource."
    - text: "The file converted to the classic shape by hand first"
      why: "No conversion is needed; the provider accepts the new shape, and a newer resource exists for it too."
    - text: "Nothing; v2 dashboards cannot be managed by Terraform"
      why: "The provider has resources for the newer dashboard API versions as well."
  answer: [1]
  source: https://registry.terraform.io/providers/grafana/grafana/4.55.0/docs/resources/dashboard

- id: q-m16-020
  tags: [ascode-rules]
  exam: { cert: none }
  q: "A pull request adds this recording rule. <code>mimirtool rules check</code> runs in CI. What does it report? The rule: <code>{record: checkout_requests_rate5m, expr: sum(rate(traces_spanmetrics_calls_total{service_name=\"checkout\"}[5m]))}</code>"
  options:
    - text: "Nothing, because the rule is valid PromQL and parses"
      why: "check also tests the name against the naming practice, and this name fails it."
    - text: "That <code>rate()</code> cannot be used in a recording rule"
      why: "Recording rules often use <code>rate()</code>. The query is fine."
    - text: "That the rule group has no <code>interval</code> of its own"
      why: "The interval is optional; the global default applies."
    - text: "A bad name: it has no colon as level:metric:operation needs"
      why: "mimirtool's check requires at least one colon in a recorded name, as Prometheus's naming practice suggests."
  answer: [3]
  source: https://grafana.com/docs/mimir/v3.2.x/manage/tools/mimirtool/

- id: q-m16-021
  tags: [ascode-rules]
  exam: { cert: none }
  q: "A rule file is checked with <code>promtool check rules</code> and passes. What has it proved?"
  options:
    - text: "That the rules parse and all their PromQL is valid"
      why: "check rules reads the file and every expression offline; it does not run them against data."
    - text: "That the alerts will fire when they should"
      why: "That needs <code>promtool test rules</code> with test series, or real data."
    - text: "That the ruler has loaded the rules and runs them"
      why: "promtool works offline and never talks to a ruler."
    - text: "That every metric in the expressions exists"
      why: "promtool has no data. A misspelled metric name is still valid PromQL."
  answer: [0]
  source: https://prometheus.io/docs/prometheus/latest/command-line/promtool/

- id: q-m16-022
  tags: [ascode-rules, ascode-ci]
  exam: { cert: none }
  q: "A unit test for <code>promtool test rules</code> feeds <code>up{job=\"api\"}</code> the values <code>1 1 0 0 0 0</code> at a 1m interval. The alert is <code>up == 0</code> with <code>for: 5m</code>. What should <code>exp_alerts</code> be at <code>eval_time: 4m</code>?"
  options:
    - text: "One firing alert, because <code>up</code> is 0"
      why: "<code>up</code> has been 0 only since minute 2, so the 5 minutes of <code>for</code> have not passed."
    - text: "Empty: the alert is still only pending"
      why: "From minute 2 to 4 is two minutes. A pending alert is not in <code>exp_alerts</code>."
    - text: "One alert for each sample that was 0"
      why: "One series gives at most one alert, however many samples it has."
    - text: "An error, because tests cannot use <code>for</code>"
      why: "Unit tests evaluate <code>for</code> exactly; that is one of their main uses."
  answer: [1]
  source: https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/

- id: q-m16-023
  tags: [ascode-rules]
  exam: { cert: none }
  q: "A pipeline runs <code>mimirtool rules load rules.yaml</code> for tenant <code>team-a</code>. The file has a group <code>slo</code> that already exists in the ruler with other rules. What happens?"
  options:
    - text: "The two versions are merged, rule by rule"
      why: "mimirtool does not merge groups. A group is replaced as a whole."
    - text: "The load fails because a group with that name exists"
      why: "Loading an existing group is normal; it is how a change reaches the ruler."
    - text: "The file's group replaces the one in the ruler"
      why: "load overwrites rule groups of the same name, so the file decides what the group holds."
    - text: "A second group <code>slo</code> is added beside the first"
      why: "Group names are unique in a namespace."
  answer: [2]
  source: https://grafana.com/docs/mimir/v3.2.x/manage/tools/mimirtool/

- id: q-m16-024
  tags: [ascode-pipelines]
  exam: { cert: none }
  q: "This Collector configuration is checked with <code>otelcol validate</code>. What is the result? The whole file: <code>{exporters: {otlp_http/mimir: {endpoint: http://mimir/otlp}}, service: {pipelines: {metrics: {receivers: [otlp], exporters: [otlp_http/mimir]}}}}</code>"
  options:
    - text: "Valid, because a pipeline may name any receiver type it likes"
      why: "A pipeline may only use components that are defined in their own section."
    - text: "Valid, but the Collector would drop all metrics at run time"
      why: "validate stops before that point: the file is refused."
    - text: "An error about the batch processor, which every pipeline needs"
      why: "Processors are optional in a pipeline."
    - text: "An error: the file configures no receiver"
      why: "There is no <code>receivers:</code> section. The Collector 0.165.0 answers <code>no receiver configuration specified in config</code>."
  answer: [3]
  source: https://opentelemetry.io/docs/collector/configuration/

- id: q-m16-025
  tags: [ascode-pipelines, ascode-ci]
  exam: { cert: none }
  q: "Why validate a Collector or Alloy file in CI when the pod would refuse it at start-up anyway?"
  options:
    - text: "A broken file in a rollout leaves pods crashing"
      why: "Validation in CI refuses the file before the merge, so no rollout with a broken file ever starts."
    - text: "validate also tests that every backend is reachable"
      why: "validate checks the file offline; it does not connect to exporters."
    - text: "The pod accepts invalid files and only logs a warning"
      why: "Collector and Alloy refuse invalid files at start-up."
    - text: "CI can repair the file automatically before the merge"
      why: "validate only reports; a person fixes the file."
  answer: [0]
  source: https://opentelemetry.io/docs/collector/configuration/

- id: q-m16-026
