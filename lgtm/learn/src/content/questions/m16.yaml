  q: "A branch adds one dashboard. The plan made from the branch shows <code>Plan: 1 to add, 0 to change, 0 to destroy.</code> The branch is merged. The plan from main the next morning shows <code>1 to add, 1 to change</code>. What happened overnight?"
  options:
    - text: "Terraform counts the merge commit as a change"
      why: "Terraform reads files and Grafana, not commits. A merge adds no resource."
    - text: "The branch plan was not saved, so it expired"
      why: "An unsaved plan is just output; a new plan simply reads the current state."
    - text: "Someone changed a managed resource on the Grafana screen"
      why: "The extra change is drift. The apply from main would set the resource back to the files."
    - text: "The new dashboard was created twice by the merge"
      why: "One resource gives one dashboard, created once."
