      why: "That is the manual way Git Sync replaces; it leaves no review."
    - text: "By a merge from <code>develop</code> into <code>main</code>, after review"
      why: "Production follows <code>main</code>, so the merge is the promotion; Grafana pulls it on its next sync."
    - text: "By saving it in production with the <code>write</code> workflow"
      why: "That skips development and the review of the change."
    - text: "Automatically, because both instances share one database"
      why: "Each instance has its own database; Git is what they share."
  answer: [1]
  source: https://grafana.com/docs/grafana/v13.3/as-code/git-sync/scenarios/dev-prod/
