    - text: "<code>OTEL_RESOURCE_ATTRIBUTES=db.query.text=true</code>"
      why: "Resource attributes describe the service, not the names a library uses."
    - text: "<code>OTEL_TRACES_EXPORTER=database</code>"
      why: "That variable picks an exporter, and database is not one."
  answer: [0]
  source: https://opentelemetry.io/docs/languages/python/instrumentation/

