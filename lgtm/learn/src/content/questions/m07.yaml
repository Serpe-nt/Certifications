- id: q-m07-020
  tags: [otel-spans]
  exam: {cert: otca, domain: O2, competency: Configuration}
  q: "A loop adds 200 events to one span, with the SDK's default limits. How many events does the span keep?"
  options:
    - text: "All 200, because events have no limit"
      why: "Events have a default limit, OTEL_SPAN_EVENT_COUNT_LIMIT."
    - text: "128, the default limit; the rest are dropped"
      why: "The default limit is 128 events, and the message is printed at most once per span."
    - text: "64, half of the default limit for attributes"
      why: "The event limit is its own setting, also 128 by default."
    - text: "None, because the span is dropped when it goes over a limit"
      why: "Only the events over the limit are discarded."
  answer: [1]
  source: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/

- id: q-m07-021
  tags: [otel-sampling, otel-context-propagation]
  exam: {cert: otca, domain: O2, competency: SDK Pipelines}
  q: "A service runs the default sampler. A request arrives with <code>traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-00</code>. What happens to the service's server span?"
  options:
    - text: "It is sampled, because the default sampler is AlwaysOn"
      why: "The default is ParentBased, with AlwaysOn only for root spans."
    - text: "Not sampled: ParentBased follows the flag 00"
      why: "For a remote parent that was not sampled, ParentBased calls AlwaysOff by default."
    - text: "It is sampled with probability one half, as the default ratio"
      why: "No ratio applies by default."
    - text: "It starts a new trace, because the flags make the header invalid"
      why: "Flags 00 are valid; they only say the caller did not sample."
  answer: [1]
  source: https://opentelemetry.io/docs/specs/otel/trace/sdk/

- id: q-m07-022
  tags: [otel-context-propagation]
  exam: {cert: otca, domain: O2, competency: Context Propagation}
  q: "Python code calls <code>token = context.attach(ctx)</code> to make a context with baggage current. Why must it call <code>context.detach(token)</code> afterwards?"
  options:
    - text: "To send the baggage on to the next service"
      why: "Inject sends it. Detach only changes what is current."
    - text: "To restore the previous context for the code that follows"
      why: "Every attach should be followed by a detach, which restores the context that was current before."
    - text: "To free the baggage, which would otherwise be exported as attributes"
      why: "Baggage is never exported as attributes unless code or a processor copies it."
    - text: "To end the current span and send it to the exporter"
      why: "Ending a span is a separate call; detach does not end spans."
  answer: [1]
  source: https://opentelemetry.io/docs/specs/otel/context/

- id: q-m07-023
  tags: [otel-context-propagation]
  exam: {cert: otca, domain: O2, competency: Context Propagation}
  q: "A request carries <code>traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-0000000000000000-01</code>. What must the receiver do with it?"
  options:
    - text: "Accept it and start a span with no parent"
      why: "A parent ID of all zeros is invalid, so the trace ID is not used either."
    - text: "Replace the zeros with a new span ID and go on"
      why: "A receiver does not repair an invalid header."
    - text: "Reject the whole request with an HTTP 400 answer"
      why: "Tracing rules decide about the header, not about the request."
    - text: "Ignore the header: a parent ID of all zeros is invalid"
      why: "The W3C Recommendation says vendors must ignore traceparent when the parent ID is invalid."
  answer: [3]
  source: https://www.w3.org/TR/trace-context/

- id: q-m07-024
  tags: [otel-context-propagation]
  exam: {cert: otca, domain: O2, competency: Context Propagation}
  q: "Service A puts <code>tenant=acme</code> into baggage. Service B, in the middle, runs OpenTelemetry instrumentation with default propagators and never touches baggage. Does service C, after B, receive the entry?"
  options:
    - text: "Yes: instrumentations propagate baggage with the context"
      why: "Baggage travels with the context, and instrumentations propagate it automatically."
    - text: "No, because B must copy every baggage entry by hand"
      why: "B's instrumentation passes the entries on without code."
    - text: "No, because baggage reaches only the first service after the one that set it"
      why: "Baggage goes to every service downstream while the context is propagated."
    - text: "Only if B adds the entry as a span attribute first"
      why: "Attributes and baggage are separate. An attribute is not propagated."
  answer: [0]
  source: https://opentelemetry.io/docs/concepts/signals/baggage/

- id: q-m07-025
  tags: [otel-context-propagation]
  exam: {cert: otca, domain: O4, competency: Context Propagation}
  q: "After a change, the workshop's calls to the shop appear in separate traces. The requests instrumentation is disabled, and the code now calls <code>requests.get(url)</code> with no headers. What fixes it?"
  options:
    - text: "Set OTEL_PROPAGATORS=tracecontext,baggage in workshop.env"
      why: "The propagators are already the default; nothing calls them."
    - text: "Switch the shop's services over to the B3 propagation format"
      why: "The shop reads W3C headers. The problem is that none are sent."
    - text: "Make a client span and inject the context into the request's headers"
      why: "With no instrumentation, the code must make the client span and inject the context into the request itself."
    - text: "Raise the sampler ratio so that the shop's spans are kept"
      why: "Sampling does not join traces; propagation does."
  answer: [2]
  source: https://opentelemetry.io/docs/languages/python/propagation/

- id: q-m07-026
  tags: [otel-zero-code, semantic-conventions]
  exam: {cert: otca, domain: O2, competency: Configuration}
  q: "A Python service under opentelemetry-instrument sends database spans with <code>db.statement</code>. The team's queries use <code>db.query.text</code>. What should they set?"
