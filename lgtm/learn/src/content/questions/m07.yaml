- id: q-m07-028
  tags: [otel-zero-code]
  exam: {cert: otca, domain: O2, competency: Agents}
  q: "A colleague starts a service with <code>opentelemetry-instrument --exporter_otlp_endpoint http://collector:4318 python app.py</code>. You must move this setting into the Deployment's environment. Which variable is it?"
  options:
    - text: "<code>EXPORTER_OTLP_ENDPOINT</code>"
      why: "The variable needs the OTEL_ prefix."
    - text: "<code>OTEL_PYTHON_EXPORTER_OTLP_ENDPOINT</code>"
      why: "The OTEL_PYTHON_ prefix is for Python-specific options only."
    - text: "<code>OTEL_EXPORTER_OTLP_ENDPOINT</code>"
      why: "Write the option in upper case and put OTEL_ in front."
    - text: "<code>OTEL_COLLECTOR_ENDPOINT</code>"
      why: "No such standard variable exists."
  answer: [2]
  source: https://opentelemetry.io/docs/zero-code/python/configuration/

- id: q-m07-029
  tags: [otel-sampling]
  exam: {cert: otca, domain: O2, competency: SDK Pipelines}
  q: "Two services start their own traces with TraceIdRatioBased: one at 0.1, one at 0.5, in the same SDK. Which statement about one trace ID holds?"
  options:
    - text: "The two decisions are independent random draws"
      why: "The decision is a deterministic hash of the trace ID, not a random draw."
    - text: "A trace ID kept at 0.5 is always kept at 0.1 too"
      why: "It is the other way round: the lower ratio keeps a subset."
    - text: "A trace ID kept at 0.1 is always kept at 0.5 too"
      why: "A ratio sampler with a higher ratio must sample every trace that a lower ratio samples."
    - text: "No trace ID can be kept by both"
      why: "The kept sets overlap: the lower ratio's set lies inside the higher one's."
  answer: [2]
  source: https://opentelemetry.io/docs/specs/otel/trace/sdk/

- id: q-m07-030
  tags: [otel-sampling]
  exam: {cert: otca, domain: O2, competency: SDK Pipelines}
  q: "A team wants to keep every trace that contains an error, and 5% of the others. Can a sampler in the SDK do this?"
  options:
    - text: "Yes, with parentbased_traceidratio and an argument of 0.05"
      why: "That keeps 5% of all traces, errors included or not."
    - text: "Yes, if the code sets error attributes when the span starts"
      why: "Errors happen later in the trace, often in other services, after the decision."
    - text: "No: a head sampler decides before errors are known"
      why: "Head sampling cannot ensure that all traces with an error are kept; that needs tail sampling."
    - text: "No, because SDK samplers cannot read span attributes"
      why: "Samplers can read the attributes given at creation; the problem is the timing."
  answer: [2]
  source: https://opentelemetry.io/docs/concepts/sampling/

- id: q-m07-031
  tags: [otel-sampling]
  exam: {cert: otca, domain: O2, competency: SDK Pipelines}
  q: "What does the trace SDK specification say about TraceIdRatioBased today?"
  options:
    - text: "It is removed, and SDKs must reject the traceidratio setting"
      why: "SDKs must keep it unchanged until at least January 1, 2027."
    - text: "Deprecated in favour of ProbabilitySampler; kept unchanged until 2027"
      why: "The page deprecates it in favour of the composable ProbabilitySampler and forbids changing it before January 1, 2027."
    - text: "It is the default sampler for root spans in every SDK"
      why: "The default for root spans is AlwaysOn inside ParentBased."
    - text: "It is stable and recommended as the only sampler of a service"
      why: "The page recommends it only for root spans, inside ParentBased."
  answer: [1]
  source: https://opentelemetry.io/docs/specs/otel/trace/sdk/

- id: q-m07-032
  tags: [otel-sdk-pipeline]
  exam: {cert: otca, domain: O2, competency: SDK Pipelines}
  q: "A custom span processor sets an attribute in OnEnd, but the attribute never reaches the backend. Why?"
  options:
    - text: "In OnEnd the span has ended and may not be changed"
      why: "OnEnd receives a span that is already ended, and modifying it is not allowed."
    - text: "OnEnd runs only for spans that were not sampled"
      why: "OnEnd runs for every recording span."
    - text: "Attributes set by processors are dropped by the exporter"
      why: "Exporters send what the span holds; they do not filter processor attributes."
    - text: "Processors may only add events, not attributes"
      why: "In OnStart a processor gets a read and write span and can add attributes."
  answer: [0]
  source: https://opentelemetry.io/docs/specs/otel/trace/sdk/

- id: q-m07-033
  tags: [otel-sdk-pipeline]
  exam: {cert: otca, domain: O2, competency: Configuration}
  q: "A team sets <code>OTEL_BSP_SCHEDULE_DELAY=1000</code>. What changes in the batch span processor?"
  options:
    - text: "Each batch holds at most 1000 spans"
      why: "The batch size is OTEL_BSP_MAX_EXPORT_BATCH_SIZE."
    - text: "An export may take up to 1000 milliseconds before it is cancelled"
      why: "That is OTEL_BSP_EXPORT_TIMEOUT."
    - text: "The queue holds 1000 spans before it drops new ones"
      why: "That is OTEL_BSP_MAX_QUEUE_SIZE."
    - text: "Exports happen at most one second apart, not five"
      why: "The schedule delay is the interval between exports, 5000 milliseconds by default."
  answer: [3]
  source: https://opentelemetry.io/docs/specs/otel/configuration/sdk-environment-variables/

- id: q-m07-034
  tags: [otel-sdk-pipeline, otel-sampling]
  exam: {cert: otca, domain: O2, competency: SDK Pipelines}
  q: "A processor counts spans in OnStart. The service uses parentbased_traceidratio with 0.2, and the count is far below the number of requests. Why?"
  options:
    - text: "OnStart runs only for the root span of each trace"
      why: "OnStart runs for every recording span, root or not."
    - text: "The batch processor runs first and removes spans"
      why: "Processors run in registration order, and none removes spans from another."
    - text: "Spans the sampler dropped never reach a processor"
      why: "Processors receive only spans whose IsRecording is true, and dropped spans are not recording."
    - text: "OnStart is called only after the exporter succeeds"
      why: "OnStart is called when the span starts, before any export."
  answer: [2]
  source: https://opentelemetry.io/docs/specs/otel/trace/sdk/

- id: q-m07-035
  tags: [semantic-conventions]
  exam: {cert: otca, domain: O1, competency: Semantic Conventions}
  q: "A database span has <code>db.query.summary</code> set to <code>SELECT orders</code>, <code>db.operation.name</code> set to <code>SELECT</code> and <code>db.collection.name</code> set to <code>shop.orders</code>. What should the span be named?"
  options:
    - text: "SELECT shop.orders"
      why: "Operation and target are used only when no summary is available."
    - text: "SELECT orders"
      why: "When a query summary is available, the span name is the summary."
    - text: "SELECT"
      why: "The operation alone is not a rule of the conventions when better names exist."
    - text: "postgresql"
      why: "The system name is used only when nothing better is known."
  answer: [1]
  source: https://opentelemetry.io/docs/specs/semconv/db/database-spans/

- id: q-m07-036
  tags: [semantic-conventions]
  exam: {cert: otca, domain: O1, competency: Semantic Conventions}
  q: "A consumer calls <code>poll()</code> to pull messages from a queue. Which span kind do the messaging conventions give the receive span?"
  options:
    - text: "Consumer, because it receives messages"
      why: "Consumer is the kind of a process span. A receive span is a request the code makes."
    - text: "Producer, because the queue produces the messages"
      why: "Producer is for creating or sending messages."
    - text: "Server, because the queue sends data to the application"
      why: "The application asks for the messages and waits; it is not serving a request."
    - text: "Client, because the application asks and waits"
      why: "The messaging conventions give the receive operation the client kind."
  answer: [3]
  source: https://opentelemetry.io/docs/specs/semconv/messaging/messaging-spans/

- id: q-m07-037
  tags: [semantic-conventions]
  exam: {cert: otca, domain: O1, competency: Semantic Conventions}
  q: "The workshop's client span for a call to the shop receives a 404. By the HTTP conventions, what status should the client span have?"
  options:
    - text: "Unset, because a 4xx is the client's own mistake"
      why: "Unset for a 4xx applies to server spans."
    - text: "Ok, because the server answered"
      why: "Instrumentation should not set Ok."
    - text: "Error, because the client span got a 4xx answer"
      why: "For 4xx codes the status should be Error on a client span and left Unset on a server span."
    - text: "Unset, because only network failures are errors"
      why: "4xx and 5xx answers on a client span should be errors."
  answer: [2]
  source: https://opentelemetry.io/docs/specs/semconv/http/http-spans/
