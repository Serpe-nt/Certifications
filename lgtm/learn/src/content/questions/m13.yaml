# traceql-investigation
- id: q-m13-033
  tags: [traceql-investigation, traceql-structural]
  exam: { cert: none }
  q: 'Product-catalog''s server spans take seconds. Which query shows which of their direct children waited?'
  options:
    - text: '<code>{ resource.service.name = "product-catalog" && span:kind = server && span:duration > 1s } > { span:duration > 1s }</code>'
      why: 'The child operator returns the slow direct children of the slow server spans.'
    - text: '<code>{ resource.service.name = "product-catalog" && span:kind = server && span:duration > 1s } < { span:duration > 1s }</code>'
      why: 'The parent operator returns the parents of the slow server spans, the callers.'
    - text: '<code>{ resource.service.name = "product-catalog" && span:duration > 1s } | count() > 1</code>'
      why: 'This keeps traces with several slow spans but does not relate them.'
    - text: '<code>{ resource.service.name = "product-catalog" } && { span:duration > 1s }</code>'
      why: 'Two selectors without a structural operator do not relate the spans.'
  answer: [0]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

# tempo-tenants-limits
- id: q-m13-034
  tags: [tempo-tenants-limits]
  exam: { cert: none }
  q: 'A tenant sends a 6 MB trace. On this lab, <code>max_bytes_per_trace</code> is 5,000,000 bytes. What does the sender see?'
  options:
    - text: 'HTTP 429 with RATE_LIMITED from the distributor'
      why: 'RATE_LIMITED is about bytes per second. 6 MB is far under the rate limit.'
    - text: 'HTTP 413, because the request body is too large to accept'
      why: 'The distributor accepts the body; the limit is per trace and checked later.'
    - text: 'HTTP 200; later the spans are dropped as trace_too_large'
      why: 'The trace size limit is enforced downstream, after the distributor has answered.'
    - text: 'HTTP 200, and Tempo stores the first 5 MB of the trace'
      why: 'On the lab, the whole trace was dropped and could not be read at all.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/troubleshooting/send-traces/max-trace-limit-reached/

- id: q-m13-035
  tags: [tempo-tenants-limits]
  exam: { cert: none }
  q: 'You want one search over the tenants <code>lab</code> and <code>learn-m13</code> on this lab. Which header does that?'
  options:
    - text: '<code>X-Scope-OrgID: lab,learn-m13</code>'
      why: 'Tempo separates tenants in a query with a pipe, not a comma.'
    - text: '<code>X-Scope-OrgID: *</code>'
      why: 'Tempo has no wildcard tenant. Each tenant must be named.'
    - text: '<code>X-Scope-OrgID: lab|learn-m13</code>'
      why: 'With multi-tenant queries enabled, a pipe-separated list reads several tenants at once.'
    - text: 'Two headers, one per tenant, in the same request'
      why: 'Tempo reads one header value and splits it at the pipe character.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/configuration/

- id: q-m13-036
  tags: [tempo-tenants-limits, tempo-architecture]
  exam: { cert: none }
  q: 'Which Tempo limit can make a sender see an error while it waits for the answer?'
  options:
    - text: '<code>max_bytes_per_trace</code>, the size of one trace'
      why: 'Trace size is checked by live-stores and block-builders, after the answer.'
    - text: '<code>max_traces_per_user</code>, the live traces per tenant'
      why: 'Live traces are counted by the live-stores as they read Kafka, not by the distributor.'
    - text: '<code>block_retention</code>, the age of the stored blocks'
      why: 'Retention deletes old blocks. It never refuses a write.'
    - text: '<code>rate_limit_bytes</code>, the ingestion rate per tenant'
      why: 'The rate limit is the only limit the distributor enforces before it answers.'
  answer: [3]
  source: https://grafana.com/docs/tempo/v3.1.x/reference-tempo-architecture/components/distributor/

- id: q-m13-037
  tags: [traceql-basics]
  exam: { cert: none }
  q: 'What does <code>{ trace:rootService = "load-generator" && span:duration > 1s }</code> return?'
  options:
    - text: 'Load generator spans that took longer than one second'
      why: 'trace:rootService is a property of the whole trace, so the slow span can belong to any service.'
    - text: 'Spans over one second in traces that the load generator started'
      why: 'Both conditions hold on one span: the trace''s root service and the span''s own duration.'
    - text: 'Traces started by the load generator that took over one second'
      why: 'span:duration is the span''s own length. Whole traces need trace:duration.'
    - text: 'An error, because a trace intrinsic cannot be mixed with a span intrinsic'
      why: 'Trace intrinsics are the same on every span of a trace, so they combine with span fields.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

- id: q-m13-038
  tags: [traceql-investigation, traceql-basics]
  exam: { cert: none }
  q: 'You want traces in which checkout''s own server span took more than 2 seconds. Which query finds exactly those?'
  options:
    - text: '<code>{ resource.service.name = "checkout" && span:kind = server && trace:duration > 2s }</code>'
      why: 'trace:duration is the length of the whole trace, so a fast checkout span in a long trace matches.'
    - text: '<code>{ span:duration > 2s } >> { resource.service.name = "checkout" }</code>'
      why: 'This returns checkout spans below any slow span, without a limit on checkout''s own time.'
    - text: '<code>{ resource.service.name = "checkout" && span:kind = server && span:duration > 2s }</code>'
      why: 'All three conditions hold on checkout''s own server span.'
    - text: '<code>{ span:name = "PlaceOrder" && span:duration > 2s }</code>'
      why: 'The span is named oteldemo.CheckoutService/PlaceOrder, and equality needs the whole name.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/
