# tempo-why
- id: q-m13-001
  tags: [tempo-why]
  exam: { cert: none }
  q: 'At 14:05 the p95 latency of checkout, cart and product-catalog rises together, and no log line shows an error. What tells you which service holds the extra time?'
  options:
    - text: 'The service whose latency panel rose by the most milliseconds'
      why: 'A caller that waits for a slow dependency rises at least as much as the dependency, so the largest rise can be a victim.'
    - text: 'One slow trace, read to the span that holds the time'
      why: 'The waterfall shows which call held the time and which spans only waited for their children.'
    - text: 'The request rate of each service in the same five minutes'
      why: 'A rate says how many requests arrived, not where the time of one request was spent.'
    - text: 'The error logs of all three services since 14:00'
      why: 'A slow call often logs no error, and logs of separate processes do not show who waited for whom.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/introduction/telemetry/

- id: q-m13-002
  tags: [tempo-why]
  exam: { cert: none }
  q: 'A service sends one more span of a trace an hour after the other spans arrived. What does Tempo do with it?'
  options:
    - text: 'Refuses it, because the trace was closed when its root span ended'
      why: 'Tempo never closes a trace. Spans of the same trace ID can arrive at any time.'
    - text: 'Stores it as a new trace with a new trace ID'
      why: 'Tempo keeps the span''s own trace ID. It does not invent IDs.'
    - text: 'Stores it, and a lookup of the trace ID returns it with the others'
      why: 'Tempo collects every span with the ID from wherever it was written and returns them together.'
    - text: 'Stores it only if the first spans are still in a live-store'
      why: 'Spans can be in different blocks; the query path puts them together at read time.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/introduction/

# tempo-architecture
- id: q-m13-003
  tags: [tempo-architecture]
  exam: { cert: none }
  q: 'In Tempo 3 microservices mode, which component writes the blocks that are kept in object storage?'
  options:
    - text: 'The ingester, after it has cut a block from its memory'
      why: 'Tempo 3 has no ingester. That component was removed in 3.0.'
    - text: 'The live-store, once a trace has been idle for some seconds'
      why: 'In microservices mode the live-store only serves recent data. It never writes the kept blocks.'
    - text: 'The block-builder, at the end of each consumption cycle'
      why: 'Block-builders read Kafka in cycles, write Parquet blocks and then commit their offsets.'
    - text: 'The backend worker, which also compacts the blocks'
      why: 'Backend workers compact and delete blocks that already exist. They do not build them from Kafka.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/reference-tempo-architecture/components/block-builder/

- id: q-m13-004
  tags: [tempo-architecture, tempo-ingest]
  exam: { cert: none }
  q: 'A collector gets HTTP 200 from a Tempo 3 distributor in microservices mode. What has happened to the spans at that moment?'
  options:
    - text: 'A block-builder has written them to object storage'
      why: 'The block-builder writes blocks later, at the end of its cycle. The answer does not wait for it.'
    - text: 'Kafka has acknowledged them, so they are durable'
      why: 'The distributor answers only after Kafka confirms the write, which makes the spans safe.'
    - text: 'A live-store has made the trace searchable'
      why: 'Live-stores read Kafka on their own schedule. The distributor does not wait for them.'
    - text: 'Every limit of the tenant has been checked and passed'
      why: 'Only the rate limit is checked at once. The trace size limit is applied later, downstream.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/reference-tempo-architecture/components/distributor/

- id: q-m13-005
  tags: [tempo-architecture]
  exam: { cert: none }
  q: 'On this lab, <code>query_backend_after</code> is 15 minutes. A search covers the last 10 minutes. Where do the queriers read the spans?'
  options:
    - text: 'From the live-stores, which hold the recent traces'
      why: 'Time ranges newer than query_backend_after are served by the live-stores.'
    - text: 'From the blocks in object storage only'
      why: 'Blocks are read for the part of a range older than query_backend_after.'
    - text: 'From the Kafka topic, read directly by the queriers'
      why: 'Queriers do not read Kafka. Live-stores and block-builders are its consumers.'
    - text: 'From the metrics-generator, which keeps the last spans'
      why: 'The metrics-generator writes metrics to Mimir. It does not answer trace searches.'
  answer: [0]
  source: https://grafana.com/docs/tempo/v3.1.x/operations/compaction/

# tempo-ingest
- id: q-m13-006
  tags: [tempo-ingest]
  exam: { cert: none }
  q: 'A test pod sends spans to the lab''s distributor with <code>X-Scope-OrgID: learn-m13</code>. Why does Grafana''s Tempo data source never show them?'
  options:
    - text: 'Grafana hides services that have only one pod'
      why: 'Grafana does not filter by pod count. The tenant decides what it can see.'
    - text: 'The data source sends X-Scope-OrgID: lab with every query'
      why: 'Each tenant is kept apart, and this data source only reads tenant lab.'
    - text: 'Spans sent straight to a distributor skip the live-stores'
      why: 'All spans go through Kafka to the live-stores, whatever sent them.'
    - text: 'The tenant must first be created in the runtime overrides'
      why: 'A tenant needs no setup. The first write with a new name creates it.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/operations/manage-advanced-systems/multitenancy/

- id: q-m13-007
  tags: [tempo-ingest]
  exam: { cert: none }
  q: 'You write an OTLP span by hand as JSON for <code>/v1/traces</code>. Which value is right for a server span''s fields?'
  options:
    - text: '<code>"traceId": "4bf92f3577b34da6a3ce929d0e0e4736"</code> and <code>"kind": 2</code>'
      why: 'In OTLP JSON the trace ID is 32 hex characters and kind 2 means server.'
    - text: '<code>"traceId": "4bf92f35-77b3-4da6-a3ce-929d0e0e4736"</code> and <code>"kind": 2</code>'
      why: 'A trace ID is plain hex with no hyphens. The UUID form is not accepted.'
    - text: '<code>"traceId": "4bf92f3577b34da6"</code> and <code>"kind": "server"</code>'
      why: 'Sixteen hex characters is a span ID. A trace ID has 32.'
    - text: '<code>"traceId": "4bf92f3577b34da6a3ce929d0e0e4736"</code> and <code>"kind": 3</code>'
      why: 'Kind 3 is a client span. A server span is kind 2.'
  answer: [0]
  source: https://grafana.com/docs/tempo/v3.1.x/api_docs/pushing-spans-with-http/

# tempo-find-trace
- id: q-m13-008
  tags: [tempo-find-trace]
  exam: { cert: none }
  q: 'During an incident you run <code>{ resource.service.name = "checkout" && status = error }</code> and get 20 traces. Are they the 20 newest?'
  options:
    - text: 'Yes, Tempo always sorts search results by start time'
      why: 'Tempo stops when it has enough matches, so the results are the first found, not the newest.'
    - text: 'Yes, because the default limit counts back from the end of the range'
      why: 'The limit counts results as they come back from many jobs, in no fixed order.'
    - text: 'No; add <code>with (most_recent=true)</code> to get the newest first'
      why: 'The experimental hint makes Tempo search deeper and return the newest traces sorted by time.'
    - text: 'No; raise the limit to 1,000 and sort the table by duration'
      why: 'A bigger limit costs more and sorting by duration does not give the newest traces.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

- id: q-m13-009
  tags: [tempo-find-trace]
  exam: { cert: none }
  q: 'In this lab, a checkout log line in Loki shows <code>trace_id</code> with an <b>Open trace</b> link. What makes that link?'
  options:
    - text: 'A derived field of the Loki data source'
      why: 'The lab provisions a derived field named trace_id that turns the value into a link to Tempo.'
    - text: 'An exemplar that Loki stores next to each log line'
      why: 'Exemplars belong to metrics. Log lines carry the trace ID as structured metadata.'
    - text: 'The trace to logs setting of the Tempo data source'
      why: 'Trace to logs goes the other way, from a span to the logs around it.'
    - text: 'A service graph edge between checkout and Loki'
      why: 'Service graphs link services that call each other, not log lines to traces.'
  answer: [0]
  source: https://grafana.com/docs/grafana/v13.3/datasources/loki/configure/

# traceql-basics
- id: q-m13-010
  tags: [traceql-basics]
  exam: { cert: none }
  q: 'On the lab, <code>{ resource.service.name =~ "check" }</code> returns no trace while checkout is busy. Why?'
  options:
    - text: 'Regular expressions only work on span attributes'
      why: 'Regular expressions work on resource attributes too; <code>"check.*"</code> matches.'
    - text: 'Its regular expressions are anchored at both ends'
      why: 'Tempo treats every regular expression as anchored at both ends, so "check" only matches the exact word.'
    - text: 'The service name is stored in lower case in another column'
      why: 'The value is checkout, in lower case; case is not the problem.'
    - text: 'The <code>=~</code> operator needs the value without quotes'
      why: 'String values are always written in double quotes in TraceQL.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

- id: q-m13-011
  tags: [traceql-basics]
  exam: { cert: none }
  q: 'The shop''s HTTP status codes are integers. What does <code>{ span.http.response.status_code = "500" }</code> return on the lab?'
  options:
    - text: 'Every span with status code 500, as with an integer'
      why: 'TraceQL compares types strictly. A string does not equal the integer 500.'
    - text: 'An error, because quotes are not allowed after the equals sign'
      why: 'Quotes are allowed; the query is valid. It simply compares with a string.'
    - text: 'No trace: a string never equals the integer 500'
      why: 'Write the integer without quotes, <code>= 500</code>, to match the integer values.'
    - text: 'Spans with a status code that starts with 5'
      why: 'Equality compares the whole value. A prefix needs a regular expression on a string.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

- id: q-m13-012
  tags: [traceql-basics]
  exam: { cert: none }
  q: 'You want traces that passed through both frontend and checkout. What does <code>{ resource.service.name = "frontend" && resource.service.name = "checkout" }</code> return?'
  options:
    - text: 'Traces that contain spans of both services'
      why: 'Inside one pair of braces, all conditions must hold on the same span.'
    - text: 'Traces that contain spans of either service'
      why: 'That would need <code>||</code>. And even then, it would not require both.'
    - text: 'An error, because a field cannot appear twice in a selector'
      why: 'TraceQL accepts the query. It just cannot match anything.'
    - text: 'No trace, because no single span belongs to two services'
      why: 'Use two selectors, <code>{ ... frontend } && { ... checkout }</code>, to ask for both in one trace.'
  answer: [3]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

- id: q-m13-013
  tags: [traceql-basics]
  exam: { cert: none }
  q: 'Which spans does <code>{ duration > 2s }</code> return?'
  options:
    - text: 'All spans of traces that took longer than 2 seconds end to end'
      why: 'That is <code>trace:duration</code>. The short form <code>duration</code> is the span''s own.'
    - text: 'Spans that each took longer than 2 seconds from start to end'
      why: 'The unscoped <code>duration</code> is an alias for <code>span:duration</code>.'
    - text: 'Root spans only, because only they have a duration of the request'
      why: 'Every span has a start and an end time, so every span has a duration.'
    - text: 'Spans whose attribute <code>duration</code> is over 2 seconds'
      why: 'An attribute would need a dot and a scope. Without them, duration is the intrinsic.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

- id: q-m13-014
  tags: [traceql-basics]
  exam: { cert: none }
  q: 'Both <code>{ span.rpc.method = "GetProduct" }</code> and <code>{ .rpc.method = "GetProduct" }</code> find the same traces on the lab. Why does Tempo''s tuning guide prefer the first?'
  options:
    - text: 'The second form is deprecated and will stop working'
      why: 'The guide calls it slower, not deprecated.'
    - text: 'The second form only searches resource attributes'
      why: 'A leading dot without a scope searches every scope, not only the resource.'
    - text: 'The first form is case sensitive and the second is not'
      why: 'Scope has nothing to do with case; both compare values exactly.'
    - text: 'An unscoped name makes Tempo look in several scopes'
      why: 'A scoped attribute lets Tempo read only the span attributes.'
  answer: [3]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/tune-traceql-queries/

- id: q-m13-015
  tags: [traceql-basics]
  exam: { cert: none }
  q: 'What does <code>{ status = error } | select(span:statusMessage)</code> do?'
  options:
    - text: 'Error spans, each with its status message added'
      why: 'select() adds the named fields to the matching spans without filtering further.'
    - text: 'Returns only error spans that have a status message'
      why: 'select() never filters; spans with an empty message stay in the result.'
    - text: 'Groups the error spans by status message'
      why: 'Grouping is done by <code>by()</code>, not by select().'
    - text: 'Fails, because select() takes attributes and not intrinsics'
      why: 'select() takes intrinsics such as span:statusMessage as well as attributes.'
  answer: [0]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

# traceql-structural
- id: q-m13-016
  tags: [traceql-structural]
  exam: { cert: none }
  q: 'Which spans does <code>{ resource.service.name = "checkout" } >> { span:name = "astronomy-db" }</code> return?'
  options:
    - text: 'The checkout spans that have a database span below them'
      why: 'Structural operators return the right side. The checkout spans would need <code>&>></code> or <code><<</code>.'
    - text: 'Database spans with a checkout span anywhere above'
      why: 'The descendant operator returns spans of the right side with an ancestor that matches the left.'
    - text: 'Both the checkout spans and the database spans'
      why: 'Both sides come back only with the union form, <code>&>></code>.'
    - text: 'Database spans whose direct parent is a checkout span'
      why: 'That is the child operator, <code>></code>. The descendant operator accepts any depth.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

- id: q-m13-017
  tags: [traceql-structural]
  exam: { cert: none }
  q: 'Checkout''s server span calls cart and product-catalog through an internal span. What does <code>{ resource.service.name = "checkout" && span:kind = server } > { resource.service.name = "product-catalog" }</code> return?'
  options:
    - text: 'Every product-catalog span below the checkout server span'
      why: 'That is what <code>>></code> would return. <code>></code> needs a direct parent.'
    - text: 'An error, because <code>></code> compares numbers'
      why: 'Between two selectors, <code>></code> is the child operator.'
    - text: 'Product-catalog spans with a sibling in checkout'
      why: 'Siblings are matched by <code>~</code>, not by <code>></code>.'
    - text: 'Nothing: product-catalog is not a direct child'
      why: 'The child operator requires the left span as the direct parent, and an internal span sits between them.'
  answer: [3]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

- id: q-m13-018
  tags: [traceql-structural]
  exam: { cert: none }
  q: 'You want the failing endpoint span and also every failing span below it, in one result. Which query does that?'
  options:
    - text: '<code>{ span.http.route = "/api/checkout" && status = error } >> { status = error }</code>'
      why: 'This returns only the failing spans below the route, not the route span itself.'
    - text: '<code>{ span.http.route = "/api/checkout" && status = error } && { status = error }</code>'
      why: 'This only asks that both exist in the trace, with no relation between them.'
    - text: '<code>{ span.http.route = "/api/checkout" && status = error } &>> { status = error }</code>'
      why: 'The union form of the descendant operator returns the matching spans of both sides.'
    - text: '<code>{ status = error } >> { span.http.route = "/api/checkout" && status = error }</code>'
      why: 'This returns route spans that sit below another error, the reverse of what you want.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

- id: q-m13-019
  tags: [traceql-structural]
  exam: { cert: none }
  q: 'What does <code>{ status = error } | by(resource.service.name) | count() > 1</code> find?'
  options:
    - text: 'Services with more than one error across all traces in the range'
      why: 'Pipelines work per trace. Counting across traces is a TraceQL metrics query.'
    - text: 'Traces in which a single service has more than one error span'
      why: 'by() groups each trace''s error spans per service, and count() keeps groups with more than one.'
    - text: 'Traces in which more than one service has an error'
      why: 'That would count services, not error spans per service.'
    - text: 'A time series of errors per service'
      why: 'A series needs a metrics function such as <code>rate()</code>, not count() in a pipeline.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

- id: q-m13-020
  tags: [traceql-structural]
  exam: { cert: none }
  q: 'Tempo marks the operators <code>!>></code>, <code>!></code>, <code>!<<</code>, <code>!<</code> and <code>!~</code> as experimental. Why?'
  options:
    - text: 'They read the whole trace, so they are disabled by default'
      why: 'They are available to every query. The documentation warns about their results, not their cost.'
    - text: 'They only work on blocks written in vParquet3'
      why: 'Tempo 3.1 no longer writes vParquet3. These operators are not tied to it.'
    - text: 'They can sometimes return false positives'
      why: 'The documentation says these negated operators may return spans that do not truly match.'
    - text: 'They return the left side instead of the right side'
      why: 'Like the other structural operators, they return the right side.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/traceql/construct-traceql-queries/

# traceql-metrics
- id: q-m13-021
  tags: [traceql-metrics]
  exam: { cert: none }
  q: 'Which query gives one time series of requests per second for each service?'
  options:
    - text: '<code>{ span:kind = server } | by(resource.service.name) | count()</code>'
      why: 'by() and count() work per trace and return traces, not series.'
    - text: '<code>{ span:kind = server } | count() by (resource.service.name)</code>'
      why: 'count() is a span set aggregate and does not take by() after it.'
    - text: '<code>{ span:kind = server } | select(resource.service.name)</code>'
      why: 'select() only adds fields to the matching spans of each trace.'
    - text: '<code>{ span:kind = server } | rate() by (resource.service.name)</code>'
      why: 'rate() turns matching spans into a per-second series, and by() splits it per service.'
  answer: [3]
  source: https://grafana.com/docs/tempo/v3.1.x/metrics-from-traces/metrics-queries/functions/

- id: q-m13-022
  tags: [traceql-metrics]
  exam: { cert: none }
  q: 'On this lab, you ask the API for <code>{ resource.service.name = "checkout" } | rate()</code> over the last 6 hours. What happens?'
  options:
    - text: 'Tempo answers with six hours of data from the blocks'
      why: 'This lab caps metrics queries at 3 hours, so six hours are refused.'
    - text: 'HTTP 400: the range is over the maximum of 3h0m0s'
      why: 'The query frontend''s metrics max_duration is 3 hours on this lab.'
    - text: 'Tempo answers only the last 15 minutes, from the live-stores'
      why: 'Tempo does not shorten the range silently. It refuses it.'
    - text: 'Tempo samples the spans so the query finishes in time'
      why: 'Sampling happens only when a query asks for it with a hint.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/metrics-from-traces/metrics-queries/configure-traceql-metrics/

- id: q-m13-023
  tags: [traceql-metrics]
  exam: { cert: none }
  q: 'A Tempo 3.1 cluster runs the metrics-generator with only the span-metrics processor. Can it answer TraceQL metrics queries on the last 10 minutes?'
  options:
    - text: 'No, it needs the local-blocks processor in the metrics-generator'
      why: 'Tempo 3.0 removed the local-blocks processor. It is no longer needed or accepted.'
    - text: 'No, TraceQL metrics read only the span metrics in Mimir'
      why: 'TraceQL metrics read stored spans in Tempo, not series in Mimir.'
    - text: 'Yes, but only after the block-builder has flushed the spans'
      why: 'Recent spans are served by the live-stores, before any block exists.'
    - text: 'Yes, the live-stores answer for recent spans, with no processor'
      why: 'In Tempo 3 the live-store handles TraceQL metrics on recent data.'
  answer: [3]
  source: https://grafana.com/docs/tempo/v3.1.x/metrics-from-traces/metrics-generator/

