# tempo-sampling
- id: q-m13-027
  tags: [tempo-sampling]
  exam: { cert: none }
  q: 'Every SDK of a system keeps 10% of traces with a head sampler, and Tempo''s metrics-generator makes span metrics. What do the span metrics show?'
  options:
    - text: 'The right request rate, because Tempo reads the sampling rate'
      why: 'The generator counts only the spans it receives. It does not scale them.'
    - text: 'No data, because sampled spans are not counted'
      why: 'Kept spans are counted like any other.'
    - text: 'Too many errors, because a sampler always keeps error traces'
      why: 'A head sampler decides before the request runs, so it cannot prefer errors.'
    - text: 'About one tenth of the real request rate'
      why: 'Only one trace in ten reaches Tempo, so the counts are a tenth of the traffic.'
  answer: [3]
  source: https://grafana.com/docs/tempo/v3.1.x/set-up-for-tracing/instrument-send/set-up-collector/tail-sampling/

- id: q-m13-028
  tags: [tempo-sampling, traceql-metrics]
  exam: { cert: none }
  q: 'Traces were head-sampled at 15% by a probability sampler that records its probability. Which query estimates the real rate of checkout spans?'
  options:
    - text: '<code>{ resource.service.name = "checkout" } | rate() with(sample=true)</code>'
      why: 'sample=true samples at query time to save work. It does not undo collection sampling.'
    - text: '<code>{ resource.service.name = "checkout" } | rate() with(extrapolate=true)</code>'
      why: 'The experimental hint scales each span by one over the sampling probability recorded on it.'
    - text: '<code>{ resource.service.name = "checkout" } | rate() with(span_sample=0.15)</code>'
      why: 'span_sample reads only a share of the stored spans. It lowers the count further.'
    - text: '<code>{ resource.service.name = "checkout" } | rate() * 0.15</code>'
      why: 'Multiplying by 0.15 makes the rate smaller still. The real rate is larger than the stored one.'
  answer: [1]
  source: https://grafana.com/docs/tempo/v3.1.x/metrics-from-traces/metrics-queries/functions/

# tempo-storage
- id: q-m13-029
  tags: [tempo-storage]
  exam: { cert: none }
  q: 'A block-builder crashes after writing <code>data.parquet</code> but before <code>meta.json</code>. What do queriers see?'
  options:
    - text: 'Nothing, since a block is invisible until meta.json exists'
      why: 'Without meta.json the block is invisible, and the restarted block-builder writes it again.'
    - text: 'A half-written block that returns errors until it is deleted'
      why: 'The flush order keeps half-written blocks out of the read path.'
    - text: 'The spans of the block, read straight from data.parquet'
      why: 'Queriers use meta.json to find blocks. Without it, they do not read the data.'
    - text: 'Two copies of the spans after the block-builder restarts'
      why: 'Block IDs are deterministic, so the retry overwrites the same block.'
  answer: [0]
  source: https://grafana.com/docs/tempo/v3.1.x/reference-tempo-architecture/components/block-builder/

- id: q-m13-030
  tags: [tempo-storage]
  exam: { cert: none }
  q: 'The backend workers compact tenant lab''s blocks every few minutes. What does that change about how long traces are kept?'
  options:
    - text: 'Traces are kept shorter, because merging drops old spans'
      why: 'Compaction merges blocks without dropping data. Only retention deletes it.'
    - text: 'Traces are kept longer, because a merged block gets a new date'
      why: 'Retention looks at the age of the data, not at when the block was written.'
    - text: 'Nothing: retention jobs still delete data older than 48 hours'
      why: 'Compaction changes how many blocks hold the data. Retention removes it by age.'
    - text: 'Traces are kept until the bucket is full'
      why: 'Tempo deletes by age, with block_retention. It does not watch the bucket size.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/reference-tempo-architecture/components/compaction/

- id: q-m13-031
  tags: [tempo-storage, traceql-basics]
  exam: { cert: none }
  q: 'Why does <code>{ span.http.response.status_code = 500 }</code> read far less data than fetching every trace in the range?'
  options:
    - text: 'Tempo keeps an index of every attribute value, like a search engine'
      why: 'A block''s index maps trace IDs, not attribute values. The columns do the work.'
    - text: 'The query frontend caches the answer of every query'
      why: 'A results cache helps only for repeated queries, not for the first one.'
    - text: 'Blocks are Parquet, so Tempo reads the columns the query needs'
      why: 'Columnar storage lets the query read the status code column without whole traces.'
    - text: 'Status codes are stored in Mimir and joined at query time'
      why: 'Span attributes stay in Tempo. Mimir holds only the metrics the generator writes.'
  answer: [2]
  source: https://grafana.com/docs/tempo/v3.1.x/reference-tempo-architecture/block-format/

# tempo-drilldown
- id: q-m13-032
  tags: [tempo-drilldown]
  exam: { cert: none }
  q: 'Traces Drilldown shows normal durations for checkout requests, but the database is said to be slow. The app uses its default signal. What should you change first?'
  options:
    - text: 'The metric from Duration to Span rate'
      why: 'A rate does not show slowness. The signal, not the metric, hides the database spans.'
    - text: 'The data source from tempo to mimir'
      why: 'Traces Drilldown works on a Tempo data source.'
    - text: 'The percentile of the Breakdown from p90 to p50'
      why: 'A lower percentile shows the typical span, which hides slowness further.'
    - text: 'The signal from Root spans to All spans'
      why: 'Root spans show only the first span of each trace. All spans includes the database calls.'
  answer: [3]
