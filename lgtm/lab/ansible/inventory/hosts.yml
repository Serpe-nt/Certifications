---
# Generated by `make inventory` from lgtm/lab/vm/nodes.yml. Do not edit by hand:
# change nodes.yml and run `make inventory` again.
all:
  vars:
    ansible_user: vaka
    ansible_ssh_private_key_file: ~/.ssh/ansible
    # Host keys of the lab VMs go to their own known_hosts file, accepted on first contact.
    ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_lgtm-lab"
    ssh_allowed_users: vaka
    lab_cluster_name: lgtm-lab
    lab_upstream_dns:
      - 1.1.1.1
      - 9.9.9.9
    dns_server_ip: 10.10.0.5
    dns_search_domain: k8s.local
    # cloud-init already configured the single network card.
    network_manage_k8s_interface: false
    master_init_apiserver_cert_extra_sans:
      - 10.10.0.5
  children:
    load_balancer:
      hosts:
        lb:
          ansible_host: 10.10.0.5
          k8s_net_ip: 10.10.0.5
    k8s_cluster:
      children:
        control_plane:
          hosts:
            master1:
              ansible_host: 10.10.0.11
              k8s_net_ip: 10.10.0.11
              k8s_interface: eth0
        workers:
          hosts:
            worker1:
              ansible_host: 10.10.0.30
              k8s_net_ip: 10.10.0.30
              k8s_interface: eth0
              node_prereqs_data_disk_size_gb: 40
            worker2:
              ansible_host: 10.10.0.31
              k8s_net_ip: 10.10.0.31
              k8s_interface: eth0
              node_prereqs_data_disk_size_gb: 40
            worker3:
              ansible_host: 10.10.0.32
              k8s_net_ip: 10.10.0.32
              k8s_interface: eth0
              node_prereqs_data_disk_size_gb: 40
            worker4:
              ansible_host: 10.10.0.33
              k8s_net_ip: 10.10.0.33
              k8s_interface: eth0
              node_prereqs_data_disk_size_gb: 40
          vars:
            node_prereqs_longhorn: true
