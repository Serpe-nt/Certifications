---
# make reset: remove the lab releases and their data, keep the cluster, the
# platform and the two secrets (the lab seed stays valid in the site, the
# Grafana password stays the same). Data means the releases' volumes and the
# objects in the six buckets of the lab contract, and the ingest topics in Kafka.
- name: Uninstall the lab releases, the shop first
  kubernetes.core.helm:
    name: "{{ item.name }}"
    release_namespace: "{{ item.namespace }}"
    state: absent
    wait: true
  loop: "{{ lab_reset_releases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Delete the releases' volumes
  ansible.builtin.command:
    cmd: "{{ lab_kubectl }} -n {{ item }} delete pvc --all --ignore-not-found --wait=true"
  loop: "{{ lab_reset_releases | map(attribute='namespace') | unique | list }}"
  register: lab_reset_pvc
  changed_when: "'deleted' in lab_reset_pvc.stdout"

- name: Delete the Kafka topics of the releases
  ansible.builtin.command:
    cmd: "{{ lab_kubectl }} -n kafka delete kafkatopic {{ lab_reset_kafka_topics | join(' ') }} --ignore-not-found --wait=true"
  register: lab_reset_topics
  changed_when: "'deleted' in lab_reset_topics.stdout"
  when: lab_profile == 'full'

- name: Empty the lab buckets with a one-off Job in namespace mimir
  ansible.builtin.command:
    cmd: "{{ lab_kubectl }} -n mimir apply -f -"
    stdin: "{{ lab_reset_job | to_nice_json }}"
  changed_when: true

- name: Wait for the buckets to be empty
  ansible.builtin.command:
    cmd: "{{ lab_kubectl }} -n mimir wait --for=condition=complete job/lab-reset-buckets --timeout=300s"
  changed_when: false

- name: Delete the bucket Job
  ansible.builtin.command:
    cmd: "{{ lab_kubectl }} -n mimir delete job lab-reset-buckets --wait=true"
  changed_when: true
