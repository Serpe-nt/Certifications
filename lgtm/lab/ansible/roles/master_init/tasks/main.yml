---
- name: Create config dir
  ansible.builtin.file:
    path: /etc/k8s_bootstrap/
    state: directory
    mode: '0755'

- name: Move k8s template to the master
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: "kubeadm-config.yaml.j2"
      dest: "/etc/k8s_bootstrap/kubeadm-config.yaml"
    - src: "calico-custom-resources.yaml.j2"
      dest: "/etc/k8s_bootstrap/calico-custom-resources.yaml"

- name: Initialize k8s master
  ansible.builtin.command:
    cmd: "kubeadm init --config /etc/k8s_bootstrap/kubeadm-config.yaml"
    creates: /etc/kubernetes/admin.conf

- name: Create kube user dir
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Confgure kubectl access for the user
  ansible.builtin.copy:
    remote_src: true
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# The operator CRDs are too large for client-side apply, and since Calico 3.30 they are not
# part of tigera-operator.yaml. Both manifests are applied server-side, once.
- name: Check for the Calico operator CRDs
  ansible.builtin.command:
    cmd: "kubectl get crd installations.operator.tigera.io"
  register: master_init_crds_present
  failed_when: false
  changed_when: false
  become: false

- name: Install the Calico operator CRDs
  ansible.builtin.command:
    cmd: "kubectl apply --server-side --force-conflicts -f {{ master_init_calico_crds_manifest_url }}"
  when: master_init_crds_present.rc != 0
  changed_when: true
  become: false

- name: Check for the Tigera operator
  ansible.builtin.command:
    cmd: "kubectl get deployment tigera-operator --namespace tigera-operator"
  register: master_init_operator_present
  failed_when: false
  changed_when: false
  become: false

- name: Install Tigera operator for managing Calico
  ansible.builtin.command:
    cmd: "kubectl apply --server-side --force-conflicts -f {{ tigera_operator_manifest_url }}"
  when: master_init_operator_present.rc != 0
  changed_when: true
  become: false

- name: Wait for the Tigera operator to be ready
  ansible.builtin.command:
    cmd: "kubectl get crd installations.operator.tigera.io"
  become: false
  changed_when: false
  register: master_init_crd_check
  until: master_init_crd_check.rc == 0
  retries: 20
  delay: 10

- name: Install Calico CNI
  ansible.builtin.command:
    cmd: "kubectl apply -f /etc/k8s_bootstrap/calico-custom-resources.yaml"
  register: master_init_calico_result
  changed_when: "'created' in master_init_calico_result.stdout or 'configured' in master_init_calico_result.stdout"
  become: false

- name: Wait for Calico to be ready
  ansible.builtin.command:
    cmd: "kubectl wait --for=condition=Ready pods --all -n calico-system --timeout=60s"
  changed_when: false
  become: false
  register: master_init_calico_wait
  until: master_init_calico_wait.rc == 0
  retries: 20
  delay: 15
