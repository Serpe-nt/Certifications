---
# The first apt task on a cluster node: a fresh cloud image may have no package lists yet,
# so the cache is refreshed here (at most once an hour, so a re-run reports no change).
- name: Install Containerd
  ansible.builtin.apt:
    package: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create config dir
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0744"

# Generated once only: regenerating it on every run undid the edits below and
# restarted containerd each time.
- name: Generate default Containerd config
  ansible.builtin.shell:
    cmd: "containerd config default > /etc/containerd/config.toml"
    creates: /etc/containerd/config.toml

- name: Fix containerd cgroup and correct k8s cni plugin bin path
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: "{{ item.regexp }}"
    replace: "{{ item.replace }}"
  loop:
    - regexp: "SystemdCgroup = false"
      replace: "SystemdCgroup = true"
    - regexp: 'bin_dir = "/usr/lib/cni"'
      replace: 'bin_dir = "/opt/cni/bin"'
  notify: Restart containerd
