---
# The load balancer and the lab DNS come first: kubeadm init on the first control-plane node
# needs cluster-endpoint.k8s.local to resolve and port 6443 to answer through HAProxy.
- name: Load balancer and lab DNS
  hosts: load_balancer
  become: true
  roles:
    - ssh_hardening
    - node_prereqs
    - lb_haproxy
    - lb_dnsmasq

- name: Common setup
  hosts: k8s_cluster
  become: true
  roles:
    - ssh_hardening
    - swapoff
    - k8s_kernel_modules
    - containerd
    - network
    - node_prereqs
    - k8s_packages

- name: Initialize first master node
  hosts: control_plane[0]
  become: true
  roles:
    - master_init

- name: Join remaining control plane nodes
  hosts: control_plane[1:]
  become: true
  serial: 1
  roles:
    - control_plane_join

- name: Join workers
  hosts: workers
  become: true
  roles:
    - worker_join

- name: Write the lab kubeconfig on the control machine
  hosts: control_plane[0]
  become: true
  roles:
    - kubeconfig_fetch
