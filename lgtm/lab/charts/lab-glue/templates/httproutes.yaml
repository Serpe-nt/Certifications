{{- /*
Gateway API routes for the lab's addresses: <host>.<domain> to one Service.
Each route is created in its Service's namespace.
*/ -}}
{{- $root := . -}}
{{- range .Values.routes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .host }}
  namespace: {{ .namespace }}
  labels:
    {{- include "lab-glue.labels" $root | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $root.Values.gateway.name }}
      namespace: {{ $root.Values.gateway.namespace }}
      {{- with $root.Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ printf "%s.%s" .host $root.Values.domain | quote }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ .service }}
          port: {{ .port }}
{{- end }}
