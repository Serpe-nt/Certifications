{{- /*
The lab's own alert rules, loaded by the lab's Prometheus (kube-prometheus-stack
selects every PrometheusRule in the cluster). LabVolumeFillingUp fires when a
volume of the lab is more than 85% full; `make lab-check` fails at the same
threshold. Kafka's volumes filled on 2026-11-11 with nobody told
(lgtm/docs/adr/l5-kafka-disk.md).

LabKafkaTrimNotSucceeding fires when Longhorn's hourly kafka-trim has not
succeeded for kafkaTrimMaxHours while Prometheus watched the CronJob the whole
time (a sample at every 10-minute step). Without the trim a Kafka replica grows
towards its whole volume. Longhorn keeps no failed Job of the trim, so
KubeJobFailed no longer reports it. The second condition keeps the alert quiet
after the lab was off: the last success is then from before the stop, and the
first runs fail while Longhorn starts
(lgtm/docs/adr/l12-kafka-trim-after-start.md). `make lab-check` fails on the
same expression at once (tests/lab/kafka-trim.sh); the alert waits 10 minutes
more, so that a run that succeeds a few seconds late does not fire it.
*/ -}}
{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-glue-volumes
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lab-glue.labels" . | nindent 4 }}
spec:
  groups:
    - name: lab-volumes
      rules:
        - alert: LabVolumeFillingUp
          expr: |
            max by (namespace, persistentvolumeclaim) (
              kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes
            ) > {{ .Values.alerts.volumeFullRatio }}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Volume {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.persistentvolumeclaim {{ "}}" }} is {{ "{{" }} $value | humanizePercentage {{ "}}" }} full."
            description: >-
              A volume of the lab is above {{ mulf .Values.alerts.volumeFullRatio 100 }}% of its size.
              Find what grows (lgtm/lab/docs/budget.md, "Volumes and buckets") and
              free or grow it before it fills (lgtm/lab/docs/runbook.md).
    - name: lab-kafka-trim
      rules:
        - alert: LabKafkaTrimNotSucceeding
          expr: |
            (
              time() - max by (namespace, cronjob) (
                kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="kafka-trim"}
              ) > {{ .Values.alerts.kafkaTrimMaxHours }} * 3600
            )
            and
            (
              max by (namespace, cronjob) (
                count_over_time(kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="kafka-trim"}[{{ .Values.alerts.kafkaTrimMaxHours }}h:10m])
              ) >= {{ mul .Values.alerts.kafkaTrimMaxHours 6 }}
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn's kafka-trim has not succeeded for {{ "{{" }} $value | humanizeDuration {{ "}}" }}."
            description: >-
              The hourly filesystem trim of the Kafka volumes has not succeeded for
              more than {{ .Values.alerts.kafkaTrimMaxHours }} hours. Without it a Kafka replica grows
              towards its whole volume. Find out why (lgtm/lab/docs/runbook.md,
              "The Kafka trim keeps failing").
{{- end }}
