{{- /*
One Deployment, and a Service when the component listens on a port, for each
entry under .Values.components.
*/ -}}
{{- $root := . -}}
{{- range $name, $c := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "shop.labels" (list $root $name) | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" (list $root $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shop.labels" (list $root $name) | nindent 8 }}
    spec:
      {{- with $root.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "shop.image" (list $root $name) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- if $c.port }}
          ports:
            - name: service
              containerPort: {{ $c.port }}
          {{- end }}
          env:
            {{- include "shop.otelEnv" (list $root $name $c.otlp $c.criticality "deployment" $name) | nindent 12 }}
            {{- range $k, $v := $c.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if eq $name "frontend" }}
            - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ include "shop.publicOtlpTracesEndpoint" $root | quote }}
            {{- end }}
            {{- if eq $name "load-generator" }}
            - name: LOCUST_USERS
              value: {{ $root.Values.loadGenerator.users | quote }}
            - name: LOCUST_BROWSER_TRAFFIC_ENABLED
              value: {{ $root.Values.loadGenerator.browserTraffic | quote }}
            {{- end }}
            {{- if eq $name "product-catalog" }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Release.Name }}-postgresql
                  key: astronomy-password
            - name: DB_CONNECTION_STRING
              value: postgres://astronomy_user:$(DB_PASSWORD)@astronomy-db/astronomy_db?sslmode=disable
            {{- end }}
          {{- with $c.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          {{- if eq $name "product-catalog" }}
          volumeMounts:
            - name: otel-config
              mountPath: /otel-config
              readOnly: true
          {{- end }}
      {{- if eq $name "product-catalog" }}
      volumes:
        - name: otel-config
          configMap:
            name: {{ $root.Release.Name }}-product-catalog-otel-config
      {{- end }}
{{- if $c.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "shop.labels" (list $root $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shop.selectorLabels" (list $root $name) | nindent 4 }}
  ports:
    - name: {{ ternary "http" "grpc" (has $name (list "frontend" "frontend-proxy" "image-provider" "load-generator")) }}
      port: {{ $c.port }}
      targetPort: service
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-product-catalog-otel-config
  labels:
    {{- include "shop.labels" (list . "product-catalog") | nindent 4 }}
data:
  otel-config.yml: |-
    {{- .Files.Get "files/product-catalog-otel-config.yml" | nindent 4 }}
