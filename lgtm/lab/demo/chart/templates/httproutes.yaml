{{- /*
Gateway API routes: shop.<domain>, flags.<domain> and loadgen.<domain>, all to
the frontend proxy, which serves the flag screen under /feature and the load
generator under /loadgen/. The bare flags and loadgen host names redirect to
those paths.
*/ -}}
{{- if .Values.gateway.enabled }}
{{- $root := . -}}
{{- range $key, $path := dict "shop" "" "flags" "/feature" "loadgen" "/loadgen/" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $key }}
  labels:
    {{- include "shop.labels" (list $root "frontend-proxy") | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $root.Values.gateway.name }}
      namespace: {{ $root.Values.gateway.namespace }}
      {{- with $root.Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ printf "%s.%s" (index $root.Values.gateway.hosts $key) $root.Values.gateway.domain | quote }}
  rules:
    {{- if $path }}
    - matches:
        - path: { type: Exact, value: / }
      filters:
        - type: RequestRedirect
          requestRedirect:
            path: { type: ReplaceFullPath, replaceFullPath: {{ $path }} }
            statusCode: 302
    {{- end }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: frontend-proxy
          port: 8080
{{- end }}
{{- end }}
