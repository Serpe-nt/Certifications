---
# Unit test of the alert LabKafkaTrimNotSucceeding (charts/lab-glue/templates/alerts.yaml) with
# promtool, from the image of the lab's Prometheus version. From lgtm/lab in WSL, with Docker:
#
#   make lab-rule-test
#
# One sample a minute. A value of kube_cronjob_status_last_successful_time is the time of the last
# success in seconds, on the same clock as the test's minutes (minute 60 is 3600); the CronJob's
# kube_cronjob_created is there whenever the lab runs. `_` is a minute without a sample: the lab
# was off.
rule_files:
  - ../../.bin/lab-glue-rules.yml
evaluation_interval: 1m
tests:
  # The trim succeeded at 0 and never again, with the lab running: the condition holds from
  # 181m, and the alert fires 10 minutes later.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '0x299'
      - series: 'kube_cronjob_created{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '-100000x299'
    alert_rule_test:
      - eval_time: 179m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
      - eval_time: 185m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
      - eval_time: 192m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: longhorn-system
              cronjob: kafka-trim
            exp_annotations:
              summary: "Longhorn's kafka-trim has not succeeded for 3h 12m 0s."
              description: >-
                The hourly filesystem trim of the Kafka volumes has not succeeded for
                more than 3 hours. Without it a Kafka replica grows towards its whole volume.
                Find out why (lgtm/lab/docs/runbook.md, "The Kafka trim keeps failing").

  # A night off, as on 2026-11-16: success at 00:07 (0), stop at 00:30, start at about 13:21,
  # the missed run fails while Longhorn starts, the run of 14:07 (840m) succeeds.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '0x23 _x770 0x45 50400x60'
      - series: 'kube_cronjob_created{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '-100000x23 _x770 -100000x106'
    alert_rule_test:
      - eval_time: 800m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
      - eval_time: 839m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
      - eval_time: 900m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []

  # The same night, but the trim keeps failing after the start: the alert fires about three
  # hours and ten minutes after the start.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '0x23 _x770 0x300'
      - series: 'kube_cronjob_created{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '-100000x23 _x770 -100000x300'
    alert_rule_test:
      - eval_time: 960m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
      - eval_time: 1000m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: longhorn-system
              cronjob: kafka-trim
            exp_annotations:
              summary: "Longhorn's kafka-trim has not succeeded for 16h 40m 0s."
              description: >-
                The hourly filesystem trim of the Kafka volumes has not succeeded for
                more than 3 hours. Without it a Kafka replica grows towards its whole volume.
                Find out why (lgtm/lab/docs/runbook.md, "The Kafka trim keeps failing").

  # A short stop: successes at 11:07 (0) and 12:07 (60m), stop at 12:30, start at about 14:53.
  # The runs of 14:07 (at boot) and 15:07 fail while Longhorn starts, 16:07 (300m) succeeds.
  # The last success is more than three hours old from 15:07 on, but Prometheus has not watched
  # all of those hours.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '0x59 3600x23 _x149 3600x66 18000x30'
      - series: 'kube_cronjob_created{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '-100000x83 _x149 -100000x97'
    alert_rule_test:
      - eval_time: 250m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
      - eval_time: 299m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []

  # A new lab whose trim never succeeds: the CronJob is created at 0 and has no success, so
  # there is no kube_cronjob_status_last_successful_time. The age counts from the creation, and
  # the alert fires about three hours and ten minutes later.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '0x300'
    alert_rule_test:
      - eval_time: 100m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
      - eval_time: 185m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
      - eval_time: 192m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: longhorn-system
              cronjob: kafka-trim
            exp_annotations:
              summary: "Longhorn's kafka-trim has not succeeded for 3h 12m 0s."
              description: >-
                The hourly filesystem trim of the Kafka volumes has not succeeded for
                more than 3 hours. Without it a Kafka replica grows towards its whole volume.
                Find out why (lgtm/lab/docs/runbook.md, "The Kafka trim keeps failing").

  # A new lab whose trim works: the CronJob is created at 0, the first run succeeds at 7m and
  # every run after it.
  - interval: 1m
    input_series:
      - series: 'kube_cronjob_created{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '0x300'
      - series: 'kube_cronjob_status_last_successful_time{namespace="longhorn-system", cronjob="kafka-trim"}'
        values: '_x7 420x59 4020x59 7620x59 11220x59 14820x53'
    alert_rule_test:
      - eval_time: 100m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
      - eval_time: 200m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
      - eval_time: 300m
        alertname: LabKafkaTrimNotSucceeding
        exp_alerts: []
