# kind cluster for the L3 smoke test (cluster name lgtm-l3).
# One node is enough: the kind profile runs single replicas. The gateway's
# NodePorts 30080 and 30443 (lab contract) are published on 127.0.0.1 only,
# on the host ports reserved for this card (28080 and 28443).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 28080
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 30443
        hostPort: 28443
        listenAddress: 127.0.0.1
        protocol: TCP
