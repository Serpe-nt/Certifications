# Stand-in for the platform's `telemetry` Kafka (card L2 runs it with Strimzi on
# the real cluster). One KRaft node, no authentication, no persistence. Only the
# bootstrap address matters to the lab releases:
# telemetry-kafka-bootstrap.kafka.svc:9092 (lab contract, "Platform interfaces").
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-kafka-bootstrap
  namespace: kafka
spec:
  selector:
    app: telemetry-kafka
  ports:
    - name: tcp-clients
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: telemetry-kafka
  namespace: kafka
spec:
  serviceName: telemetry-kafka-bootstrap
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-kafka
  template:
    metadata:
      labels:
        app: telemetry-kafka
    spec:
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
        runAsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: kafka
          # The image the mimir-distributed chart uses for its own demo Kafka.
          image: docker.io/apache/kafka-native:4.1.0
          ports:
            - containerPort: 9092
              name: clients
            - containerPort: 9093
              name: controller
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://telemetry-kafka-bootstrap.kafka.svc:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "6" }
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 400Mi }
            limits: { cpu: "1", memory: 700Mi }
          # The image writes its generated configuration into /opt/kafka/config.
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka
            - name: config
              mountPath: /opt/kafka/config
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
