# Grafana, full profile for the lab cluster. Chart and versions: VERSION in
# this folder.
#
# Data sources carry the fixed UIDs of the lab contract and are linked to each
# other: exemplars open traces, traces open their logs and metrics, log lines
# open their trace. Module m14 takes these links apart and rebuilds them.
# Dashboards come from ConfigMaps labelled grafana_dashboard (chart lab-glue).
# The admin password is in Secret grafana/grafana-admin, which the playbook
# creates; alerting is left at its defaults.
#
# In provisioning files Grafana expands $VAR and ${VAR} from the environment,
# so the Grafana variables below are written with a doubled dollar ($$).

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# SQLite on a small volume keeps users, stars and edits across restarts.
# The role lab_grafana adds the StorageClass (lab_storage_class).
persistence:
  enabled: true
  size: 1Gi
deploymentStrategy:
  type: Recreate
# The volume gets the right owner from the pod's fsGroup; no root init container.
initChownData:
  enabled: false
# The chart's Helm test pod is not used.
testFramework:
  enabled: false

resources:
  requests: { cpu: 50m, memory: 192Mi }
  limits: { cpu: "1", memory: 512Mi }

grafana.ini:
  server:
    root_url: http://grafana.lab.k8s.local
  analytics:
    check_for_updates: false
    reporting_enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        url: http://mimir-gateway.mimir.svc/prometheus
        access: proxy
        isDefault: true
        jsonData:
          prometheusType: Mimir
          httpMethod: POST
          timeInterval: 30s
          httpHeaderName1: X-Scope-OrgID
          # Exemplars on span metrics (Tempo writes traceID) and on OTLP
          # metrics (the SDKs write trace_id) both open the trace in Tempo.
          exemplarTraceIdDestinations:
            - name: traceID
              datasourceUid: tempo
            - name: trace_id
              datasourceUid: tempo
        secureJsonData:
          httpHeaderValue1: lab
      - name: Mimir (tenant prom)
        uid: mimir-prom
        type: prometheus
        url: http://mimir-gateway.mimir.svc/prometheus
        access: proxy
        jsonData:
          prometheusType: Mimir
          httpMethod: POST
          timeInterval: 30s
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: prom
      - name: Loki
        uid: loki
        type: loki
        url: http://loki-gateway.loki.svc
        access: proxy
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          maxLines: 1000
          # OTLP logs keep the trace id in the structured metadata field
          # trace_id; the derived field turns it into a link to Tempo.
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              url: "$${__value.raw}"
              urlDisplayLabel: Open trace
        secureJsonData:
          httpHeaderValue1: lab
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo-query-frontend.tempo.svc:3200
        access: proxy
        jsonData:
          httpHeaderName1: X-Scope-OrgID
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - key: service.name
                value: service_name
            customQuery: true
            query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
          tracesToMetrics:
            datasourceUid: mimir
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - key: service.name
                value: service_name
            queries:
              - name: Request rate
                query: 'sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
              - name: Latency p95
                query: 'histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))'
          serviceMap:
            datasourceUid: mimir
          nodeGraph:
            enabled: true
          lokiSearch:
            datasourceUid: loki
          search:
            hide: false
        secureJsonData:
          httpHeaderValue1: lab
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prom-prometheus.prom.svc:9090
        access: proxy
        jsonData:
          prometheusType: Prometheus
          httpMethod: POST
          timeInterval: 30s
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        url: http://prom-alertmanager.prom.svc:9093
        access: proxy
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false

# Dashboards: every ConfigMap labelled grafana_dashboard, in any namespace.
# The annotation grafana_folder names the folder.
sidecar:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
