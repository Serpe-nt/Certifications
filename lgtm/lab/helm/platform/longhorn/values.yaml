---
# Longhorn chart (version pinned in ../versions.yml). Namespace longhorn-system.
# Real cluster only: the kind profile uses kind's own StorageClass instead.
# The workers keep Longhorn's data on their second disk, mounted at /var/lib/longhorn
# by the node_prereqs role (card L1).
persistence:
  # The default StorageClass `longhorn` (lab contract: lab_storage_class).
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Delete
defaultSettings:
  defaultDataPath: /var/lib/longhorn
  # Two copies of every volume on two different workers: one worker may be down.
  defaultReplicaCount: 2
  # Share of each node's CPU reserved for each instance manager (default 12).
  # The lab is small; 5 percent of 6 vCPU is 300m.
  guaranteedInstanceManagerCPU: 5
  # Volumes are thin: a replica takes on disk only what was written. Longhorn keeps
  # 30 percent of each 40 GiB disk in reserve, so at 100 percent only about 117 GiB of
  # replicas fit on the four workers, less than the 155 GiB that the platform and the
  # lab ask for with two copies each (docs/budget.md). 200 percent allows about 235 GiB;
  # storageMinimalAvailablePercentage still stops scheduling on a disk that is really full.
  storageOverProvisioningPercentage: 200
  storageMinimalAvailablePercentage: 15
csi:
  # One of each CSI sidecar per two workers is enough for a lab (default 3).
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2
longhornGlobalManager:
  replicas: 2
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
longhornManager:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
longhornUI:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
# The Longhorn screen at http://longhorn.lab.k8s.local, through the Gateway lab.
httproute:
  enabled: true
  parentRefs:
    - name: lab
      namespace: gateway
  hostnames:
    - longhorn.lab.k8s.local
