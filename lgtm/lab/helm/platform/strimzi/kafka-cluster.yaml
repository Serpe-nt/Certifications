---
# Settings of the Kafka cluster `telemetry` for the real cluster (profile full). The
# platform_kafka role reads this file and its kind overlay, kafka-cluster-kind.yaml,
# and renders the Kafka and KafkaNodePool resources from them.
#
# Mimir 3 (ingest storage) and Tempo 3 write to it and read from it. Three nodes that
# are both KRaft controller and broker: one may be down without losing writes.
replicas: 3
# Each node holds a replica of every partition (replication factor 3 on 3 nodes), so the
# volume must hold every partition at its size limit (see config below). Raised from
# 5Gi after the volumes filled on 2026-11-11 (lgtm/docs/adr/l5-kafka-disk.md). Strimzi
# can grow a volume in place; Kubernetes never shrinks one.
storage_size: 10Gi
# Measured on the lab cluster: about 470 MiB per node idle with a 768 MiB heap,
# 768 to 827 MiB after 30 minutes of load with a 512 MiB heap (the rest is page
# cache of the log segments). A 512 MiB heap is plenty for the lab's write rate;
# the request follows the loaded measurement (lgtm/docs/adr/l4-fit-6gb-workers.md).
resources:
  requests:
    cpu: 200m
    memory: 896Mi
  limits:
    cpu: "1"
    memory: 1280Mi
jvm_heap: 512m
config:
  default.replication.factor: 3
  min.insync.replicas: 2
  offsets.topic.replication.factor: 3
  transaction.state.log.replication.factor: 3
  transaction.state.log.min.isr: 2
  # The ingest topics only bridge the gap until Mimir and Tempo store blocks in S3.
  # Kafka deletes a closed segment when it is older than the time limit or when the
  # partition is above the size limit, whichever comes first. The size limit is per
  # partition and Kafka never deletes the open segment, so the worst case on one node is
  # 8 partitions (mimir-ingest 6, tempo-traces 2) x (640 MiB + 64 MiB) = 5.5 GiB, plus
  # five minutes of writes between two retention checks and the internal topics: about
  # 58% of the 10Gi volume (lgtm/docs/adr/l5-kafka-disk.md).
  log.retention.hours: 24
  log.retention.bytes: 671088640
  log.segment.bytes: 67108864
  auto.create.topics.enable: true
entity_operator_resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi
