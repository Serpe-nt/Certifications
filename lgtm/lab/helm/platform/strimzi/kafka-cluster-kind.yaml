---
# Kind profile overlay for the Kafka cluster `telemetry`: one node, small volume.
replicas: 1
storage_size: 2Gi
resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1Gi
jvm_heap: 512m
config:
  default.replication.factor: 1
  min.insync.replicas: 1
  offsets.topic.replication.factor: 1
  transaction.state.log.replication.factor: 1
  transaction.state.log.min.isr: 1
