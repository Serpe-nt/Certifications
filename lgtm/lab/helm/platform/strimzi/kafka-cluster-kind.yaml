---
# Kind profile overlay for the Kafka cluster `telemetry`: one node, small volume.
replicas: 1
storage_size: 2Gi
resources:
  requests:
    cpu: 100m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1Gi
jvm_heap: 512m
config:
  default.replication.factor: 1
  min.insync.replicas: 1
  offsets.topic.replication.factor: 1
  transaction.state.log.replication.factor: 1
  transaction.state.log.min.isr: 1
  # 8 partitions x (100 MiB + 32 MiB) is about 1.1 GiB, under 70% of the 2Gi volume.
  log.retention.bytes: 104857600
  log.segment.bytes: 33554432
