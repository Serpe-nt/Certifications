# Loki in microservices mode ("Distributed" in the chart), full profile for the
# lab cluster. Chart and versions: VERSION in this folder.
#
# Write path: gateway -> distributor -> three ingesters -> chunks and TSDB index
# in the S3 store. Read path: gateway -> query-frontend -> query-scheduler ->
# queriers, which ask the ingesters and the index-gateway. The compactor applies
# the 48-hour retention. Simple scalable mode is not used: Loki 4.0 removes it.
#
# The role lab_loki adds the StorageClass of every volume (lab_storage_class).
# values-kind.yaml shrinks this for the kind smoke test; the wiring stays.

deploymentMode: Distributed

global:
  # The platform's S3 keys (Secret lab-s3), read into the configuration
  # through -config.expand-env, which the chart always sets.
  extraEnv:
    - name: LAB_S3_ENDPOINT
      valueFrom: { secretKeyRef: { name: lab-s3, key: endpoint } }
    - name: LAB_S3_REGION
      valueFrom: { secretKeyRef: { name: lab-s3, key: region } }
    - name: LAB_S3_ACCESS_KEY
      valueFrom: { secretKeyRef: { name: lab-s3, key: access_key } }
    - name: LAB_S3_SECRET_KEY
      valueFrom: { secretKeyRef: { name: lab-s3, key: secret_key } }

loki:
  # Tenants come from the X-Scope-OrgID header ("lab").
  auth_enabled: true
  commonConfig:
    replication_factor: 3
  schemaConfig:
    configs:
      # TSDB index with schema v13: required for structured metadata and the
      # only store Loki 4.0 keeps.
      - from: "2026-11-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
    s3:
      endpoint: ${LAB_S3_ENDPOINT}
      region: ${LAB_S3_REGION}
      accessKeyId: ${LAB_S3_ACCESS_KEY}
      secretAccessKey: ${LAB_S3_SECRET_KEY}
      s3ForcePathStyle: true
      insecure: true
  limits_config:
    # Logs retention of the lab contract, applied by the compactor.
    retention_period: 48h
    # Structured metadata keeps trace_id, span_id and the other OTLP
    # attributes without making them stream labels.
    allow_structured_metadata: true
    volume_enabled: true
    # Query limits (lgtm/docs/adr/l8-query-limits-and-switches.md). A query whose
    # index statistics promise more than 500MB is refused before it reads a
    # chunk; on 2026-11-12 one such query pushed the object store over its
    # memory limit. Only filtered log queries and metric queries are checked.
    max_query_bytes_read: 500MB
    max_querier_bytes_read: 150MB
    tsdb_max_query_parallelism: 16
    max_query_parallelism: 8
    # The lab keeps 48 hours; a longer range reads nothing more.
    max_query_length: 49h
    query_timeout: 1m
    otlp_config:
      resource_attributes:
        # Keep the default index labels (service_name, k8s_namespace_name, ...)
        # and add the gateway's "cluster" attribute (lab contract).
        attributes_config:
          - action: index_label
            attributes: [cluster]
  compactor:
    retention_enabled: true
    delete_request_store: s3
  ingester:
    chunk_encoding: snappy
  pattern_ingester:
    enabled: false

ingester:
  replicas: 3
  zoneAwareReplication:
    enabled: false
  # Volume size and StorageClass: role lab_loki (the chart takes a list of
  # claims, which Helm replaces as a whole).
  persistence:
    enabled: true
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }

distributor:
  replicas: 2
  maxUnavailable: 1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 384Mi }

querier:
  replicas: 2
  maxUnavailable: 1
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { cpu: "1", memory: 768Mi }

queryFrontend:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: "1", memory: 256Mi }

queryScheduler:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }

indexGateway:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 384Mi }

compactor:
  replicas: 1
  # Volume size and StorageClass: role lab_loki, as for the ingester.
  persistence:
    enabled: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 384Mi }

ruler:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }

# The other deployment modes stay at zero.
singleBinary:
  replicas: 0
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Small caches: the lab holds two days of logs.
resultsCache:
  allocatedMemory: 128
  resources:
    requests: { cpu: 20m, memory: 160Mi }
    limits: { cpu: 500m, memory: 192Mi }
chunksCache:
  allocatedMemory: 256
  resources:
    requests: { cpu: 20m, memory: 320Mi }
    limits: { cpu: 500m, memory: 384Mi }

# The nginx gateway is the single entry point: OTLP (/otlp/v1/logs), push
# (/loki/api/v1/push) and the query API.
gateway:
  replicas: 1
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }
  # The access-log exporter sidecar is off: nothing scrapes it yet.
  metrics:
    enabled: false

# The memcached exporter sidecars are off for the same reason.
memcachedExporter:
  enabled: false

# The canary and the chart's Helm test write test logs; the lab does not need them.
lokiCanary:
  enabled: false
test:
  enabled: false
