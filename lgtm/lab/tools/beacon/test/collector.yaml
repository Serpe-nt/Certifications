# A debug-only stand-in for the lab's collector gateway, for the beacon's kind
# test. It runs the gateway's processors that can change what the beacon
# sends (lgtm/lab/helm/otel-gateway/values.yaml: resource/cluster,
# transform/sanitize_spans, redaction) and prints everything it receives.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway
  namespace: otel
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 200
        spike_limit_mib: 50
      resource/cluster:
        attributes:
          - key: cluster
            value: lgtm-lab
            action: upsert
      transform/sanitize_spans:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - set_semconv_span_name("1.43.0", "original_span_name")
      redaction:
        allow_all_keys: true
        blocked_key_patterns:
          - "password"
          - "secret"
        summary: info
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster, transform/sanitize_spans, redaction]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: otel
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-gateway }
  template:
    metadata:
      labels: { app: otel-gateway }
    spec:
      containers:
        - name: otelcol
          # The lab gateway's version (lgtm/lab/helm/otel-gateway/VERSION).
          image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
          args: ["--config=/conf/config.yaml"]
          ports:
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts:
            - { name: conf, mountPath: /conf }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: conf
          configMap: { name: otel-gateway }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: otel
spec:
  selector: { app: otel-gateway }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
