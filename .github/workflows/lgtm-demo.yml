# Builds the images of the lab copy of the OpenTelemetry Demo (lgtm/lab/demo).
# Pull requests: build every image and lint the chart, push nothing.
# Pushes to main (and manual runs on main): also push ghcr.io/serpe-nt/lgtm-demo:<VERSION>-<service>,
# where VERSION is the content of lgtm/lab/demo/VERSION (3.1.0-lab.<n>).
name: LGTM demo images

on:
  pull_request:
    paths: ["lgtm/lab/demo/**", ".github/workflows/lgtm-demo.yml"]
  push:
    branches: [main]
    paths: ["lgtm/lab/demo/**", ".github/workflows/lgtm-demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lgtm-demo-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/serpe-nt/lgtm-demo
  # Same value as OTEL_JAVA_AGENT_VERSION in lgtm/lab/demo/.env.
  OTEL_JAVA_AGENT_VERSION: "2.31.1"

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the pinned tools
        run: lgtm/lab/demo/scripts/tools.sh
      - name: Lint the chart and check the rendered manifests
        run: lgtm/lab/demo/scripts/chart-lint.sh

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: ad, dockerfile: src/ad/Dockerfile }
          - { service: cart, dockerfile: src/cart/src/Dockerfile }
          - { service: checkout, dockerfile: src/checkout/Dockerfile }
          - { service: flagd-ui, dockerfile: src/flagd-ui/Dockerfile }
          - { service: fraud-detection, dockerfile: src/fraud-detection/Dockerfile }
          - { service: frontend, dockerfile: src/frontend/Dockerfile }
          - { service: frontend-proxy, dockerfile: src/frontend-proxy/Dockerfile }
          - { service: image-provider, dockerfile: src/image-provider/Dockerfile }
          - { service: kafka, dockerfile: src/kafka/Dockerfile }
          - { service: load-generator, dockerfile: src/load-generator/Dockerfile }
          - { service: payment, dockerfile: src/payment/Dockerfile }
          - { service: product-catalog, dockerfile: src/product-catalog/Dockerfile }
          - { service: recommendation, dockerfile: src/recommendation/Dockerfile }
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: version
        run: echo "version=$(cat lgtm/lab/demo/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: lgtm/lab/demo
          file: lgtm/lab/demo/${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: |
            OTEL_JAVA_AGENT_VERSION=${{ env.OTEL_JAVA_AGENT_VERSION }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ matrix.service }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=lgtm-demo-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=lgtm-demo-${{ matrix.service }}
