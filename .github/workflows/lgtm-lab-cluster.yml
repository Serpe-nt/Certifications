---
# Lints and tests the LGTM lab VM script and cluster playbooks (card L1).
# Nothing here creates VMs or reaches a cluster.
name: lgtm lab cluster

"on":
  pull_request:
    paths:
      - lgtm/lab/vm/**
      - lgtm/lab/ansible/**
      - lgtm/lab/Makefile
      - lgtm/lab/mk/cluster.mk
      - .github/workflows/lgtm-lab-cluster.yml
  push:
    branches: [main]
    paths:
      - lgtm/lab/vm/**
      - lgtm/lab/ansible/**
      - lgtm/lab/Makefile
      - lgtm/lab/mk/cluster.mk
      - .github/workflows/lgtm-lab-cluster.yml

permissions:
  contents: read

jobs:
  ansible:
    name: yamllint, ansible-lint, syntax check, inventory
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lgtm/lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned tools into lgtm/lab/.venv
        run: make venv
      - name: Install the pinned collections
        run: make collections
      - name: Lint
        run: make lint

  powershell:
    name: PSScriptAnalyzer, Pester, plan
    runs-on: windows-2025
    defaults:
      run:
        shell: powershell
        working-directory: lgtm/lab/vm/hyperv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install PyYAML for the parser comparison test
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Install the pinned Pester and PSScriptAnalyzer into lgtm/lab/.bin
        run: .\tests\Install-TestTools.ps1
      - name: PSScriptAnalyzer and Pester (Windows PowerShell 5.1)
        run: .\tests\Invoke-Checks.ps1
      - name: Make a throwaway SSH key for the plan
        shell: bash
        run: ssh-keygen -q -t ed25519 -N '' -C lgtm-lab-ci -f "$RUNNER_TEMP/lgtm-lab-ci"
      # The runner has less memory and disk than the lab needs; plan reports that as
      # WARNING lines and still exits 0.
      - name: Print the plan
        run: .\lab-vms.ps1 plan -PublicKeyFile "$env:RUNNER_TEMP\lgtm-lab-ci.pub"
